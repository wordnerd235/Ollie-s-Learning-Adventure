<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ollie's Word Adventure</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#7fd0ff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Andika:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --font:'Fredoka','Baloo 2',ui-rounded,'SF Pro Rounded','Trebuchet MS','Comic Sans MS',system-ui,sans-serif;
  --letters:'Andika','Century Gothic','Trebuchet MS','Comic Sans MS',sans-serif;
  --sky1:#7fd0ff; --sky2:#c9ecff; --sky3:#fff3c4;
  --ink:#2b2350; --ink2:#6b6198;
  --card:rgba(255,255,255,.84); --card2:#ffffff;
  --line:rgba(43,35,80,.12);
  --cloud-o:.75;
  --primary:#7c5cff; --primary-d:#5a3fe0;
  --pink:#ff5fa2; --pink-d:#d23a80;
  --green:#34d399; --green-d:#159f72;
  --yellow:#ffd23f; --yellow-d:#dfa500;
  --blue:#4da3ff; --blue-d:#2a78d6;
  --vowel:#ff6a5b; --vowel-d:#d94a3c;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --sky1:#1a1550; --sky2:#28277a; --sky3:#4a3a8c;
    --ink:#f5f1ff; --ink2:#c4bbf0;
    --card:rgba(42,37,102,.88); --card2:#302b72;
    --line:rgba(255,255,255,.16); --cloud-o:.12;
  }
}
:root[data-theme="dark"]{
  --sky1:#1a1550; --sky2:#28277a; --sky3:#4a3a8c;
  --ink:#f5f1ff; --ink2:#c4bbf0;
  --card:rgba(42,37,102,.88); --card2:#302b72;
  --line:rgba(255,255,255,.16); --cloud-o:.12;
}
*,*::before,*::after{box-sizing:inherit}
html{
  height:100%;
  scroll-padding-top:env(safe-area-inset-top,0px);
  background:linear-gradient(180deg,var(--sky1),var(--sky2) 60%,var(--sky3)) fixed;
  overscroll-behavior:none;
}
body{
  margin:0;height:100%;overflow:hidden;background:transparent;
  font-family:var(--font);color:var(--ink);
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;
}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:4px solid #fff;outline-offset:3px;box-shadow:0 0 0 7px var(--primary)}

/* sky */
.sky{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.cloud{position:absolute;left:0;width:140px;height:44px;background:#fff;border-radius:44px;opacity:var(--cloud-o);animation:cloudmove linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:64px;height:64px;left:20px;top:-32px}
.cloud::after{width:84px;height:84px;right:18px;top:-44px}
@keyframes cloudmove{from{transform:translateX(-220px)}to{transform:translateX(calc(100vw + 220px))}}

#app{position:relative;z-index:1;height:100%}
#view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.col{width:100%;max-width:720px;margin:0 auto;padding:12px 16px 28px;min-height:100%;display:flex;flex-direction:column;gap:12px}

/* buttons */
.btn{border:0;border-radius:28px;padding:14px 24px;font-weight:700;font-size:clamp(18px,4.6vw,26px);color:#fff;
  background:var(--primary);box-shadow:0 8px 0 var(--primary-d),0 14px 22px rgba(43,35,80,.18);
  transition:transform .08s,box-shadow .08s;line-height:1.1;position:relative}
.btn:active{transform:translateY(6px);box-shadow:0 2px 0 var(--primary-d)}
.btn.big{padding:18px 28px;font-size:clamp(22px,6vw,32px);border-radius:32px;width:100%}
.btn.sm{padding:10px 16px;font-size:clamp(16px,4vw,20px);border-radius:22px;box-shadow:0 6px 0 var(--primary-d)}
.btn.green{background:var(--green);box-shadow:0 8px 0 var(--green-d),0 14px 22px rgba(21,159,114,.25)}
.btn.green:active{box-shadow:0 2px 0 var(--green-d)}
.btn.pink{background:var(--pink);box-shadow:0 8px 0 var(--pink-d),0 14px 22px rgba(210,58,128,.25)}
.btn.pink:active{box-shadow:0 2px 0 var(--pink-d)}
.btn.yellow{background:var(--yellow);color:#4a3600;box-shadow:0 8px 0 var(--yellow-d),0 14px 22px rgba(223,165,0,.25)}
.btn.yellow:active{box-shadow:0 2px 0 var(--yellow-d)}
.btn.blue{background:var(--blue);box-shadow:0 8px 0 var(--blue-d)}
.btn.blue.sm,.btn.yellow.sm,.btn.green.sm,.btn.pink.sm{box-shadow-width:0}
.btn.sm.blue{box-shadow:0 6px 0 var(--blue-d)}
.btn.sm.yellow{box-shadow:0 6px 0 var(--yellow-d)}
.btn.sm.green{box-shadow:0 6px 0 var(--green-d)}
.btn.sm.pink{box-shadow:0 6px 0 var(--pink-d)}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:0 6px 0 var(--line)}
.link{background:none;border:0;font-weight:600;font-size:clamp(16px,4vw,20px);color:var(--ink2);padding:10px 14px;border-radius:16px;text-decoration:underline;text-underline-offset:4px}
.rbtn{width:54px;height:54px;border-radius:50%;border:0;font-size:26px;background:var(--card2);box-shadow:0 5px 0 var(--line),0 8px 16px rgba(43,35,80,.12);display:grid;place-items:center}
.rbtn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.badge{position:absolute;top:-8px;right:-4px;background:var(--vowel);color:#fff;border-radius:999px;min-width:32px;height:32px;display:grid;place-items:center;font-size:18px;border:3px solid #fff}

/* top bar */
.top{display:flex;align-items:center;gap:10px;justify-content:space-between}
.ttl{font-weight:700;font-size:clamp(20px,5vw,28px);flex:1;text-align:center}
.starbadge{background:var(--card2);border-radius:999px;padding:8px 16px;font-weight:700;font-size:22px;box-shadow:0 5px 0 var(--line)}
.dots{display:flex;gap:7px;align-items:center;justify-content:center;flex:1}
.dots i{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.65);display:block;border:2px solid rgba(43,35,80,.1)}
.dots i.d{background:var(--green);border-color:var(--green-d)}
.dots i.c{background:var(--yellow);border-color:var(--yellow-d);transform:scale(1.35)}

/* mascot */
.mascot{display:flex;align-items:center;gap:10px}
.owl{background:none;border:0;font-size:56px;line-height:1;padding:0;filter:drop-shadow(0 6px 6px rgba(43,35,80,.2))}
.owl.sm{font-size:50px}
.bubble{position:relative;background:var(--card2);border-radius:22px;padding:12px 16px;font-weight:600;font-size:clamp(16px,4.2vw,21px);line-height:1.25;flex:1;box-shadow:0 5px 0 var(--line)}
.bubble::before{content:"";position:absolute;left:-10px;top:50%;margin-top:-10px;border:10px solid transparent;border-right-color:var(--card2);border-left:0}
.owl.talk{animation:owltalk .9s ease-in-out}
@keyframes owltalk{0%,100%{transform:none}20%{transform:translateY(-10px) rotate(-7deg)}45%{transform:translateY(0) rotate(5deg)}70%{transform:translateY(-4px) rotate(-3deg)}}

/* home */
.home{align-items:center;justify-content:center;text-align:center;gap:16px;position:relative}
.home .hero{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%}
.home .owl{font-size:clamp(96px,26vw,150px)}
.home .bubble{flex:none;max-width:420px}
.home .bubble::before{left:50%;top:-10px;margin:0 0 0 -10px;border:10px solid transparent;border-bottom-color:var(--card2);border-top:0}
.title{margin:0;font-size:clamp(34px,10vw,58px);line-height:1;font-weight:700;letter-spacing:-.5px;color:var(--ink);text-shadow:0 3px 0 rgba(255,255,255,.55)}
.title span{color:var(--primary)}
.menu{display:flex;flex-direction:column;gap:20px;width:100%;max-width:440px;margin-top:6px}
.stats{display:flex;gap:14px;align-items:center;font-weight:600;font-size:19px;background:var(--card);border-radius:999px;padding:8px 18px}
.known{font:inherit;font-weight:700;color:var(--ink);background:var(--card2);border:0;border-radius:999px;padding:6px 14px;box-shadow:0 4px 0 var(--line);cursor:pointer}
.known:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px}
.kw{background:var(--card);border:0;border-radius:22px;padding:10px 6px;box-shadow:0 5px 0 var(--line);display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink);cursor:pointer}
.kw .ke{font-size:44px;line-height:1}
.kw .kt{font-family:var(--letters);font-weight:700;font-size:26px}
.kw.boing{animation:tboing .5s}
.gear{position:absolute;right:6px;top:6px;width:48px;height:48px;border-radius:50%;border:0;background:var(--card);font-size:22px;opacity:.7}
.hint{font-size:13px;color:var(--ink2);margin-top:-6px}

/* activity */
.act{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%}
@keyframes wob{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg) scale(1.08)}}
.tiles{display:flex;justify-content:center;align-items:flex-end;width:100%;padding:8px 0 14px}
.tile{width:calc(var(--tw,90px)*var(--w,1));height:calc(var(--tw,90px)*1.18);font-size:calc(var(--tw,90px)*.68);
  display:grid;place-items:center;border-radius:24%;font-family:var(--letters);font-weight:700;color:#fff;line-height:1;
  box-shadow:0 8px 0 rgba(0,0,0,.2),0 14px 18px rgba(43,35,80,.18);cursor:pointer;
  text-shadow:0 3px 0 rgba(0,0,0,.18);transition:transform .12s;flex:none;padding-bottom:.04em}
.tile.v{background:linear-gradient(#ff8f7a,var(--vowel))}
.tile.d{background:linear-gradient(#b79bff,#8e6bff)}
.tile.c0{background:linear-gradient(#7cc0ff,var(--blue))}
.tile.c1{background:linear-gradient(#4de3c8,#1fb8a0)}
.tile.c2{background:linear-gradient(#ffc45c,#ff9f2e)}
.tile.c3{background:linear-gradient(#7ee7a1,#33c46e)}
.tile.silent{background:var(--card);border:4px dashed var(--ink2);color:var(--ink2);box-shadow:none;text-shadow:none;opacity:.8}
.tile.lit{transform:translateY(-14px) scale(1.14);filter:brightness(1.12);outline:6px solid rgba(255,255,255,.9)}
.tile.boing{animation:tboing .5s}
.tiles.sm .tile{box-shadow:0 5px 0 rgba(0,0,0,.2)}
.tiles.ok .tile{background:linear-gradient(#7ee7a1,var(--green));cursor:default}
@keyframes tboing{0%{transform:scale(1)}30%{transform:translateY(-14px) scale(1.15,.9)}60%{transform:translateY(0) scale(.94,1.08)}100%{transform:scale(1)}}
.helpers{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;padding-bottom:6px}
.micwrap{display:flex;flex-direction:column;align-items:center;gap:14px;min-height:150px;justify-content:center;width:100%}
.miclabel{font-weight:600;font-size:clamp(16px,4vw,20px);color:var(--ink);min-height:1.3em;text-align:center}
.say{font-weight:700;font-size:clamp(20px,5vw,26px);text-align:center}
.mic{width:clamp(96px,30vw,128px);aspect-ratio:1;border-radius:50%;border:0;font-size:clamp(44px,13vw,60px);color:#fff;
  background:radial-gradient(circle at 35% 30%,#ff9ac6,var(--pink) 60%,#e83e8c);
  box-shadow:0 10px 0 var(--pink-d),0 16px 28px rgba(210,58,128,.35);position:relative;animation:micidle 2.2s ease-in-out infinite;transition:transform .08s}
.mic::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:5px solid rgba(255,95,162,.5);opacity:0}
.mic:active{transform:translateY(6px);box-shadow:0 4px 0 var(--pink-d)}
.mic.listening{background:radial-gradient(circle at 35% 30%,#8ff0c2,var(--green) 60%,var(--green-d));box-shadow:0 10px 0 var(--green-d),0 16px 28px rgba(21,159,114,.4);animation:none}
.mic.on{background:radial-gradient(circle at 35% 30%,#8ff0c2,var(--green) 60%,var(--green-d));box-shadow:0 10px 0 var(--green-d);opacity:.75}
.mic.listening::after{border-color:rgba(52,211,153,.7);animation:ring 1.1s ease-out infinite}
.mic.shake{animation:micshake .5s}
@keyframes micidle{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes ring{0%{transform:scale(.9);opacity:.9}100%{transform:scale(1.5);opacity:0}}
@keyframes micshake{0%,100%{transform:rotate(0)}20%{transform:rotate(-8deg)}40%{transform:rotate(8deg)}60%{transform:rotate(-5deg)}80%{transform:rotate(5deg)}}
.bottomrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
.bottomrow [hidden]{display:none}

/* celebration overlay */
.overlay{position:fixed;inset:0;z-index:60;display:none}
.overlay.on{display:flex}
.cele{margin:auto;width:100%;max-width:640px;padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:12px;
  background:linear-gradient(180deg,rgba(255,243,196,.97),rgba(201,236,255,.97));min-height:100%;justify-content:center;animation:fadein .25s}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .cele{background:linear-gradient(180deg,rgba(74,58,140,.97),rgba(26,21,80,.98))}}
:root[data-theme="dark"] .cele{background:linear-gradient(180deg,rgba(74,58,140,.97),rgba(26,21,80,.98))}
.stage{container-type:inline-size;width:100%;height:clamp(180px,38vh,340px);display:grid;place-items:center;overflow:hidden}
.big{font-size:clamp(120px,36vmin,280px);line-height:1;display:inline-block;filter:drop-shadow(0 12px 14px rgba(43,35,80,.25))}
.cword{width:100%;max-width:420px}
.cpraise{font-size:clamp(30px,8vw,48px);font-weight:700;text-align:center;color:var(--primary);line-height:1.05}
@keyframes fadein{from{opacity:0}to{opacity:1}}

/* fx */
.fxlayer{position:fixed;inset:0;pointer-events:none;z-index:100;overflow:hidden}
.fxlayer i{position:absolute;top:-24px;animation:cf var(--d) ease-in forwards}
@keyframes cf{to{transform:translate3d(var(--x),110vh,0) rotate(720deg)}}
.fxlayer .bs{position:absolute;left:50%;top:40%;font-size:clamp(28px,7vmin,56px);animation:bs 1.2s ease-out forwards;opacity:0}
@keyframes bs{0%{transform:translate(-50%,-50%) scale(.3);opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.2) rotate(var(--r));opacity:0}}
.fxlayer .rf{position:absolute;top:-12%;font-size:clamp(26px,6vmin,44px);animation:rf var(--d) linear forwards}
@keyframes rf{to{transform:translateY(125vh) rotate(40deg)}}

/* emoji animations */
.anim-hop{animation:hop .9s ease-in-out infinite}
.anim-spin{animation:spin 1.6s ease-in-out infinite}
.anim-grow{animation:grow 1.1s ease-in-out infinite}
.anim-fly{animation:fly 1.8s ease-in-out infinite alternate}
.anim-float{animation:float 2s ease-in-out infinite alternate}
.anim-wiggle{animation:wiggle .5s ease-in-out infinite alternate}
.anim-shake{animation:shake .6s ease-in-out infinite}
.anim-glow{animation:glow 1.3s ease-in-out infinite}
.anim-zoom{animation:zoom 1.5s ease-in infinite}
.anim-pop{animation:pop 1.1s ease-in-out infinite}
.anim-swim{animation:swim 2s ease-in-out infinite}
.anim-sway{animation:sway 1.6s ease-in-out infinite;transform-origin:50% 90%}
.anim-twinkle{animation:twinkle 1.1s ease-in-out infinite}
.anim-drive{animation:drive 2.2s linear infinite}
.anim-fall{animation:fall 1.4s linear infinite}
.anim-splash{animation:splash .9s ease-in-out infinite}
.anim-drift{animation:drift 9s ease-in-out infinite alternate}
.anim-drift2{animation:drift 13s ease-in-out infinite alternate-reverse}
.anim-wave{animation:wave 1s ease-in-out infinite;transform-origin:70% 80%}
.em{display:inline-block;line-height:1}
@keyframes hop{0%,100%{transform:translateY(0) scale(1.05,.92)}30%{transform:translateY(-26%) scale(.95,1.08)}60%{transform:translateY(0) scale(1.08,.9)}}
@keyframes spin{0%{transform:rotate(0) scale(1)}50%{transform:rotate(180deg) scale(1.2)}100%{transform:rotate(360deg) scale(1)}}
@keyframes grow{0%,100%{transform:scale(1)}50%{transform:scale(1.32)}}
@keyframes fly{0%{transform:translate(-18cqw,4cqw) rotate(-10deg)}100%{transform:translate(18cqw,-6cqw) rotate(10deg)}}
@keyframes float{0%{transform:translateY(6%)}100%{transform:translateY(-14%)}}
@keyframes wiggle{0%{transform:rotate(-9deg)}100%{transform:rotate(9deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8%)}40%{transform:translateX(8%)}60%{transform:translateX(-6%)}80%{transform:translateX(6%)}}
@keyframes glow{0%,100%{transform:scale(1);filter:drop-shadow(0 0 0 rgba(255,210,60,0))}50%{transform:scale(1.13) rotate(8deg);filter:drop-shadow(0 0 .22em rgba(255,210,60,.95))}}
@keyframes zoom{0%{transform:translate(-70%,70%) scale(.6);opacity:0}15%{opacity:1}80%{opacity:1}100%{transform:translate(70%,-70%) scale(1.15);opacity:0}}
@keyframes pop{0%,100%{transform:scale(1)}25%{transform:scale(1.3) rotate(-6deg)}50%{transform:scale(.95)}75%{transform:scale(1.15) rotate(6deg)}}
@keyframes swim{0%,100%{transform:translateX(-16%) rotate(-4deg)}50%{transform:translateX(16%) rotate(4deg)}}
@keyframes sway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@keyframes twinkle{0%,100%{transform:scale(.85) rotate(0);filter:brightness(1)}50%{transform:scale(1.25) rotate(20deg);filter:brightness(1.3)}}
@keyframes drive{0%{transform:translateX(36cqw)}100%{transform:translateX(-36cqw)}}
@keyframes fall{0%{transform:translateY(-14cqw);opacity:0}15%{opacity:1}100%{transform:translateY(70cqw);opacity:0}}
@keyframes splash{0%,100%{transform:scale(1)}30%{transform:scale(1.25,.8)}60%{transform:scale(.85,1.25) translateY(-10%)}}
@keyframes drift{0%{transform:translateX(-7cqw)}100%{transform:translateX(9cqw)}}
@keyframes wave{0%,100%{transform:rotate(0)}30%{transform:rotate(22deg)}60%{transform:rotate(-14deg)}}
@keyframes idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-4%)}}
@keyframes popin{0%{transform:translate(-50%,-50%) scale(0)}70%{transform:translate(-50%,-50%) scale(1.2)}100%{transform:translate(-50%,-50%) scale(1)}}
.em.d2{animation-delay:.45s}.em.d3{animation-delay:.9s}

/* story */
.scene{position:relative;width:100%;aspect-ratio:4/3;border-radius:30px;overflow:hidden;container-type:inline-size;border:5px solid #fff;
  box-shadow:0 10px 0 rgba(43,35,80,.14),0 18px 30px rgba(43,35,80,.18);flex:none}
.bg-day{background:linear-gradient(#78cdff,#c8ecff 62%)}
.bg-day .ground{background:#7fd36e}
.bg-water{background:linear-gradient(#a5e3ff 0 34%,#4db5ff 34%,#1d7fe0)}
.bg-water .ground{display:none}
.bg-rain{background:linear-gradient(#8fa6bd,#c3d0dc 62%)}
.bg-rain .ground{background:#6fb46a}
.bg-home{background:linear-gradient(#ffe6cf,#ffd2dc 68%)}
.bg-home .ground{background:#e8b98b;height:34%;left:0;right:0;bottom:0;border-radius:0}
.ground{position:absolute;left:-10%;right:-10%;bottom:-24%;height:50%;border-radius:50%}
.it{position:absolute;transform:translate(-50%,-50%);line-height:1;pointer-events:none;font-size:calc(var(--s)*1cqw);animation:popin .55s both}
.scene:not(.done) .it:not(.decor) .em{animation:idle 2.6s ease-in-out infinite}
.sent{font-size:clamp(28px,7.4vw,46px);font-weight:600;line-height:1.35;text-align:center;padding:4px 6px}
.sent .w{display:inline-block;padding:0 8px;margin:2px 0;border-radius:14px;transition:background .2s,color .2s}
.sent .w.on{background:#ffe27a;color:#4a3600}
.sent .w.tg{border-bottom:6px dashed var(--pink)}
.sent .w.tg.active{animation:pop 1.1s ease-in-out infinite;background:#ffd6e8;color:#7a1848}
.sent .w.tg.ok{border-bottom-color:transparent;color:var(--green-d);font-weight:700}
.act.compact{gap:8px}
.act.compact .tiles{padding:4px 0 8px}
.act.compact .micwrap{min-height:0;flex-direction:row;gap:18px}
.act.compact .mic{width:92px;font-size:42px}
.story-ctl{display:flex;justify-content:center;min-height:70px}
.scards{display:flex;flex-direction:column;gap:16px}
.scard{display:flex;gap:14px;align-items:center;background:var(--card);border-radius:28px;padding:14px 16px;box-shadow:0 6px 0 var(--line)}
.scard .semoji{font-size:60px;flex:none;width:80px;text-align:center}
.scard.locked .semoji{filter:grayscale(1);opacity:.55}
.scard h3{margin:0 0 4px;font-size:clamp(20px,5vw,26px)}
.scard p{margin:0 0 8px;font-size:16px;color:var(--ink2);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}

.bigtitle{font-size:clamp(34px,9vw,54px);font-weight:700;line-height:1.05}

/* modal */
.modal{position:fixed;inset:0;z-index:80;display:none;background:rgba(30,20,70,.55);padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));overflow-y:auto;-webkit-overflow-scrolling:touch}
.modal.on{display:block}
.mcard{background:var(--card2);color:var(--ink);border-radius:30px;max-width:560px;margin:0 auto;padding:22px;display:flex;flex-direction:column;gap:14px;box-shadow:0 18px 40px rgba(0,0,0,.35);user-select:text;-webkit-user-select:text}
.mcard h2{margin:0;font-size:28px}
.mcard h3{margin:6px 0 0;font-size:19px}
.mcard p{margin:0;font-size:16px;line-height:1.4;color:var(--ink2)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:600;font-size:18px}
.row small{display:block;font-weight:400;color:var(--ink2);font-size:14px}
input[type=text],select{font:inherit;font-size:18px;padding:12px 14px;border-radius:16px;border:3px solid var(--line);background:var(--card2);color:var(--ink);width:100%;user-select:text;-webkit-user-select:text}
.sw{position:relative;width:60px;height:34px;flex:none}
.sw input{appearance:none;-webkit-appearance:none;width:60px;height:34px;border-radius:999px;background:#b9b3d6;margin:0;cursor:pointer;transition:background .2s;position:absolute;inset:0}
.sw input::after{content:"";position:absolute;left:3px;top:3px;width:28px;height:28px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 2px 4px rgba(0,0,0,.3)}
.sw input:checked{background:var(--green)}
.sw input:checked::after{transform:translateX(26px)}
.small-status{font-size:15px;background:var(--card);border-radius:14px;padding:10px 12px;min-height:1.4em}
.lvls{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:16px;font-weight:500}

/* grown-up notes + voice recorder */
.gnote{font-size:14px;line-height:1.35;color:var(--ink2);background:var(--card);border-radius:14px;padding:8px 12px;max-width:460px;text-align:center;margin:6px auto 0}
.gnote button{font:inherit;font-weight:700;color:var(--primary);background:none;border:0;padding:0;text-decoration:underline;cursor:pointer}
.vhead{background:var(--card);border-radius:18px;padding:12px 14px;font-size:15px;line-height:1.4}
.vhead b{font-weight:700}
.col h3.vh{margin:8px 0 0;font-size:20px}
.col h3.vh small{font-weight:400;color:var(--ink2);font-size:15px}
.col p.vp{margin:0;font-size:15px;color:var(--ink2)}
.vlist{display:flex;flex-direction:column;gap:8px}
.vrow{display:flex;align-items:center;gap:8px;background:var(--card2);border-radius:16px;padding:8px 10px;box-shadow:0 3px 0 var(--line)}
.vrow .vl{flex:1;display:flex;align-items:center;gap:10px;min-width:0;font-size:15px;color:var(--ink2)}
.vrow .vl b{font-family:var(--letters);font-size:26px;color:var(--ink);min-width:56px;white-space:nowrap}
.vrow.has .vl b::after{content:" ✓";color:var(--green-d);font-size:18px;font-family:inherit}
.vb{width:46px;height:46px;border-radius:50%;border:0;font-size:18px;flex:none;cursor:pointer;background:var(--card);color:var(--ink);box-shadow:0 3px 0 var(--line)}
.vb.rec{background:var(--pink);color:#fff}
.vb.rec.on{background:#e11d48;animation:recpulse .8s ease-in-out infinite}
.vrow .vt{color:var(--ink);font-weight:600;font-size:16px;line-height:1.3;white-space:normal}
.vsec{background:var(--card);border-radius:18px;padding:4px 12px 10px}
.vsec>summary{font-weight:700;font-size:18px;padding:10px 2px;cursor:pointer}
.vsec .vgo{margin:4px 0 10px}
.gwrap{position:fixed;inset:0;background:rgba(20,16,50,.6);z-index:300;display:grid;place-items:center;padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(14px + env(safe-area-inset-bottom,0px))}
.gcard{background:var(--card2);border-radius:26px;padding:16px 18px 18px;width:min(560px,100%);display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.gtop{display:flex;justify-content:space-between;align-items:center;font-weight:600;color:var(--ink2)}

  let n=0;
  for(let i=3;i<m;i++){
    const before=Math.max(pk[i-1],pk[i-2],pk[i-3]);
    if(!(before<.02&&pk[i]>.12&&pk[i]>8*Math.max(before,1e-3)))continue;
    let s0=(i-1)*w;while(s0<(i+1)*w&&Math.abs(f[s0])<.01)s0++;     // where the sound actually starts
    for(let j=0;j<L&&s0+j<f.length;j++)f[s0+j]*=.5-.5*Math.cos(Math.PI*j/L);
    n++;

}
function playClip(k){

  let b=BUFS[k];
  if(!b){b=ctx.createBuffer(1,c.data.length,c.sr);b.getChannelData(0).set(clipFloat(c));BUFS[k]=b;}
  return playBuf(b);
}
function playBuf(b){
  if(SILENT)return Promise.resolve();
  const ctx=ac();hushMic();
  return new Promise(res=>{
    // a 5 ms fade-in (and a fade-out when stopped early, see stopClips): a hard start or cut clicks
    const src=ctx.createBufferSource(),g=ctx.createGain(),t=ctx.currentTime;src.buffer=b;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(1,t+.005);src._g=g;
    src.connect(g);g.connect(vbus||ctx.destination);
    let done=false;const fin=()=>{if(done)return;done=true;PLAYING.delete(src);AUDIO_END=Date.now();res();};
    src.onended=fin;PLAYING.add(src);setTimeout(fin,b.duration*1000+500);

}

/* WSOLA time-stretch: slows speech without lowering the pitch. rate<1 = slower. */
function stretchPCM(x,sr,rate){
  const N=Math.round(sr*.03)&~1,Hs=N>>1,Ha=Hs*rate,tol=Math.round(sr*.009);
  const win=new Float32Array(N);for(let i=0;i<N;i++)win[i]=.5-.5*Math.cos(2*Math.PI*i/(N-1));
  const y=new Float32Array(Math.ceil(x.length/rate)+2*N),nrm=new Float32Array(y.length);
  let prev=0,out=0,last=0;
  for(let k=0;;k++,out+=Hs){
    const nom=Math.round(k*Ha);if(nom+N>=x.length)break;
    let best=nom;
    const ref=prev+Hs;
    if(k>0&&ref+N<x.length){
      let bc=-Infinity;
      for(let d=-tol;d<=tol;d+=2){const c0=nom+d;if(c0<0||c0+N>=x.length)continue;
        let c=0;for(let i=0;i<N;i+=4)c+=x[c0+i]*x[ref+i];if(c>bc){bc=c;best=c0;}}
    }
    for(let i=0;i<N;i++){y[out+i]+=x[best+i]*win[i];nrm[out+i]+=win[i];}
    prev=best;last=out+N;
  }
  for(let i=0;i<last;i++)if(nrm[i]>.05)y[i]/=nrm[i];
  return y.subarray(0,last);
}
function playClipAt(k,rate){

  const bk='~'+rate+':'+k;let b=BUFS[bk];
  if(!b){const f=clipFloat(c);
    const y=stretchPCM(f,c.sr,rate);b=ctx.createBuffer(1,y.length,c.sr);b.getChannelData(0).set(y);BUFS[bk]=b;}

}
/* seconds a Murf line will take (null if it would use the device voice) */

  splitSent(text).forEach((x,i)=>{if(i)t+=SENT_GAP/1000;});
  for(const x of splitSent(text)){const c=clipsFor(x);if(!c)return null;
    for(const it of c){const cl=CLIPS[it.k];t+=cl.data.length/cl.sr/(it.mine?1:effRate(rate));}}

function stopClips(){

    if(g){g.gain.cancelScheduledValues(t);g.gain.setValueAtTime(g.gain.value,t);g.gain.linearRampToValueAtTime(0,t+.005);x.stop(t+.008);}

  if(useMine()){const p=playClip('p:'+t.s);if(p)return p;}
  const ph=PHK[t.s];

/* ---- microphone capture for recordings ---- */
let CAP=null;

function startCapture(stream,{maxSec=3,onLevel,quietSec=.6}={}){
  const ctx=ac(),src=ctx.createMediaStreamSource(stream),proc=ctx.createScriptProcessor(2048,1,1),mute=ctx.createGain();
  mute.gain.value=0;

  const done=new Promise(r=>resolve=r);
  proc.onaudioprocess=e=>{
    if(stopped)return;

    let q=0;for(let i=0;i<d.length;i++)q+=d[i]*d[i];const rms=Math.sqrt(q/d.length),dt=d.length/ctx.sampleRate;el+=dt;
    if(rms<floor)floor=rms;

    if(rms>Math.max(.025,floor*4)){heard=true;quiet=0;}else if(heard)quiet+=dt;
    if((heard&&quiet>quietSec)||el>maxSec)stop();

    if(stopped)return;stopped=true;
    try{proc.disconnect();src.disconnect();mute.disconnect();}catch(e){}
    stream.getTracks().forEach(t=>t.stop());sessionPlayback();
    let n=0;chunks.forEach(c=>n+=c.length);const all=new Float32Array(n);let o=0;chunks.forEach(c=>{all.set(c,o);o+=c.length;});
    resolve({sr:ctx.sampleRate,f:all});

}
/* trim silence, normalise, fade edges, store as 16-bit */
function trimClip({sr,f},o={}){
  let rate=sr,d=f;
  if(sr>=44000){const n=f.length>>1;d=new Float32Array(n);for(let i=0;i<n;i++)d[i]=(f[2*i]+f[2*i+1])/2;rate=sr/2;}
  const win=Math.max(1,Math.round(rate*.01)),nw=Math.floor(d.length/win);if(nw<5)return null;
  const r=new Float32Array(nw);let peak=0;
  for(let w=0;w<nw;w++){let q=0;for(let i=w*win;i<(w+1)*win;i++)q+=d[i]*d[i];r[w]=Math.sqrt(q/win);if(r[w]>peak)peak=r[w];}
  if(peak<.01)return null;
  const floor=[...r].sort((x,y)=>x-y)[Math.floor(nw*.1)],thr=o.loose?peak*.015:Math.max(floor*3,peak*.08);
  let a=0;while(a<nw&&r[a]<thr)a++;let b=nw-1;while(b>a&&r[b]<thr)b--;
  const out=d.slice(Math.max(0,(a-(o.loose?6:4))*win),Math.min(d.length,(b+(o.loose?15:8))*win));
  let mx=0;for(let i=0;i<out.length;i++)mx=Math.max(mx,Math.abs(out[i]));

}

/* =====================================================================
   VOICE FILES — the AI voice and the grown-up's recordings live next to
   the game in voice/ and are downloaded into IndexedDB on first visit.
     voice/manifest.json  {format:1, parts:{ai:{v,files,bytes,n,murf}, mine:{…}}}
     voice/ai-N.bin       AI voice lines (m: keys)
     voice/mine-N.bin     the grown-up's recordings (p: w: r: keys)
   .bin layout: "OLLV" · u32 format (1) · u32 header length · header JSON
   (padded to 4 bytes) · the clips' 16-bit samples back to back.
   header = {part, clips:[[key, sampleRate, samples, wordTimings|null, recordedAt], …]}
   v is a hash of the part's files, so a device only downloads a part when it changes.
   Keep tools/extract.html in step with this format.
   ===================================================================== */
const VOICE_DIR='voice/',VOICE_CHUNK=20*1048576;
const VOICE_PARTS={ai:{pre:['m:'],label:'AI voice'},mine:{pre:['p:','w:','r:'],label:'Your recordings'}};
const partOf=k=>k==='m:__preview'?null:Object.keys(VOICE_PARTS).find(p=>VOICE_PARTS[p].pre.some(x=>k.startsWith(x)))||null;
const partKeys=p=>Object.keys(CLIPS).filter(k=>partOf(k)===p).sort();
const voiceVer={get(p){try{return localStorage.getItem('ollie-voice-v:'+p)||''}catch(e){return ''}},
  set(p,v){try{localStorage.setItem('ollie-voice-v:'+p,v)}catch(e){}}};
let VOICE={site:null,err:'',busy:false,state:'checking',frac:0};   // state: checking | loading | ready | failed
/* two-lane FNV-1a over bytes, fed in pieces; the same in tools/extract.html */
function hasher(){
  let a=0x811c9dc5,b=0x01000193^0x5bd1e995,n=0;
  return {update(u8){for(let i=0;i<u8.length;i++){const x=u8[i];a=Math.imul(a^x,0x01000193);b=Math.imul(b^x,0x5bd1e995)^(b>>>15);}n+=u8.length;},
    hex(){const h=x=>(x>>>0).toString(16).padStart(8,'0');return h(a)+h(Math.imul(b^n,0x01000193));}};
}
const u8of=d=>new Uint8Array(d.buffer,d.byteOffset,d.byteLength);
/* build one part's files from the clips on this device */
function packPart(part){
  const keys=partKeys(part),chunks=[];let cur=null;
  keys.forEach(k=>{const c=CLIPS[k],sz=c.data.length*2;
    if(!cur||(cur.bytes+sz>VOICE_CHUNK&&cur.keys.length)){cur={keys:[],bytes:0};chunks.push(cur);}
    cur.keys.push(k);cur.bytes+=sz;});
  const H=hasher(),files=[];let bytes=0;
  chunks.forEach((ch,i)=>{
    const head=JSON.stringify({part,clips:ch.keys.map(k=>{const c=CLIPS[k];return [k,c.sr,c.data.length,c.w||null,part==='mine'?(c.at||0):0];})});
    let hb=new TextEncoder().encode(head);const pad=(4-(12+hb.length)%4)%4;
    if(pad){const x=new Uint8Array(hb.length+pad).fill(32);x.set(hb);hb=x;}
    const pre=new Uint8Array(12);pre.set([79,76,76,86]);const dv=new DataView(pre.buffer);dv.setUint32(4,1,true);dv.setUint32(8,hb.length,true);
    const blobParts=[pre,hb];H.update(pre);H.update(hb);
    ch.keys.forEach(k=>{const u=u8of(CLIPS[k].data);blobParts.push(u);H.update(u);});
    const blob=new Blob(blobParts,{type:'application/octet-stream'});bytes+=blob.size;
    files.push({name:`${part}-${i+1}.bin`,blob});
  });
  return {part,files,n:keys.length,bytes,v:keys.length?H.hex():''};
}
/* read one .bin file; returns [[key, clip], …] */
function unpackFile(buf){
  const dv=new DataView(buf);
  if(buf.byteLength<12||dv.getUint32(0,false)!==0x4f4c4c56||dv.getUint32(4,true)!==1)throw new Error('not an Ollie voice file');
  const hl=dv.getUint32(8,true),head=JSON.parse(new TextDecoder().decode(new Uint8Array(buf,12,hl)));
  let off=12+hl;const out=[];
  for(const [k,sr,len,w,at] of head.clips){
    const data=new Int16Array(buf.slice(off,off+len*2));off+=len*2;   // own copy per clip, so IndexedDB stores just this clip
    const clip={sr,data,at:at||(head.part==='mine'?0:Date.now())};if(w)clip.w=w;out.push([k,clip]);
  }
  return {part:head.part,clips:out};
}
async function fetchBytes(url,onBytes){
  const r=await fetch(url);if(!r.ok)throw new Error(`${url}: error ${r.status}`);
  if(!r.body||!r.body.getReader){const b=await r.arrayBuffer();onBytes(b.byteLength);return b;}
  const rd=r.body.getReader(),parts=[];let n=0;
  for(;;){const {done,value}=await rd.read();if(done)break;parts.push(value);n+=value.length;onBytes(value.length);}
  const out=new Uint8Array(n);let o=0;parts.forEach(p=>{out.set(p,o);o+=p.length;});return out.buffer;
}
/* put a part's clips into IndexedDB. A new AI voice replaces the old one's lines;
   the grown-up's own recordings are only replaced by newer ones. */
async function importPart(part,info,bufs){
  if(part==='ai'){const m=info.murf||{};
    if(m.built&&S.settings.murfBuilt&&S.settings.murfBuilt!==m.built){for(const k of Object.keys(CLIPS))if(k.startsWith('m:'))await delClip(k);}}
  let batch=[];
  for(const buf of bufs){
    for(const [k,clip] of unpackFile(buf).clips){
      if(partOf(k)!==part)continue;
      if(part==='mine'&&CLIPS[k]&&(CLIPS[k].at||0)>(clip.at||0))continue;
      CLIPS[k]=clip;dropBufs(k);batch.push([k,clip]);
      if(batch.length>=50){try{await VDB.putMany(batch);}catch(e){}batch=[];await sleep(0);}
    }
  }
  if(batch.length){try{await VDB.putMany(batch);}catch(e){}}
  if(part==='ai'){const m=info.murf||{};S.settings.murf=true;
    if(m.built){S.settings.murfVoice=m.voice||'';S.settings.murfStyle=m.style||'';S.settings.murfBuilt=m.built;}S.missing=[];persist();}
}
/* download progress, shown by the welcome's bar and the returning player's voice card */
function voiceBar(frac){if(frac==null)return;VOICE.frac=frac;gateUpdate();}
/* Until the voice is on this device, the welcome's "Let's go" waits (and a returning player sees a
   small card instead of the menu), so Ollie's first words are in the downloaded voice.
   "Continue without sound" skips the wait with everything muted for this visit. */
const waiting=()=>VOICE.state==='checking'||VOICE.state==='loading';
function gateUpdate(){
  const pct=Math.round(Math.min(1,VOICE.frac||0)*100);
  $$('[data-vgate-bar]').forEach(i=>i.style.width=pct+'%');
  const go=$('#w-go');
  if(go){
    const w=waiting()&&!SILENT;go.disabled=w;
    $('#w-wait').style.display=w?'flex':'none';
    $('#w-fail').hidden=VOICE.state!=='failed';
  }
  const g=$('#vgate');
  if(!g&&VOICE.state==='loading'&&S.seen&&!SILENT&&!modal.classList.contains('on'))voiceGate();
  if(g&&!waiting())g.remove();
}
function voiceGate(){
  const g=document.createElement('div');g.id='vgate';g.className='gwrap';
  g.innerHTML=`<div class="gcard" style="align-items:center;text-align:center">
    <div style="font-size:80px;line-height:1" aria-hidden="true">🦉🔊</div>
    <div class="gtext" style="min-height:0">Getting Ollie's voice…</div>
    <div class="vmeter" style="width:100%;height:14px;border-radius:7px"><i data-vgate-bar></i></div>
    <button class="link" data-a="silent">Continue without sound</button></div>`;
  g.onclick=e=>{if(e.target.closest('[data-a="silent"]')){SILENT=true;stopSpeech();g.remove();}};
  document.body.appendChild(g);gateUpdate();
}
async function loadVoice(){
  try{await fetchVoice();}catch(e){VOICE.err=e.message||String(e);}
  VOICE.state=VOICE.err?'failed':'ready';VOICE.busy=false;voiceBar(null);
  if(VOICE.state==='ready')SILENT=false;
  gateUpdate();
}
async function fetchVoice(){
  let man;
  try{const r=await fetch(VOICE_DIR+'manifest.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)return;man=await r.json();}catch(e){return;}
  if(!man||man.format!==1||!man.parts)return;
  VOICE.site=man;
  let oldPack='';try{oldPack=localStorage.getItem('ollie-pack-id')||'';}catch(e){}
  const todo=[];
  for(const part of Object.keys(VOICE_PARTS)){
    const p=man.parts[part];if(!p||!p.v||!Array.isArray(p.files)||!p.files.length)continue;
    if(voiceVer.get(part)===p.v)continue;
    // this device already has these clips from the old all-in-one game file
    if(p.pack&&p.pack===oldPack&&partKeys(part).length){voiceVer.set(part,p.v);continue;}
    todo.push([part,p]);
  }
  if(!todo.length)return;
  VOICE.busy=true;VOICE.state='loading';gateUpdate();
  const total=todo.reduce((a,[,p])=>a+(p.bytes||0),0)||1;let got=0;
  voiceBar(0);
  try{
    for(const [part,p] of todo){
      const bufs=[];
      for(const f of p.files)bufs.push(await fetchBytes(VOICE_DIR+f+'?v='+p.v,n=>{got+=n;voiceBar(got/total);}));
      await importPart(part,p,bufs);
      voiceVer.set(part,p.v);
    }
    VOICE.err='';
  }catch(e){VOICE.err=e.message||String(e);}
  VOICE.busy=false;voiceBar(null);
}
function voiceSiteInfo(){
  const P=VOICE.site&&VOICE.site.parts;
  let t=P?'Voice on the site: '+Object.keys(VOICE_PARTS).filter(p=>P[p]).map(p=>`${VOICE_PARTS[p].label.toLowerCase()} (${P[p].n||0} lines)`).join(', ')+'.'
    :'No voice files were found next to the game, so Ollie uses the voice on this device.';
  if(VOICE.busy)t+=' Downloading it now…';else if(VOICE.err)t+=' The last download didn’t finish ('+VOICE.err+'); it will try again next time.';
  return escH(t);
}
/* make the voice files from this device, to upload to the voice/ folder on GitHub */
function buildVoiceFiles(){
  const site=(VOICE.site&&VOICE.site.parts)||{},out={parts:[],files:[]},man={format:1,made:new Date().toISOString().slice(0,10),parts:{}};

   and keeps listening. */
function listenFor(word,long,opts={}){
  const cont=!!opts.cont||!!opts.session,sess=!!opts.session,W=typeof word==='function'?word:()=>word;
  return new Promise(async resolve=>{
    const my=++srSess;let done=false,heard='',tm=0,rec;const pre=[];
    const finish=r=>{if(done)return;done=true;if(cont)LISTEN_CONT=false;if(sess)LISTEN_SESSION=false;CAP_END=Date.now();clearTimeout(tm);if(srBusy){try{rec.abort()}catch(e){}}if(curRec===rec)curRec=null;sessionPlayback();bounceAC();r.heard=heard;resolve(r);};
    try{rec=getSR();rec.continuous=cont;}catch(e){finish({ok:false,err:'start'});return;}
    for(let n=0;n<14&&srBusy;n++)await sleep(50);   // let a previous session end first
    if(my!==srSess){finish({ok:false,err:'aborted'});return;}
    tm=setTimeout(()=>finish({ok:false,err:'timeout'}),cont?60000:long?15000:9000);
    rec.onstart=()=>{srBusy=true;adbg('recognition started');};
    rec.onresult=e=>{
      if(my!==srSess)return;
      const w=W(),deaf=cont&&(deafNow()||!w);
      for(let i=e.resultIndex;i<e.results.length;i++){
        const res=e.results[i];
        if(deaf){pre[i]=res[0]?res[0].transcript:'';continue;}
        const full=res[0]?res[0].transcript:'';
        for(let j=0;j<res.length;j++){
          let tx=res[j].transcript;const p=pre[i]||'';if(p&&tx.startsWith(p))tx=tx.slice(p.length);
          if(j===0)heard=tx.trim();
          if(matches(w,tx)){
            if(sess){pre[i]=full;heard='';opts.onHit&&opts.onHit();return;}   // keep listening for the next word
            finish({ok:true});return;}
        }
      }
      if(deaf)return;
      const last=e.results[e.results.length-1];
      if(last&&last.isFinal){
        if(!cont){finish({ok:false,err:'nomatch'});return;}
        if(heard&&opts.onMiss){opts.onMiss({ok:false,err:'nomatch',heard});}
        heard='';
      }
    };
    rec.onerror=e=>{if(my!==srSess||(e&&e.error==='aborted'))return;if(cont&&e&&e.error==='no-speech')return;finish({ok:false,err:(e&&e.error)||'error'});};
    rec.onend=()=>{srBusy=false;adbg('recognition ended');if(my===srSess)finish({ok:false,err:'end'});};
    curRec=rec;if(cont)LISTEN_CONT=true;if(sess)LISTEN_SESSION=true;
    sessionRecord();
    try{rec.start();srBusy=true;}
    catch(e){await sleep(300);try{rec.start();srBusy=true;}catch(e2){finish({ok:false,err:'start'});}}
  });
}
/* MIC SESSION: while the mic is on, one continuous listen covers the whole round or story (every
   stop/start makes iOS chime, and sound right after a stop is lost). Each word activity sets
   MIC.target {word, hit, miss, blocked}; between words, and while Ollie talks, what is heard is ignored.
   It ends when the mic is turned off, the exercise ends (micOff), or iOS ends it and it can't restart. */
const MIC={target:null,run:0,live:false,fresh:false};
async function micSession(){
  if(MIC.live)return;MIC.live=true;const my=++MIC.run;let fast=0;
  const T=()=>MIC.target;
  while(MIC_ON&&my===MIC.run){
    const t0=Date.now();
    const r=await listenFor(()=>T()&&T().word,true,{session:true,
      onHit:()=>{const t=T();MIC.target=null;fast=0;t&&t.hit();},
      onMiss:r=>{fast=0;T()&&T().miss(r);}});
    if(!MIC_ON||my!==MIC.run)break;
    const hard=['not-allowed','service-not-allowed','audio-capture','network','start'].includes(r.err);
    if(hard&&MIC.fresh){MIC.fresh=false;await sleep(400);continue;}   // first try after the permission prompt can fail once
    if(hard){MIC_ON=false;T()&&T().blocked(r.err);break;}
    MIC.fresh=false;
    if(r.heard&&T()){fast=0;T().miss(r);continue;}
    // iOS ended it: start again, but don't spin if it keeps ending instantly
    if(Date.now()-t0<800){if(++fast>=3){MIC_ON=false;T()&&T().idle();break;}await sleep(500);}else fast=0;
  }
  if(my===MIC.run)MIC.live=false;
}
async function probeMic(){
  sessionRecord();
  try{const st=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,autoGainControl:false,noiseSuppression:false}});st.getTracks().forEach(t=>t.stop());}
  finally{sessionPlayback();}
}

/* ---- tiles ---- */
function tilesHtml(tiles,tag='span'){
  let ci=0;
  return tiles.map((t,i)=>{
    const v=isVowelTile(t),dg=t.t.length>1&&!v;
    const cls=t.s==='-'?'silent':v?'v':dg?'d':'c'+(ci++%4);

  }).join('');
}
function layoutTiles(box){
  if(!box)return;
  const els=[...box.children];if(!els.length)return;
  const W=box.clientWidth||(box.parentElement&&box.parentElement.clientWidth)||320;
  const units=els.reduce((s,e)=>s+(parseFloat(e.style.getPropertyValue('--w'))||1),0);
  const gap=Math.max(6,W*.02),max=+box.dataset.max||140;
  const tw=Math.max(34,Math.min(max,(W-gap*(els.length-1))/units));
  box.style.setProperty('--tw',tw+'px');box.style.gap=gap+'px';
}
window.addEventListener('resize',()=>$$('.tiles').forEach(layoutTiles));

/* =====================================================================
   PROGRESS
   ===================================================================== */
function record(word,kind){
  const st=S.words[word.w]||(S.words[word.w]={n:0,ok:0,sc:0,sk:0});
  st.n++;
  if(kind==='clean'){st.ok++;st.sc+=1;}else if(kind==='helped'){st.ok++;st.sc+=.6;}else st.sk++;
  if(kind!=='skip')S.stars++;
  S.recentWords=(S.recentWords||[]).concat(word.w).slice(-8);
  S.recent=(S.recent||[]).concat({l:word.lvl,ok:kind!=='skip'}).slice(-14);
  let msg=null;
  const win=S.recent.filter(r=>r.l===S.frontier);
  if(win.length>=6){
    const rate=win.filter(r=>r.ok).length/win.length;
    if(rate>=.8&&S.frontier<5){S.frontier++;S.recent=[];msg='up';}
    else if(rate<=.35&&S.frontier>1){S.frontier--;S.recent=[];}
  }
  persist();return msg;
}
function earnSticker(){
  const left=STICKERS.filter(s=>!S.stickers.includes(s));
  if(!left.length)return null;
  const s=left[0];S.stickers.push(s);persist();return s;
}
function goalWords(){
  const cand=STORIES.filter(s=>!storyUnlocked(s)).map(s=>({s,miss:s.targets.filter(w=>!isKnown(w))})).sort((a,b)=>a.miss.length-b.miss.length);
  return new Set(cand.length?cand[0].miss:[]);
}
function pickWeighted(pool,goal,exclude){
  const items=pool.filter(w=>!exclude.includes(w));
  if(!items.length)return null;
  const rw=S.recentWords||[];
  const wts=items.map(w=>{
    const st=S.words[w.w];let x=!st||!st.n?2.2:(!isKnown(w.w)?3:.9);
    if(w.lvl===S.frontier)x*=1.4;
    if(goal.has(w.w)&&!isKnown(w.w))x*=2.2;
    if(rw.includes(w.w))x*=.05;
    return x;});
  let r=Math.random()*wts.reduce((a,b)=>a+b,0);
  for(let i=0;i<items.length;i++){r-=wts[i];if(r<=0)return items[i];}
  return items[items.length-1];
}
function buildRound(){
  const goal=goalWords(),pool=WORDS.filter(w=>w.lvl<=S.frontier),chosen=[];
  const warmPool=pool.filter(w=>isKnown(w.w)||w.lvl===1||(S.words[w.w]&&S.words[w.w].ok>0));
  const warm=pickWeighted(warmPool.length?warmPool:pool,new Set(),[]);
  if(warm)chosen.push(warm);
  const stretchPool=WORDS.filter(w=>w.lvl===S.frontier+1&&!isKnown(w.w));
  const stretch=stretchPool.length?pickWeighted(stretchPool,goal,chosen):null;
  while(chosen.length<(stretch?5:6)){const w=pickWeighted(pool,goal,chosen);if(!w)break;chosen.push(w);}
  if(stretch)chosen.splice(Math.min(3,chosen.length),0,stretch);
  return chosen;
}

/* =====================================================================
   WORD ACTIVITY (shared by rounds and stories)
   ===================================================================== */
function mountActivity(host,word,opts){
  const compact=!!opts.compact;
  const a={word,last:-1,misses:0,helped:false,busy:false,dead:false,done:false,tok:0,tip:false,loop:0,fresh:false};
  A=a;
  const fb=!micOK();
  const why=!S.settings.mic?'':!HAS_SR?'nosr':MICBLOCK?MICWHY:'';
  const note=why?`<div class="gnote">Grown-ups: ${micHelp(why)}${why!=='nosr'?` <button data-a="retrymic">Try again</button>`:''}</div>`:'';
  host.innerHTML=`
    <div class="tiles ${compact?'sm':''}" data-max="${compact?96:140}">${tilesHtml(word.tiles,'button')}</div>
    <div class="helpers">
      <button class="btn sm yellow" data-a="sound">💡 Sound it out</button>
    </div>
    <div class="micwrap">
      ${fb?`<div class="say">🗣️ Say the word out loud!</div><button class="btn green ${compact?'':'big'}" data-a="grown">✓ Grown-up: got it!</button>${note}`
          :`<button class="mic" data-a="mic" aria-label="Microphone on or off">🎤</button><div class="miclabel">Tap the mic to start listening</div>`}
    </div>
    <div class="bottomrow">
      <button class="link" data-a="skip">Skip ➜</button>
      ${fb?'':`<button class="link" data-a="grown" data-grown hidden>👪 Grown-up: ✓ got it</button>`}
    </div>`;
  const tilesEl=$('.tiles',host);layoutTiles(tilesEl);
  const micEl=$('.mic',host),labelEl=$('.miclabel',host);
  const litOff=()=>$$('.tile',host).forEach(e=>e.classList.remove('lit'));
  const setMic=s=>{if(!micEl)return;micEl.classList.toggle('listening',s==='listen');micEl.classList.toggle('on',s==='wait');
    if(labelEl)labelEl.textContent=s==='listen'?'Listening… say the word!':s==='wait'?'Mic on · tap to turn off':'Tap the mic to start listening';};
  const showGrown=()=>{const g=$('[data-grown]',host);if(g)g.hidden=false;};

  async function tapTile(i){
    ac();a.helped=true;a.tok++;stopSpeech();litOff();
    const t=word.tiles[i],el=$$('.tile',host)[i];
    el.classList.remove('boing');void el.offsetWidth;el.classList.add('boing');
    const twice=a.last===i;a.last=twice?-1:i;
    if(t.s==='-'){say(`Silent ${t.t}!`,{rate:.85});return;}
    if(!a.tip&&!compact){a.tip=true;setBubble('Nice! Tap each letter, then squish the sounds together.');}
    const my=a.tok,ph=PHK[t.s];
    await sayLetter(t,false);
    // tapped the same letter twice in a row: add the example ("like apple")
    if(twice&&ph&&my===a.tok&&!a.dead)await say(`like ${ph[2]}`,{rate:.7});
  }
  async function soundOut(){
    ac();if(a.busy)return;a.helped=true;a.last=-1;const my=++a.tok;stopSpeech();litOff();
    const els=$$('.tile',host);
    for(let i=0;i<word.tiles.length;i++){
      if(a.dead||my!==a.tok)return;
      els[i].classList.add('lit');
      const t=word.tiles[i];
      await sayLetter(t,false);
      if(a.dead||my!==a.tok)return;
      els[i].classList.remove('lit');await sleep(220);
    }
    if(a.dead||my!==a.tok)return;
    setBubble('Now squish the sounds together and say the word!');
  }
  function success(){
    if(a.done)return;a.done=true;if(MIC.target===target)MIC.target=null;stopListening();
    opts.onCorrect((a.helped||a.misses>0)?'helped':'clean');
  }
  async function miss(r){
    a.misses++;
    if(micEl){micEl.classList.remove('shake');void micEl.offsetWidth;micEl.classList.add('shake');}
    const noHear=(r.err==='no-speech'||r.err==='timeout'||!r.heard);
    if(a.misses>=2)showGrown();
    if(noHear){
      if(MIC_ON)return;
      if(labelEl)labelEl.textContent="I didn't hear that. Tap the mic and try again!";
      setBubble("I didn't hear you. Tap the mic and try again!",true);return;
    }
    if(labelEl)labelEl.textContent=`I heard “${r.heard}”. Try again!`;
    if(a.misses===1){setBubble(rand(TRY1),true);}
    else if(a.misses===2){await setBubble("Let's sound it out together!",true);if(!a.dead&&!a.done)soundOut();}
    else{setBubble("You're doing great! Try once more, or tap Skip.",true);}
  }
  function blocked(code){
    MIC_ON=false;MICBLOCK=true;MICWHY=code;a.dead=true;
    mountActivity(host,word,opts);
    setBubble("I can't hear you on this device. A grown-up can tap the green button when you read it!",true);
  }
  // Mic is a toggle: once on it keeps listening for the rest of the round or story (see MIC SESSION),
  // ignoring whatever it hears while Ollie talks.
  const target={word:word.w,
    hit:()=>{if(!a.dead&&!a.done)success();},
    miss:r=>{if(!a.dead&&!a.done)miss(r);},
    blocked:code=>{if(!a.dead&&!a.done)blocked(code);},
    idle:()=>{if(!a.dead&&!a.done)setMic('idle');}};
  function listen(){if(a.dead||a.done)return;if(!MIC.live)adbg('mic on');MIC.target=target;setMic('listen');micSession();syncACSoon();}
  async function mic(){
    if(a.done)return;
    ac();
    if(MIC_ON){micOff();setMic('idle');return;}
    stopSpeech();litOff();
    if(!MICPRE&&navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){
      // ask for microphone permission first: this is what makes the browser show its "Allow" prompt
      if(labelEl)labelEl.textContent='Getting the microphone ready…';
      try{await probeMic();MICPRE=true;MIC.fresh=true;}
      catch(e){if(a.dead||a.done)return;setMic('idle');return blocked(e.name||'error');}
      if(a.dead||a.done)return;
      await sleep(250);
    }
    MIC_ON=true;listen();
  }
  if(!fb&&MIC_ON)listen();
  host.onclick=ev=>{
    if(a.dead)return;
    const t=ev.target.closest('.tile');
    if(t&&host.contains(t))return tapTile(+t.dataset.i);
    const b=ev.target.closest('[data-a]');if(!b)return;
    const act=b.dataset.a;
    if(act==='sound')soundOut();
    else if(act==='mic')mic();
    else if(act==='grown')success();
    else if(act==='retrymic'){MICBLOCK=false;MICWHY='';MICPRE=false;a.dead=true;mountActivity(host,word,opts);setBubble('Tap the microphone and say the word!');}
    else if(act==='skip'){if(a.done)return;a.done=true;if(MIC.target===target)MIC.target=null;stopListening();stopSpeech();opts.onSkip();}
  };
}

/* read tokens [a,b) aloud, slowed, highlighting each word as it is spoken */
function storyClip(toks){
  if(!(S.settings.sound&&S.settings.murf))return null;
  const k='m:@'+mkey(toks.map(t=>t.disp).join(' ')),c=CLIPS[k];
  return c&&c.w&&c.w.length===toks.length?{k,c}:null;
}
function segBuf(k,c,t0,t1,rate){
  const bk=`~seg${rate}:${t0.toFixed(3)}:${t1.toFixed(3)}:${k}`;if(BUFS[bk])return BUFS[bk];
  const i0=Math.max(0,Math.floor(t0*c.sr)),i1=Math.min(c.data.length,Math.ceil(t1*c.sr)),n=Math.max(1,i1-i0),fade=Math.round(c.sr*.012);
  const f=new Float32Array(n);
  const src=clipFloat(c);
  for(let i=0;i<n;i++){let v=src[i0+i];if(i<fade)v*=i/fade;if(n-1-i<fade)v*=(n-1-i)/fade;f[i]=v;}
  const y=rate&&rate!==1?stretchPCM(f,c.sr,rate):f,b=ac().createBuffer(1,y.length,c.sr);b.getChannelData(0).set(y);
  return BUFS[bk]=b;
}
async function readAlong(toks,W,a,b,rate0,my){
  const rate=effRate(rate0);
  const sc=storyClip(toks);
  const mineHere=useMine()&&splitSent(toks.slice(a,b).map(x=>x.disp).join(' ')).every(x=>{const c=clipsFor(x);return c&&c.length&&c.every(i=>i.mine);});
  if(sc&&!mineHere&&ac()){
    logSaid(toks.slice(a,b).map(x=>x.disp).join(' '),'ai');
    const w=sc.c.w,end=sc.c.data.length/sc.c.sr;
    const t0=a===0?0:Math.max(w[a-1][1],w[a][0]-.05);
    const t1=b>=toks.length?end:Math.max(w[b-1][1]+.02,Math.min(w[b-1][1]+.09,w[b][0]));
    const buf=segBuf(sc.k,sc.c,t0,t1,rate),t=performance.now();
    const hl=(async()=>{
      for(let q=a;q<b;q++){
        const on=(w[q][0]-t0)/rate*1000,off=Math.max(on+180,(w[q][1]-t0)/rate*1000);
        await sleep(Math.max(0,on-(performance.now()-t)));if(my!==TOK)return;
        const el=W(q);if(el)el.classList.add('on');
        await sleep(Math.max(0,off-(performance.now()-t)));if(el)el.classList.remove('on');
      }})();
    await Promise.all([playBuf(buf),hl]);
    return;
  }
  const idx=[];for(let q=a;q<b;q++)idx.push(q);
  const text=idx.map(q=>toks[q].disp).join(' ');
  const dur=speechDur(text,rate0);
  const wts=idx.map(q=>toks[q].disp.replace(/[^A-Za-z']/g,'').length+2),wsum=wts.reduce((x,y)=>x+y,0);
  const hl=(async()=>{
    if(dur)await sleep(70/rate);
    for(let n=0;n<idx.length;n++){
      if(my!==TOK)return;const el=W(idx[n]);if(el)el.classList.add('on');
      await sleep(dur?Math.max(170,(dur*1000-140)*wts[n]/wsum):460+toks[idx[n]].disp.length*75);
      if(el)el.classList.remove('on');
    }})();
  await Promise.all([say(text,{rate:.7,slow:rate0}),hl]);
}

const escH=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
/* every line the game can say, grouped for recording; each line once */
function recGroups(){
  const nm=S.name||'',seen=new Set(),G=[];
  const item=(t,key,big,sub)=>({t,key,big,sub});
  const grp=(id,title,texts,note)=>{const items=[];
    texts.forEach(t=>splitSent(t).forEach(x=>{const k=mkey(x);if(!k||seen.has(k)||PHK[k]||/^that word is \w+$/.test(k))return;seen.add(k);items.push(item(x,recKey(k)));}));
    if(items.length)G.push({id,title,items,note});};
  G.push({id:'letters',title:'Letter sounds',note:'Say just the sound, short and clean: /t/ not “tuh”, /m/ as a short “mmm”.',
    items:PHON.map(x=>item(x[1],'p:'+x[0],disp(x[1]),`${x[3]?x[3]+' · ':''}as in “${x[2]}”`))});
  [1,2,3,4,5].forEach(l=>{const ws=WORDS.filter(w=>w.lvl===l);ws.forEach(w=>seen.add(w.w));
    G.push({id:'w'+l,title:`Words · level ${l}`,note:'Read each word clearly, the way you want your child to hear it.',items:ws.map(w=>item(w.w,'w:'+w.w,disp(w.w),w.emoji))});});
  grp('praise','Praise',[...PRAISE,...SHORT],'Said when a word is read right. The word itself comes from your word recordings.');
  grp('talk',"Ollie's prompts",[...START_LINES,...TRY1,'That word is',...FIXED_LINES,'Silent e!'],'“That word is” is recorded once; the word is added from your word recordings.');
  grp('hints','Letter hints',PHON.map(x=>`like ${x[2]}`).concat([...new Set(WORDS.flatMap(w=>w.tiles.filter(t=>t.s==='-').map(t=>`silent ${t.t}`)))]),'Played after a letter sound when a letter is tapped.');
  grp('sfx','Fun sounds',WORDS.flatMap(w=>w.sfx.split('|').filter(x=>x[0]!=='~')),'Played in the celebration for some words. Have fun with these.');

let GUIDE=null;
async function recordInto(key,meter,statusFn){
  const kind=key[0];
  let stream;try{stream=await getMic();}catch(e){statusFn(micHelp(e.name||'error'));return null;}
  statusFn('Recording… speak now.');
  const cap=startCapture(stream,{maxSec:kind==='p'?2.5:kind==='w'?3.5:10,quietSec:kind==='p'?.6:kind==='w'?.7:1.1,
    onLevel:x=>{if(meter)meter.style.width=Math.min(100,x*500)+'%';}});
  GUIDE=cap;
  const raw=await cap.done;GUIDE=null;if(meter)meter.style.width='0';
  const c=trimClip(raw);
  if(!c){statusFn("Didn't catch that. Try again a little louder or closer.");return null;}
  delete c.off;
  if(!await saveClip(key,c)){statusFn('Could not save on this device (storage blocked?).');return null;}
  statusFn('');return c;
}
function guided(items,title,onDone){
  const todo=items.filter(x=>!hasClip(x.key));
  const box=document.createElement('div');box.className='gwrap';document.body.appendChild(box);
  let i=0,busy=false;
  const close=()=>{if(GUIDE){GUIDE.stop();GUIDE=null;}box.remove();onDone&&onDone();};
  if(!todo.length){box.innerHTML=`<div class="gcard"><div class="gtext">Everything in “${escH(title)}” is recorded 🎉</div><div class="gnav"><span></span><button class="btn sm green" data-g="close">Done</button></div></div>`;}
  const show=()=>{
    if(i>=todo.length){box.innerHTML=`<div class="gcard"><div class="gtext">All done 🎉</div><div class="gsub">${escH(title)}</div><div class="gnav"><span></span><button class="btn sm green" data-g="close">Done</button></div></div>`;return;}
    const it=todo[i],has=hasClip(it.key);
    box.innerHTML=`<div class="gcard">
      <div class="gtop"><span>${escH(title)} · ${i+1} of ${todo.length}</span><button class="vb" data-g="close" aria-label="Close">✕</button></div>
      <div class="gtext">${escH(it.big||it.t)}</div>${it.sub?`<div class="gsub">${escH(it.sub)}</div>`:''}
      <div class="vmeter"><i id="g-meter"></i></div>
      <div class="gbtns"><button class="vb rec big" data-g="rec" aria-label="Record">●</button><button class="vb" data-g="play" aria-label="Play" ${has?'':'disabled'}>▶</button></div>
      <div class="gstat" id="g-stat">${has?'Sounds good? Tap Next. Or record again.':'Tap ● and say it. Recording stops when you finish.'}</div>
      <div class="gnav"><button class="btn sm ghost" data-g="skip">Skip</button><button class="btn sm green" data-g="next" ${has?'':'disabled'}>Next ➜</button></div></div>`;
  };
  if(todo.length)show();
  box.onclick=async e=>{
    const b=e.target.closest('[data-g]');if(!b)return;const g=b.dataset.g;ac();
    if(g==='close')return close();
    if(g==='skip'||g==='next'){if(GUIDE){GUIDE.stop();}i++;show();return;}
    const it=todo[i];if(!it)return;
    if(g==='play'){stopSpeech();playClip(it.key);return;}
    if(g==='rec'){
      if(GUIDE){GUIDE.stop();return;}
      if(busy)return;busy=true;stopSpeech();
      b.classList.add('on');b.textContent='■';
      const st=t=>{const x=$('#g-stat',box);if(x&&t)x.textContent=t;};
      const c=await recordInto(it.key,$('#g-meter',box),st);
      busy=false;if(!box.isConnected)return;
      b.classList.remove('on');b.textContent='●';
      if(c){$('[data-g=play]',box).disabled=false;$('[data-g=next]',box).disabled=false;st('Sounds good? Tap Next. Or record again.');await sleep(120);playClip(it.key);}
    }
  };
}
function screenVoice(){micOff();

  const row=it=>`<div class="vrow ${hasClip(it.key)?'has':''}" data-k="${escH(it.key)}"><div class="vl">${it.key[0]==='p'||it.key[0]==='w'?`<b>${escH(it.big||it.t)}</b><span>${escH(it.sub||'')}</span>`:`<span class="vt">${escH(it.t)}</span>`}</div>

  setView(`<div class="col">

      <div id="v-status" style="margin-top:8px;font-weight:700"></div>

    <div class="vmeter"><i id="v-meter"></i></div>

      <div class="vlist"></div></details>`).join('')}
  </div>`);
  const col=$('.col',view),meter=$('#v-meter'),stat=$('#v-status');
  const counts=()=>{G.forEach((g,gi)=>{const e=$(`[data-gc="${gi}"]`,col);if(e)e.textContent=`· ${g.items.filter(x=>hasClip(x.key)).length}/${g.items.length}`;});

  const status=msg=>{if(msg)stat.textContent=msg;else counts();};

  $$('details.vsec',col).forEach(d=>d.addEventListener('toggle',()=>{const l=$('.vlist',d);if(d.open&&!l.childElementCount)l.innerHTML=G[+d.dataset.g].items.map(row).join('');}));
  const refresh=r=>{const h=hasClip(r.dataset.k);r.classList.toggle('has',h);$$('[data-v=play],[data-v=del]',r).forEach(b=>b.disabled=!h);};
  $('#v-mine').onchange=e=>{S.settings.mine=e.target.checked;persist();};
  let cur=null;
  col.onclick=async ev=>{
    const go=ev.target.closest('[data-go]');
    if(go){ac();stopSpeech();const g=go.dataset.go==='all'?{items:all,title:'Everything'}:G[+go.dataset.go];
      guided(g.items,g.title,()=>{$$('.vrow',col).forEach(refresh);counts();});return;}
    const b=ev.target.closest('[data-v]');if(!b)return;
    const r=b.closest('.vrow'),k=r.dataset.k,v=b.dataset.v;
    ac();
    if(v==='play'){stopSpeech();playClip(k);return;}
    if(v==='del'){await delClip(k);refresh(r);counts();return;}
    if(cur){const same=cur===k;if(GUIDE)GUIDE.stop();if(same)return;await sleep(80);}
    stopSpeech();cur=k;
    b.classList.add('on');b.textContent='■';
    const c=await recordInto(k,meter,status);
    if(cur===k)cur=null;
    b.classList.remove('on');b.textContent='●';
    if(!view.contains(r))return;
    refresh(r);counts();
    if(c){await sleep(120);playClip(k);}
  };
}

    phArm=0;e.target.textContent='🔤 Remake letter sounds (phonetic)';
    building=true;e.target.disabled=true;ac();mStat('Making letter sounds…');
    try{const r=await elPhonemes(k,voice,(d,t,note)=>mStat(`Letter sounds: ${d} of ${t}. ${note||''}`));
      const left=await elLeft(k);
      mStat(`Done: ${r.done-r.bad.length} letter sounds remade${r.bad.length?` (${r.bad.length} came back silent and were left as they were)`:''}. Tap letters in a round to hear them; record any that still sound wrong.${left!=null?` ElevenLabs characters left: ${Number(left).toLocaleString()}.`:''}`);}
    catch(err){mStat(murfErr(err)+' Sounds already remade are kept.');}
    building=false;if(document.body.contains(e.target))e.target.disabled=false;
  };
  let delArm=0;
  $('#m-del').onclick=async e=>{
    if(!delArm){delArm=1;e.target.textContent='Tap again to delete';setTimeout(()=>{delArm=0;if(document.body.contains(e.target))e.target.textContent='Delete voice pack';},4000);return;}
    await murfDelete();mStat('Voice pack deleted.');mInfo();
  };
  if(murfKey.get()&&clipCount('m:')&&murfTodo().length)$('#m-load').textContent='Load voices / add new lines';
  $('#s-vspd').oninput=e=>{S.settings.vspd=+e.target.value;persist();$('#s-vspdv').textContent=Math.round(vspd()*100)+'%';};
  $('#s-vspd').onchange=()=>{ac();stopSpeech();say("Hi! I'm Ollie the owl. Let's read together!");};
  $('#s-fx').oninput=e=>{const v=+e.target.value/100;S.settings.fx=v;persist();if(master)master.gain.value=v;};
  $('#s-fx').onchange=()=>{ac();FX.ding&&FX.ding();};
  $('#s-testm').onclick=async()=>{
    ac();stopSpeech();const s=$('#s-status');
    if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){
      s.textContent='Asking for the microphone…';
      try{await probeMic();MICPRE=true;}
      catch(e){MICBLOCK=true;MICWHY=e.name||'error';s.textContent=micHelp(MICWHY)+` [${MICWHY}]`;return;}
      await sleep(250);
    }
    s.textContent='Listening… say “hello”.';
    const r=await listenFor('hello');
    if(r.ok||r.heard){MICBLOCK=false;MICWHY='';s.textContent=`Heard: “${r.heard||'hello'}”. The microphone works!`;}
    else if(['not-allowed','service-not-allowed','audio-capture','network'].includes(r.err)){MICBLOCK=true;MICWHY=r.err;s.textContent=micHelp(r.err)+` [${r.err}]`;}
    else s.textContent=`I didn't hear anything [${r.err}]. Try again a little closer to the microphone.`;
  };
  $('#s-rec').onclick=()=>{modal.classList.remove('on');modal.innerHTML='';screenVoice();};
  $('#s-mine').onchange=e=>{st('mine',e.target.checked);};
  $('#s-exp').onclick=async()=>{const r=await exportBackup();$('#s-status').textContent=r==='saved'?'Backup file saved to your downloads.':r==='declined'?'Backup not saved.':'Could not save the backup here.';};
  let BAKED=null;
  const vfShow=()=>{
    const fmt=n=>n>=1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';
    $('#s-vfiles').innerHTML=BAKED.files.map((f,i)=>`<div class="vrow"><div class="vl"><span class="vt">${escH(f.name)}</span><span>${fmt(f.blob.size)} · ${f.changed?'<b style="color:var(--pink-d)">changed: upload</b>':'same as the site'}</span></div>
      <button class="vb" data-vf="${i}" aria-label="Save ${escH(f.name)}">💾</button></div>`).join('');
  };
  $('#s-bake').onclick=async()=>{
    const x=$('#s-bakest'),b=$('#s-bake');
    if(VOICE.busy){x.textContent='The voice is still downloading. Wait for it to finish, then try again.';return;}
    b.disabled=true;x.textContent='Making the voice files…';$('#s-bakeshare').hidden=true;$('#s-vfiles').innerHTML='';await sleep(50);
    try{BAKED=buildVoiceFiles();BAKED.commit();vfShow();
      const ch=BAKED.files.filter(f=>f.changed);
      x.textContent=ch.length?`Ready. Tap 💾 on each file marked “changed” (${ch.length} file${ch.length>1?'s':''}, including manifest.json), then upload them to the voice folder on GitHub.`
        :'Ready. Everything matches the voice on the site, so there is nothing to upload.';
      try{const fl=ch.map(f=>new File([f.blob],f.name,{type:f.blob.type}));$('#s-bakeshare').hidden=!(fl.length&&navigator.canShare&&navigator.canShare({files:fl}));}catch(e){}
    }catch(e){x.textContent='Couldn’t make the files: '+(e.message||String(e));}
    if(document.body.contains(b))b.disabled=false;
  };
  $('#s-vfiles').onclick=e=>{
    const b=e.target.closest('[data-vf]');if(!b||!BAKED)return;const f=BAKED.files[+b.dataset.vf],x=$('#s-bakest');
    saveFile(f.name,f.blob).then(r=>{x.textContent=r==='saved'?`Saved ${f.name}. On iPhone it’s in the Files app › Downloads.`:r==='declined'?'Not saved.':'Couldn’t save here. Try Share… instead.';if(r==='saved')b.textContent='✓';});
  };
  $('#s-bakeshare').onclick=async()=>{
    if(!BAKED)return;const x=$('#s-bakest');
    const fl=BAKED.files.filter(f=>f.changed).map(f=>new File([f.blob],f.name,{type:f.blob.type}));
    try{await navigator.share({files:fl});x.textContent='Shared. Upload these files to the voice folder on GitHub.';}
    catch(e){if(e&&e.name!=='AbortError')x.textContent='Sharing didn’t work: '+(e.message||e.name);}
  };
  if($('#s-expv'))$('#s-expv').onclick=async()=>{
    const x=$('#s-status');x.textContent='Preparing the voice pack file…';await sleep(50);
    const r=await exportVoicePack();x.textContent=r==='saved'?'Voice pack saved to your downloads.':r==='declined'?'Voice pack not saved.':'Could not save the voice pack here.';};
  $('#s-imp').onchange=async e=>{
    const f=e.target.files&&e.target.files[0];if(!f)return;
    const stt=t=>{const x=$('#s-status');if(x)x.textContent=t;};
    stt('Restoring…');
    try{const r=await importBackup(f,(d,t)=>stt(`Restoring… ${d} of ${t}`));closeSettings();
      setBubble(r.kind==='voicepack'?`Voice pack restored (${r.n} lines).`:`Backup restored (${r.n} recordings).`);}
    catch(err){stt("That file isn't an Ollie backup, or it couldn't be read.");}
    e.target.value='';
  };
  let armed=0;
  $('#s-reset').onclick=e=>{
    if(!armed){armed=1;e.target.textContent='Tap again to erase everything';setTimeout(()=>{armed=0;e.target.textContent='Erase all progress'},4000);return;}
    const keepName=S.name;S=defaults();S.name=keepName;S.seen=true;persist();closeSettings();screenHome();
  };
  $('#s-close').onclick=closeSettings;
}
function closeSettings(){modal.classList.remove('on');modal.innerHTML='';screenHome();}

/* A returning player (page opened again or refreshed) hears the greeting. Once the voice is ready it
   plays straight away if the browser allows sound; iPhone/iPad allow no sound before the first tap,
   so there it plays on the first tap, unless that tap already starts something (a menu button). */
let GREETED=false;const RETURN_GREET='Hello, again! Ready to read?';
function greetOnReturn(){
  const greetNow=()=>{if(GREETED||!$('.home')||$('#vgate'))return;GREETED=true;setBubble(RETURN_GREET);say(RETURN_GREET);};
  const onTap=e=>{
    if(waiting()&&!SILENT)return;   // still loading: the voice card is up
    document.removeEventListener('pointerup',onTap,true);
    const b=e.target.closest('[data-act],#gear');
    if(b&&b.dataset.act!=='owl'){GREETED=true;return;}
    setTimeout(greetNow,60);
  };
  document.addEventListener('pointerup',onTap,true);
  (async()=>{
    while(waiting()&&!SILENT)await sleep(100);
    if(SILENT)return;
    const c=ac();if(c&&c.state!=='running')await sleep(300);
    if(c&&c.state==='running'){document.removeEventListener('pointerup',onTap,true);greetNow();}
  })();
}
/* SOUND CHECK (grown-ups, iPhone/iPad): with the mic on, iOS plays the game at its separate call volume
   and chimes; no web page can change that. So once, the mic is turned on while Ollie talks and the grown-up
   sets that volume with the buttons; iOS remembers it. Also asks for mic permission up front. */
const needsSoundCheck=()=>IS_IOS&&S.settings.mic&&HAS_SR&&!MICBLOCK;
function soundCheck(onDone){
  const box=document.createElement('div');box.className='gwrap';box.id='scheck';
  let stream=null,run=0;
  const stop=()=>{run++;stopSpeech();if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;sessionPlayback();bounceAC();syncACSoon();}};
  const finish=ok=>{stop();if(ok)S.soundChecked=true;persist();box.remove();onDone&&onDone();};
  const show=started=>{box.innerHTML=`<div class="gcard" style="align-items:center;text-align:center">
    <div style="font-size:64px;line-height:1" aria-hidden="true">🦉🔊</div>
    <div class="gtext" style="min-height:0;font-size:clamp(22px,6vw,30px)">Sound check</div>
    <p class="gsub" style="margin:0">${started
      ?'Ollie is talking with the microphone on. Press the <b>volume buttons</b> until Ollie sounds right, then tap Sounds good.'
      :'While the microphone is on, iPhone and iPad play the game at a <b>separate volume</b> (the one used for calls) and make a short chime. Tap Start, allow the microphone, then set that volume with the buttons. It only needs doing once.'}</p>
    <div class="gstat" id="sc-st"></div>
    <div class="gnav">${started?'<button class="btn sm ghost" data-sc="skip">Skip</button><button class="btn sm green" data-sc="done">✓ Sounds good</button>'
      :'<button class="btn sm ghost" data-sc="skip">Skip</button><button class="btn sm green" data-sc="start">▶ Start</button>'}</div></div>`;};
  show(false);document.body.appendChild(box);
  box.onclick=async e=>{
    const b=e.target.closest('[data-sc]');if(!b)return;const a=b.dataset.sc;
    if(a==='skip')return finish(false);
    if(a==='done')return finish(true);
    if(a==='start'){
      ac();b.disabled=true;
      try{sessionRecord();stream=await navigator.mediaDevices.getUserMedia({audio:true});MICPRE=true;}
      catch(err){sessionPlayback();const x=$('#sc-st',box);if(x)x.textContent=micHelp(err.name||'error');b.disabled=false;return;}
      show(true);syncACSoon(600);
      const my=++run;
      while(my===run&&box.isConnected){await say("Hi! I'm Ollie the owl. Let's read together!");if(my!==run)break;await sleep(1200);}
    }
  };
}
function welcome(){
  modal.innerHTML=`<div class="mcard" style="text-align:center;align-items:center">
    <div style="font-size:90px;line-height:1">🦉</div>
    <h2>Hi! I'm Ollie!</h2>
    <p>Let's read words together. What's your name?</p>
    <input type="text" id="w-name" placeholder="Type a name" maxlength="20" autocomplete="off" style="text-align:center">
    <p>Grown-ups: the first time the microphone is tapped, your device will ask to use it. Tap <b>Allow</b>. Press and hold ⚙️ on the home screen for settings, including recording the letter sounds in your own voice.</p>
    <button class="btn big green" id="w-go">Let's go!</button>
    <div id="w-wait" style="width:100%;display:flex;flex-direction:column;align-items:center;gap:6px">
      <p>Getting Ollie's voice…</p>
      <div class="vmeter" style="width:100%;height:14px;border-radius:7px"><i data-vgate-bar></i></div>
      <button class="link" id="w-silent">Continue without sound</button></div>
    <p id="w-fail" hidden>Ollie's voice didn't download. The device voice will be used for now; it tries again next time.</p>
  </div>`;
  modal.classList.add('on');
  $('#w-silent').onclick=()=>{SILENT=true;gateUpdate();};
  gateUpdate();
  $('#w-go').onclick=()=>{if($('#w-go').disabled)return;ac();S.name=$('#w-name').value.trim();S.seen=true;persist();modal.classList.remove('on');modal.innerHTML='';screenHome();
    const hi=()=>say(greet());
    if(needsSoundCheck()&&!S.soundChecked&&!SILENT)soundCheck(hi);else hi();};
}

/* =====================================================================
   EVENTS
   ===================================================================== */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  ac();
  const id=b.dataset.id;
  switch(b.dataset.act){
    case 'home':screenHome();break;
    case 'play':startRound();break;
    case 'stories':screenStories();break;
    case 'stickers':screenStickers();break;
    case 'known':screenKnown();break;
    case 'sayword':{stopSpeech();const el=b;el.classList.remove('boing');void el.offsetWidth;el.classList.add('boing');say(`${id}!`,{rate:.8,slow:.85});break;}
    case 'story':openStory(id);break;
    case 'practice':startRound(practiceList(STORIES.find(s=>s.id===id)));break;
    case 'settings':openSettings();break;
    case 'scenes':screenScenes();break;
    case 'scene':screenScene(id);break;
    case 'storynext':QS.i++;if(QS.i>=QS.st.sents.length)storyEnd();else storyPage();break;
    case 'owl':GREETED=true;stopSpeech();owlTalk();say(greet()+" Tap Let's Read to start!");break;
    case 'owlsay':{const bb=$('#bubble');if(bb){stopSpeech();owlTalk();say(bb.textContent);}break;}
  }
});
document.addEventListener('contextmenu',e=>e.preventDefault());

if(!S.seen)screenHome(),welcome();else{screenHome();greetOnReturn();}
})();
</script>
