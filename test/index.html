function startQuestLevel(i){micOff();stopAll();if(!qUnlocked(i))return screenQuest();gameQuest(GAMES.find(x=>x.id==='quest'),TOK,i);}

function gameQuest(g,my,li){
  li=li||0;const L=QLEVELS[li];
  setView(`<div class="qwrap" id="quest" data-phase="intro" data-level="${L.id}">
    <div class="qstage"><canvas id="qc"></canvas>
      <div class="qhud"><button class="rbtn" data-act="quest" aria-label="Back to the map">←</button>
        <div class="qhearts" id="qhp"></div><div class="qprog"><i id="qpi"></i><b id="qpo"></b></div><div class="qhearts qboss" id="qbhp"></div></div>
      <div class="qpanel" id="qpanel" hidden></div></div>
    <div class="qbtns" id="qbtns"></div>
    <div class="qrot"><div><div class="qphone">📱</div><p>Turn your phone sideways to play!</p></div></div>
  </div>`);
  const root=$('#quest'),cv=$('#qc'),c=cv.getContext('2d'),panel=$('#qpanel');
  let W=800,H=360,G=null,last=0;
  const sc=()=>window.__platScale||1;
  function size(){const r=cv.getBoundingClientRect(),d=Math.min(2,window.devicePixelRatio||1),k=r.height/H;
    cv.width=Math.round(r.width*d);cv.height=Math.round(r.height*d);W=r.width/k;c.setTransform(d*k,0,0,d*k,0,0);}
  window.addEventListener('resize',size);
  const NW=L.words.length;
  function makeEnc(){const out=[],f=shuffle(L.words);let x=900;
    for(let k=0;k<QN;k++){let w;if(k<NW)w=f[k];else{do w=rand(L.words);while(out[k-1].w===w&&out[k-2].w===w);}   // each word once first, never 3 in a row
      out.push({k,w,x,st:'idle',t0:0,hint:k<NW,hd:QW[w].hit});x+=lerp(520,900,k/(QN-1))+Math.random()*80;}   // further apart later, so the speed-up shows
    return out;}
  function reset(){
    G={t:0,phase:'intro',px:0,v:0,hp:3,enc:makeEnc(),parts:[],inv:0,hurt:0,char:0,squash:0,dizzy:0,stuck:0,bump:0,boss:null,wear:wearOpts(),done:false,pi:0};G.seg=segSpeed();G_STUCK=0;
    panel.hidden=true;panel.innerHTML='';$('#qbtns').hidden=false;
    $('#qbtns').innerHTML=shuffle(L.words).map(w=>`<button class="qb" data-w="${w}">${disp(w)}</button>`).join('');
    hud();MUSIC.play(L.song);
  }
  /* Time from passing one encounter to bumping into the next: 7 s for the first 8, then down to 3 s by
     the 25th, and 3 s for the last 5 (owner's request). The speed is set again each time Ollie passes one, so a rush past a
     cleared one doesn't shorten the time for the next. */
  const gap=k=>k<8?7:lerp(7,3,clamp01((k-8)/(25-8)));
  const ahead=()=>G.enc.find(e=>e.x-e.hd>G.px+1);
  function segSpeed(){const n=ahead();return n?Math.max(40,(n.x-n.hd-G.px)/gap(n.k)):220;}
  const pressable=()=>{if(G.phase!=='run')return null;const e=G.enc.find(e=>e.st==='idle');if(!e)return null;const d=e.x-G.px;return d<W-OX-40?e:null;};
  function hud(){
    $('#qhp').textContent='❤️'.repeat(Math.max(0,G.hp))+'🤍'.repeat(3-Math.max(0,G.hp));
    const passed=G.enc.filter(e=>e.x<G.px).length;$('#qpi').style.width=(passed/QN*100)+'%';
    $('.qprog',root).style.visibility=G.boss?'hidden':'';
    $('#qbhp').textContent=G.boss?'💛'.repeat(G.boss.hp)+'🖤'.repeat(3-G.boss.hp):'';
    root.dataset.phase=G.phase;root.dataset.hp=G.hp;
    const p=pressable();root.dataset.next=p?p.w:'';
    root.dataset.ask=G.phase==='tele'&&!G.boss.dodge?G.boss.ask:'';
    root.dataset.bhp=G.boss?G.boss.hp:'';root.dataset.v=Math.round(G.v);root.dataset.rush=G.rush?'1':'';
    {const n=G.phase==='run'&&!G.rush&&G.v>0?ahead():null;root.dataset.eta=n?((n.x-n.hd-G.px)/G.v).toFixed(2):'';}
    $$('.qb',root).forEach(b=>{b.classList.toggle('go',G.phase==='turn');
      b.classList.toggle('hint',!!(p&&p.hint&&G.enc.indexOf(p)<8&&p.w===b.dataset.w&&p.x-G.px<(W-OX)*.75));});
  }
  // particles and pop-up words (screen units; world ones scroll with the ground)
  function addP(o){G.parts.push(Object.assign({t:0,life:1,vx:0,vy:0,g:0,w:false},o));}
  function pop(text,x,y,col){addP({type:'text',text,x,y,vy:-40,life:1.1,col:col||'#fff',w:true});}
  function stars(x,y,n=7){for(let k=0;k<n;k++){const a=k/n*TAU;addP({type:'star',x,y,vx:Math.cos(a)*160,vy:Math.sin(a)*160-60,g:300,life:.8,w:true});}}
  function smoke(x,y,n=5,w=true,col){for(let k=0;k<n;k++)addP({type:'smoke',x:x+(Math.random()-.5)*30,y,vx:(Math.random()-.5)*30,vy:-50-Math.random()*40,life:1.2,w,col});}
  function hurtOllie(w){
    if(G.inv>0)return false;
    const h=QW[w].hurt;G.hp--;G.inv=1.4;G.hurt=.7;
    if(h==='char'){G.char=1.6;smoke(OX,GY-60,7);}else if(h==='dizzy'){G.dizzy=1.1;stars(OX+20,GY-90);}
    else if(h==='stuck'){G.stuck=G_STUCK=1.4;G.stuckW=w;G.hurt=1.2;}else if(h==='sting'){G.bump=1.8;G.hurt=.9;}else G.hurt=.9;
    FX.bonk();FX.pop();
    if(G.hp<=0){G.phase='over';G.overAt=G.t;MUSIC.stop();MUSIC.jingle('lose');}
    hud();
    return true;
  }
  // a word button
  function press(w,btn){
    if(!G||G.done)return;ac();
    const ok=b=>{if(!b)return;b.classList.remove('ok','nope');void b.offsetWidth;b.classList.add(b===btn&&ok.good?'ok':'nope');setTimeout(()=>b.classList.remove('ok','nope'),450);};
    if(G.phase==='run'){
      const e=pressable();if(!e)return;
      if(e.w!==w){ok.good=false;ok(btn);FX.bonk();return;}
      ok.good=true;ok(btn);e.st='ok';e.t0=G.t;G.rush=e;FX.ding();stopSpeech();say(`${w}!`,{rate:.8,slow:.85});
      const sx=OX+(e.x-G.px);pop(QW[w].say[0],sx,w==='sun'?40:GY-140,'#fff');
      (FX[QW[w].fx]||FX.pop)();if(w==='hot')for(let k=0;k<6;k++)addP({type:'smoke',x:sx+(k-2.5)*18,y:GY-6,vx:0,vy:-60-k*6,life:1.4,w:true,col:'rgba(255,255,255,.6)'});
      hud();return;
    }
    if(G.phase==='tele'){
      const B=G.boss;if(B.dodge)return;
      if(w!==B.ask){ok.good=false;ok(btn);FX.bonk();return;}
      ok.good=true;ok(btn);B.dodge=true;FX.ding();stopSpeech();say(`${w}!`,{rate:.8,slow:.85});addP({type:'check',x:OX,y:GY-150,life:1});
      G.phase='attack';G.anim={w,t:0,dodge:true,done:false};FX.whoosh();hud();return;      // the boss attacks at once, and misses
    }
    if(G.phase==='turn'){ok.good=true;ok(btn);stopSpeech();say(`${w}!`,{rate:.8,slow:.85});G.phase='pattack';G.anim={w,t:0,done:false};hud();}
  }
  $('#qbtns').addEventListener('pointerdown',e=>{const b=e.target.closest('.qb');if(!b)return;e.preventDefault();press(b.dataset.w,b);});
  panel.addEventListener('click',e=>{const b=e.target.closest('[data-q]');if(!b)return;
    if(b.dataset.q==='again'){reset();}
    if(b.dataset.q==='next'){startQuestLevel(li+1);}
    if(b.dataset.q==='wear'){toggleWear(L.prize);G.wear=wearOpts();const on=worn().includes(L.prize);
      b.textContent=on?'✓ Wearing it':'Wear it';b.classList.toggle('green',on);b.classList.toggle('ghost',!on);
      const im=$('.qbig',panel);if(im)im.innerHTML=ollieImg();FX.pop();}
  });

  /* ---- the boss fight ---- */
  const bpt=p=>[G.boss.x+p[0],GY+p[1]];
  function bossNext(){const B=G.boss;let w;do w=rand(L.words);while(w===B.ask&&Math.random()<.7);B.ask=w;B.tt=B.T;B.dodge=false;G.phase='tele';FX.boing();hud();}
  function update(dt){
    G.t+=dt;G.inv=Math.max(0,G.inv-dt);G.hurt=Math.max(0,G.hurt-dt);G.char=Math.max(0,G.char-dt);G.dizzy=Math.max(0,G.dizzy-dt);G.squash=Math.max(0,G.squash-dt*1.5);
    G.stuck=G_STUCK=Math.max(0,G.stuck-dt);G.bump=Math.max(0,G.bump-dt);
    const E=G.enc;
    if(G.phase==='intro'&&G.t>1.6){G.phase='run';hud();}
    if(G.phase==='run'||G.phase==='arrive'){
      const a=E[7].x,b=E[QN-1].x,f=clamp01((G.px-a)/(b-a));
      const pi=E.filter(e=>e.x+10<G.px).length;if(pi!==G.pi){G.pi=pi;G.seg=segSpeed();}   // passed one: pace for the next
      if(G.rush&&G.px>G.rush.x+10)G.rush=null;                                           // past it: straight back to that pace
      G.v=G.phase==='arrive'?Math.max(0,G.v-260*dt):G.stuck>0?0:G.rush?Math.min(900,G.v+2600*dt):G.seg;   // caught in a web/net: stopped a moment
      MUSIC.bpm=SONGS[L.song].bpm+f*38;
      G.px+=G.v*dt;
      for(const e of E){
        const d=e.x-G.px;
        if(e.st==='idle'&&d<=e.hd){e.st='hit';e.t0=G.t;
          if(hurtOllie(e.w))pop(QW[e.w].say[1],OX+40,GY-130,'#ffe14d');
          if(G.phase==='over')return;}
      }
      if(G.phase==='run'&&G.px>E[QN-1].x+260){G.phase='arrive';}
      if(G.phase==='arrive'&&G.v<=0){G.phase='bossin';G.boss={hp:3,x:L.enter==='poof'?W-175:W+260,T:6,ask:null,tt:0,dodge:false,anger:0,flash:0,atk:0,t0:G.t};
        MUSIC.play(L.bsong);FX.horn();if(L.enter==='poof'){smoke(W-175,GY-150,10,false,'rgba(200,170,255,.8)');FX.sparkle();}}
      hud();
    }
    const B=G.boss;
    if(B){B.flash=Math.max(0,B.flash-dt);
      const home=W-175;
      if(G.phase==='bossin'){
        if(L.enter==='poof'){B.x=home;if(G.t-B.t0>1.6)bossNext();}
        else{B.x=Math.max(home,B.x-140*dt);if(Math.floor(G.t*2.6)!==Math.floor((G.t-dt)*2.6))osc({f:[[0,90],[1,40]],dur:.18,vol:.4});if(B.x<=home){B.x=home;bossNext();}}}   // stomping in
      else B.x=home;
      if(G.phase==='tele'){B.tt-=dt;if(B.tt<=0){G.phase='attack';G.anim={w:B.ask,t:0,dodge:B.dodge,done:false};FX.whoosh();hud();}}
      if(G.phase==='attack'){const a=G.anim;a.t+=dt;
        if(!a.done&&a.t>=.95){a.done=true;
          if(a.dodge){FX.sparkle();pop(['WHEE!','NOPE!','HA!'][Math.random()*3|0],OX,GY-150,'#8ff0c2');}
          else{G.inv=0;hurtOllie(a.w);if(QW[a.w].stick==='sit')G.squash=1;pop(QW[a.w].say[1],OX+30,GY-140,'#ffe14d');if(G.phase==='over')return;}}
        if(a.t>=1.9){B.atk++;if(B.atk>=3){B.atk=0;G.phase='turn';B.tt=B.T;FX.tada();}else bossNext();hud();}}
      if(G.phase==='turn'){B.tt-=dt;if(B.tt<=0){pop('HA HA HA!',B.x-40,70,'#ffe14d');FX.horn();bossNext();}}
      if(G.phase==='pattack'){const a=G.anim;a.t+=dt;
        if(!a.done&&a.t>=1.05){a.done=true;B.hp--;B.flash=.9;FX.boing();FX.pop();const [hx,hy]=bpt(L.head);
          pop(L.ouch[3-B.hp-1]||'OOF!',B.x-70,96,'#ffe14d');stars(hx,hy,9);if(QW[a.w].stick==='burn')smoke(hx,hy+20,8,false);
          B.anger=3-B.hp;B.T=B.hp===2?4:2;MUSIC.bpm=SONGS[L.bsong].bpm+B.anger*14;hud();}
        if(a.t>=2){if(B.hp<=0){G.phase='defeat';G.dt0=G.t;MUSIC.stop();FX.zoom();FX.drum();}else bossNext();hud();}}
      if(G.phase==='defeat'){const p=G.t-G.dt0;
        if(p>.2&&!G.boom){G.boom=1;for(let k=0;k<4;k++)smoke(B.x+(k-1.5)*40,GY-150,6,false);stars(B.x,GY-160,12);FX.cheer();}
        if(p>2.6&&!G.landed){G.landed=1;G.wear=wearOpts(worn().filter(x=>SLOT[x]!==SLOT[L.prize]).concat(L.prize));FX.sparkle();}
        if(p>3.4&&!G.done){win();}}
    }
    for(const q of G.parts){q.t+=dt;q.vy+=q.g*dt;q.x+=q.vx*dt-(q.w?G.v*dt:0);q.y+=q.vy*dt;}
    G.parts=G.parts.filter(q=>q.t<q.life);
  }
  function win(){
    G.done=true;G.phase='won';hud();MUSIC.jingle('win');confetti(90);
    S.games=S.games||{};S.games.quest=(S.games.quest||0)+1;S.qbeat=S.qbeat||{};S.qbeat[L.id]=true;
    S.cos=S.cos||{owned:[],on:[]};const first=!S.cos.owned.includes(L.prize);
    if(first){S.cos.owned.push(L.prize);if(!worn().includes(L.prize))toggleWear(L.prize);}persist();G.wear=wearOpts();
    const on=worn().includes(L.prize),nxt=li+1<QLEVELS.length&&qUnlocked(li+1);

      <div class="qrow"><button class="btn sm ${on?'green':'ghost'}" data-q="wear">${on?'✓ Wearing it':'Wear it'}</button>

      <button class="btn green" data-q="again">↻ Try again</button><button class="btn sm ghost" data-act="quest">🗺️ Map</button></div></div>`;

  /* ---- drawing ---- */
  function cloud(x,y,r){c.save();c.fillStyle='#fff';c.strokeStyle=INK;c.lineWidth=2.5;
    const b=[[0,0,1],[-.8,.1,.7],[.8,.15,.72],[-.4,-.45,.62],[.4,-.42,.66]];
    b.forEach(([a,bb,s])=>{ell(c,x+a*r,y+bb*r,r*s,r*s*.85);c.stroke();});b.forEach(([a,bb,s])=>{ell(c,x+a*r,y+bb*r,r*s-1.2,r*s*.85-1.2);c.fill();});c.restore();}
  function timer(x,y,f){c.save();ell(c,x,y,15,15);fs(c,'#fff',2.4);c.beginPath();c.moveTo(x,y);c.arc(x,y,12,-Math.PI/2,-Math.PI/2+TAU*f);c.closePath();c.fillStyle=f<.34?'#ff4d6d':'#ffb21f';c.fill();c.restore();}
  function icon(w,x,y,s,t){c.save();c.translate(x,y);c.scale(s,s);QW[w].icon(c,t);c.restore();}
  function drawStar(x,y,r){starAt(c,x,y,r);}
  function drawOllieAt(x,y){
    c.save();c.translate(x,y);c.scale(OSC,OSC);
    if(G.inv>0&&Math.floor(G.t*14)%2&&G.phase!=='over'&&G.stuck<=0)c.globalAlpha=.45;
    if(G.stuck>0)c.rotate(Math.sin(G.t*30)*.06);                                      // wriggling free
    const running=(G.phase==='run'&&G.stuck<=0)||G.phase==='arrive'||(G.phase==='intro'&&G.t>1.2);
    drawOllie(c,Object.assign({t:G.t,walk:running?Math.min(1,.5+G.v/300):0,flap:G.phase==='won'||G.phase==='intro',blink:Math.floor(G.t*10)%37===0,
      hurt:G.hurt>0||G.phase==='over',char:G.char>0,squash:G.squash},G.wear));
    if(G.bump>0){ell(c,8,-74,6*Math.min(1,G.bump*2),5*Math.min(1,G.bump*2));fs(c,'#ff6b8b',1.6);}                 // a bee sting bump
    if(G.stuck>0){if(G.stuckW==='web')webLines(c,4,-38,46,.95);else{c.strokeStyle='#c9a46a';c.lineWidth=2;
      for(let k=-4;k<=4;k++){c.beginPath();c.moveTo(-36+k*2,-80);c.lineTo(k*9,4);c.stroke();}for(let r=0;r<5;r++){c.beginPath();c.moveTo(-34,-70+r*16);c.quadraticCurveTo(4,-78+r*16,40,-70+r*16);c.stroke();}}}
    c.restore();
    if(G.dizzy>0){for(let k=0;k<3;k++){const a=G.t*6+k*TAU/3;drawStar(x+Math.cos(a)*26,y-OSC*76+Math.sin(a)*7,7);}}
  }
  // a word thrown by the boss at Ollie, or by Ollie at the boss
  function attackArt(a,fromX,fromY,toX,toY,byBoss){
    const p=a.t,t=G.t;
    if(a.w==='sun'){
      const sx=byBoss?W*.42:W*.5,sy=46;icon('sun',sx,sy,.9,t);
      if(p>.25&&!(a.dodge&&p>.6)){const gx=byBoss?fromX-40:OX+60,gy=byBoss?fromY-60:GY-110;

      if(a.dodge&&p>.5){c.save();c.translate(sx,sy);c.scale(.9,.9);drawSun(c,t,{cool:true});c.restore();}

    const arc=a.w==='cow'||a.w==='ox'?150:110,q=clamp01(p/.95),x=lerp(fromX,toX,q),y=lerp(fromY,toY,q)-Math.sin(q*Math.PI)*arc;

    if(p>.95&&!byBoss){const k=p-.95,st=QW[a.w].stick;c.save();                       // what Ollie threw stays on the boss a moment
      if(st==='sit'){c.translate(toX,toY-24+Math.abs(Math.sin(k*14))*-6);c.scale(.8,.8*(1-Math.min(k,.1)*2));QW[a.w].fly(c,t);
        for(let j=0;j<3;j++)drawStar(toX-20+Math.cos(t*6+j*2)*34,toY-80+Math.sin(t*6+j*2)*8,7);}
      else if(st==='cling'){c.translate(toX-50,toY+30+Math.sin(t*30)*3);c.rotate(-.6+Math.sin(t*25)*.2);c.scale(-1,1);QW[a.w].fly(c,t);}
      else if(st==='orbit'){for(let j=0;j<3;j++){const an=t*5+j*TAU/3;c.save();c.translate(toX+Math.cos(an)*60,toY+Math.sin(an)*26);c.scale(.75,.75);QW[a.w].fly(c,t);c.restore();}}
      else if(st==='wrap'){if(a.w==='web')webLines(c,toX,toY+40,90,.95);else{c.translate(toX,toY+70);c.scale(1.6,1.6);drawNetTrap(c,t,{drop:1,norope:true});}}
      else if(st==='burn'){ell(c,toX,toY+10,40,18);c.fillStyle='rgba(255,120,30,.75)';c.fill();for(let j=0;j<4;j++){ell(c,toX-30+j*20,toY+26+Math.sin(t*8+j)*4,5,8);fs(c,'#ff8a1f',0);}}
      c.restore();return;}
    if(p>.95)return;
    c.save();c.translate(x,y);if(a.w!=='hot'&&a.w!=='web'&&a.w!=='net')c.rotate(p*(byBoss?-9:9));
    if(!byBoss)c.scale(-1,1);

  function draw(){

          c.save();c.translate(q*60,-240-q*200+q*q*260);c.rotate(q*4);rr(c,-8,-26,16,52,3);fs(c,'#3d4252',2.4);c.restore();

      c.restore();

      for(let k=0;k<7;k++){const y=150+hash(k)*130,x=((hash(k+3)*W*1.3-G.px*1.6)%(W*1.3)+W*1.3)%(W*1.3)-60,l=40+hash(k+7)*60;c.beginPath();c.moveTo(x,y);c.lineTo(x+l,y);c.stroke();}c.restore();}
    drawOllieAt(OX,GY-(G.phase==='won'?Math.abs(Math.sin(t*5))*30:0));
    if(B){const [mx,my]=bpt(L.muzzle),[hx,hy]=bpt(L.head);
      if(G.phase==='attack')attackArt(G.anim,mx,my,OX+10,GY-50,true);
      if(G.phase==='pattack')attackArt(G.anim,OX+50,GY-70,hx,hy,false);
      if(G.phase==='tele'){const cx=B.x+L.cloud[0],cy=L.cloud[1],f=clamp01(B.tt/B.T),sh=f<.3?Math.sin(t*40)*2:0;
        L.bub.forEach(([bx,by],k)=>{const r=6+k*3;ell(c,B.x+bx,GY+by,r,r);fs(c,'#fff',2.2);});
        cloud(cx+sh,cy,48);icon(B.ask,cx+sh,cy+6,.62,t);timer(cx+58,cy-30,f);}
      if(G.phase==='turn'){const n=NW,span=72+(n-3)*26,r=52+(n-3)*10,cx=OX+90+(n-3)*12,cy=92,f=clamp01(B.tt/B.T),s=.33*Math.sqrt(3/n);
        [[OX+30,GY-110,6],[OX+50,GY-132,9]].forEach(([x,y,rr2])=>{ell(c,x,y,rr2,rr2);fs(c,'#fff',2.2);});
        cloud(cx,cy,r);L.words.forEach((w,k)=>icon(w,cx-span/2+k*span/(n-1),cy+6,s,t));drawStar(cx,cy-36-(n-3)*6,10+Math.sin(t*8)*2);timer(cx+r+10,cy-34,f);}}
    for(const q of G.parts){const a=1-q.t/q.life;c.save();c.globalAlpha=clamp01(a*1.5);
      if(q.type==='text'){const s=q.t<.15?q.t/.15*1.2:1;c.translate(q.x,q.y);c.scale(s,s);c.rotate(-.08);c.font='700 30px Fredoka, Trebuchet MS, sans-serif';c.textAlign='center';
        c.lineWidth=6;c.strokeStyle=INK;c.strokeText(q.text,0,0);c.fillStyle=q.col;c.fillText(q.text,0,0);}
      else if(q.type==='star')drawStar(q.x,q.y,7);
      else if(q.type==='smoke'){ell(c,q.x,q.y,8+q.t*22,8+q.t*22);c.fillStyle=q.col||'rgba(90,90,100,.6)';c.fill();}
      else if(q.type==='check'){c.translate(q.x,q.y-q.t*30);c.font='700 46px Fredoka, sans-serif';c.textAlign='center';c.lineWidth=7;c.strokeStyle=INK;c.strokeText('✓',0,0);c.fillStyle='#34d399';c.fillText('✓',0,0);}
      c.restore();}
    if(G.phase==='intro'){const p=G.t;const txt=p<1?'Ready?':'GO!';c.save();c.translate(W/2,140);c.scale(1+Math.sin(p*6)*.04,1+Math.sin(p*6)*.04);
      c.font='700 64px Fredoka, sans-serif';c.textAlign='center';c.lineWidth=10;c.strokeStyle=INK;c.strokeText(txt,0,0);c.fillStyle='#ffd23f';c.fillText(txt,0,0);c.restore();}
    if(G.phase==='bossin'){c.save();c.font='700 40px Fredoka, sans-serif';c.textAlign='center';c.lineWidth=8;c.strokeStyle=INK;const s=1+Math.sin(t*10)*.05;
      c.translate(W/2,120);c.scale(s,s);c.strokeText(L.boss+'!',0,0);c.fillStyle='#ff5fa2';c.fillText(L.boss+'!',0,0);c.restore();}
  }
  let dtLast=0;
  function frame(ts){
    if(my!==TOK){window.removeEventListener('resize',size);return;}
    const real=last?Math.min(.05,(ts-last)/1000):0;last=ts;
    const paused=document.hidden||innerHeight>innerWidth;MUSIC.paused=paused;
    dtLast=paused?0:real*sc();
    if(!paused&&G.phase!=='over'&&G.phase!=='won'){const n=Math.ceil(dtLast/.02);for(let k=0;k<n;k++)update(dtLast/n);}
    if(G.phase==='over'&&!paused)G.t+=real;
    if(G.phase==='over'&&G.t-G.overAt>1)over();
    draw();
    requestAnimationFrame(frame);
  }
  size();reset();requestAnimationFrame(frame);
}

const escH=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
/* every line the game can say, grouped for recording; each line once */
function recGroups(){
  const nm=S.name||'',seen=new Set(),G=[];
  const item=(t,key,big,sub)=>({t,key,big,sub});
  const grp=(id,title,texts,note)=>{const items=[];
    texts.forEach(t=>splitSent(t).forEach(x=>{const k=mkey(x);if(!k||seen.has(k)||PHK[k]||/^that word is \w+$/.test(k))return;seen.add(k);items.push(item(x,recKey(k)));}));
    if(items.length)G.push({id,title,items,note});};
  G.push({id:'letters',title:'Letter sounds',note:'Say just the sound, short and clean: /t/ not “tuh”, /m/ as a short “mmm”.',
    items:PHON.map(x=>item(x[1],'p:'+x[0],disp(x[1]),`${x[3]?x[3]+' · ':''}as in “${x[2]}”`))});
  [1,2,3,4,5].forEach(l=>{const ws=WORDS.filter(w=>w.lvl===l);ws.forEach(w=>seen.add(w.w));
    G.push({id:'w'+l,title:`Words · level ${l}`,note:'Read each word clearly, the way you want your child to hear it.',items:ws.map(w=>item(w.w,'w:'+w.w,disp(w.w),w.emoji))});});
  grp('praise','Praise',PRAISE,'Said when a word is read right. The word itself comes from your word recordings.');
  grp('talk',"Ollie's prompts",[...START_LINES,...TRY1,'That word is',...FIXED_LINES,'Silent e!'],'“That word is” is recorded once; the word is added from your word recordings.');
  grp('hints','Letter hints',PHON.map(x=>`like ${x[2]}`).concat([...new Set(WORDS.flatMap(w=>w.tiles.filter(t=>t.s==='-').map(t=>`silent ${t.t}`)))]),'Played after a letter sound when a letter is tapped.');
  grp('sfx','Fun sounds',WORDS.flatMap(w=>w.sfx.split('|').filter(x=>x[0]!=='~')),'Played in the celebration for some words. Have fun with these.');
  STORIES.forEach(st=>{const T=[];st.sents.forEach(se=>{
      let k=0;while(k<se.toks.length){let j=k;while(j<se.toks.length&&!se.toks[j].target)j++;if(j>k)T.push(se.toks.slice(k,j).map(t=>t.disp).join(' '));k=j+1;}
      T.push(se.toks.map(t=>t.disp).join(' '));});
    grp('st-'+st.id,`Story: ${st.title}`,T,'Short pieces are read before your child reads the next word; whole sentences are read back at the end.');});
  const rest=[...murfTexts()].filter(([k])=>k[0]!=='@').map(([,t])=>t);
  grp('other','Other lines',rest);
  return G;
}
let GUIDE=null;
async function recordInto(key,meter,statusFn){
  const kind=key[0];
  let stream;try{stream=await getMic();}catch(e){statusFn(micHelp(e.name||'error'));return null;}
  statusFn('Recording… speak now.');
  const cap=startCapture(stream,{maxSec:kind==='p'?2.5:kind==='w'?3.5:10,quietSec:kind==='p'?.6:kind==='w'?.7:1.1,
    onLevel:x=>{if(meter)meter.style.width=Math.min(100,x*500)+'%';}});
  GUIDE=cap;
  const raw=await cap.done;GUIDE=null;if(meter)meter.style.width='0';
  const c=trimClip(raw);
  if(!c){statusFn("Didn't catch that. Try again a little louder or closer.");return null;}
  delete c.off;
  if(!await saveClip(key,c)){statusFn('Could not save on this device (storage blocked?).');return null;}
  statusFn('');return c;
}
function guided(items,title,onDone){
  const todo=items.filter(x=>!hasClip(x.key));
  const box=document.createElement('div');box.className='gwrap';document.body.appendChild(box);
  let i=0,busy=false;
  const close=()=>{if(GUIDE){GUIDE.stop();GUIDE=null;}box.remove();onDone&&onDone();};
  if(!todo.length){box.innerHTML=`<div class="gcard"><div class="gtext">Everything in “${escH(title)}” is recorded 🎉</div><div class="gnav"><span></span><button class="btn sm green" data-g="close">Done</button></div></div>`;}
  const show=()=>{
    if(i>=todo.length){box.innerHTML=`<div class="gcard"><div class="gtext">All done 🎉</div><div class="gsub">${escH(title)}</div><div class="gnav"><span></span><button class="btn sm green" data-g="close">Done</button></div></div>`;return;}
    const it=todo[i],has=hasClip(it.key);
    box.innerHTML=`<div class="gcard">
      <div class="gtop"><span>${escH(title)} · ${i+1} of ${todo.length}</span><button class="vb" data-g="close" aria-label="Close">✕</button></div>
      <div class="gtext">${escH(it.big||it.t)}</div>${it.sub?`<div class="gsub">${escH(it.sub)}</div>`:''}
      <div class="vmeter"><i id="g-meter"></i></div>
      <div class="gbtns"><button class="vb rec big" data-g="rec" aria-label="Record">●</button><button class="vb" data-g="play" aria-label="Play" ${has?'':'disabled'}>▶</button></div>
      <div class="gstat" id="g-stat">${has?'Sounds good? Tap Next. Or record again.':'Tap ● and say it. Recording stops when you finish.'}</div>
      <div class="gnav"><button class="btn sm ghost" data-g="skip">Skip</button><button class="btn sm green" data-g="next" ${has?'':'disabled'}>Next ➜</button></div></div>`;
  };
  if(todo.length)show();
  box.onclick=async e=>{
    const b=e.target.closest('[data-g]');if(!b)return;const g=b.dataset.g;ac();
    if(g==='close')return close();
    if(g==='skip'||g==='next'){if(GUIDE){GUIDE.stop();}i++;show();return;}
    const it=todo[i];if(!it)return;
    if(g==='play'){stopSpeech();playClip(it.key);return;}
    if(g==='rec'){
      if(GUIDE){GUIDE.stop();return;}
      if(busy)return;busy=true;stopSpeech();
      b.classList.add('on');b.textContent='■';
      const st=t=>{const x=$('#g-stat',box);if(x&&t)x.textContent=t;};
      const c=await recordInto(it.key,$('#g-meter',box),st);
      busy=false;if(!box.isConnected)return;
      b.classList.remove('on');b.textContent='●';
      if(c){$('[data-g=play]',box).disabled=false;$('[data-g=next]',box).disabled=false;st('Sounds good? Tap Next. Or record again.');await sleep(120);playClip(it.key);}
    }
  };
}
function screenVoice(){micOff();releaseMic();
  stopAll();
  const G=recGroups(),all=G.flatMap(g=>g.items);
  const row=it=>`<div class="vrow ${hasClip(it.key)?'has':''}" data-k="${escH(it.key)}"><div class="vl">${it.key[0]==='p'||it.key[0]==='w'?`<b>${escH(it.big||it.t)}</b><span>${escH(it.sub||'')}</span>`:`<span class="vt">${escH(it.t)}</span>`}</div>
    <button class="vb rec" data-v="rec" aria-label="Record">●</button><button class="vb" data-v="play" aria-label="Play" ${hasClip(it.key)?'':'disabled'}>▶</button><button class="vb" data-v="del" aria-label="Delete" ${hasClip(it.key)?'':'disabled'}>✕</button></div>`;
  setView(`<div class="col">
    ${top('🎙️ Record your voice',`<button class="rbtn" data-act="settings" aria-label="Back to settings">←</button>`)}
    <div class="vhead"><b>Everything Ollie says, in your voice.</b> Tap ● and say the line; it stops by itself and plays back. Record as much or as little as you like: anything you haven't recorded uses the AI voice (or the device voice).
      <div class="row" style="margin-top:10px"><span>Use my recordings<small>Off = AI voice everywhere</small></span><label class="sw"><input type="checkbox" id="v-mine" ${useMine()?'checked':''}></label></div>
      <div id="v-status" style="margin-top:8px;font-weight:700"></div>
      <button class="btn sm green" data-go="all" style="margin-top:10px">🎙️ Record what's missing, one by one</button></div>
    <div class="vmeter"><i id="v-meter"></i></div>
    ${G.map((g,gi)=>`<details class="vsec" data-g="${gi}"><summary>${escH(g.title)} <span data-gc="${gi}" style="font-weight:600;color:var(--ink2)"></span></summary>
      ${g.note?`<p class="vp">${escH(g.note)}</p>`:''}<button class="btn sm pink vgo" data-go="${gi}">Record missing here, one by one</button>
      <div class="vlist"></div></details>`).join('')}
  </div>`);
  const col=$('.col',view),meter=$('#v-meter'),stat=$('#v-status');
  const counts=()=>{G.forEach((g,gi)=>{const e=$(`[data-gc="${gi}"]`,col);if(e)e.textContent=`· ${g.items.filter(x=>hasClip(x.key)).length}/${g.items.length}`;});
    stat.textContent=`${all.filter(x=>hasClip(x.key)).length} of ${all.length} lines recorded.`;};
  const status=msg=>{if(msg)stat.textContent=msg;else counts();};
  counts();
  // rows are built when a section is opened (keeps the page fast)
  $$('details.vsec',col).forEach(d=>d.addEventListener('toggle',()=>{const l=$('.vlist',d);if(d.open&&!l.childElementCount)l.innerHTML=G[+d.dataset.g].items.map(row).join('');}));
  const refresh=r=>{const h=hasClip(r.dataset.k);r.classList.toggle('has',h);$$('[data-v=play],[data-v=del]',r).forEach(b=>b.disabled=!h);};
  $('#v-mine').onchange=e=>{S.settings.mine=e.target.checked;persist();};
  let cur=null;
  col.onclick=async ev=>{
    const go=ev.target.closest('[data-go]');
    if(go){ac();stopSpeech();const g=go.dataset.go==='all'?{items:all,title:'Everything'}:G[+go.dataset.go];
      guided(g.items,g.title,()=>{$$('.vrow',col).forEach(refresh);counts();});return;}
    const b=ev.target.closest('[data-v]');if(!b)return;
    const r=b.closest('.vrow'),k=r.dataset.k,v=b.dataset.v;
    ac();
    if(v==='play'){stopSpeech();playClip(k);return;}
    if(v==='del'){await delClip(k);refresh(r);counts();return;}
    if(cur){const same=cur===k;if(GUIDE)GUIDE.stop();if(same)return;await sleep(80);}
    stopSpeech();cur=k;
    b.classList.add('on');b.textContent='■';
    const c=await recordInto(k,meter,status);
    if(cur===k)cur=null;
    b.classList.remove('on');b.textContent='●';
    if(!view.contains(r))return;
    refresh(r);counts();
    if(c){await sleep(120);playClip(k);}
  };
}

/* A returning player (page opened again or refreshed) hears the greeting. Once the voice is ready it
   plays straight away if the browser allows sound; iPhone/iPad allow no sound before the first tap,
   so there it plays on the first tap, unless that tap already starts something (a menu button). */
let GREETED=false;const RETURN_GREET='Hello, again! Ready to read?';
function greetOnReturn(){
  const greetNow=()=>{if(GREETED||!$('.home')||$('#vgate'))return;GREETED=true;setBubble(RETURN_GREET);say(RETURN_GREET);};
  const onTap=e=>{
    if(waiting()&&!SILENT)return;   // still loading: the voice card is up
    document.removeEventListener('pointerup',onTap,true);
    const b=e.target.closest('[data-act],#gear');
    if(b&&b.dataset.act!=='owl'){GREETED=true;return;}
    setTimeout(greetNow,60);
  };
  document.addEventListener('pointerup',onTap,true);
  (async()=>{
    while(waiting()&&!SILENT)await sleep(100);
    if(SILENT)return;
    const c=ac();if(c&&c.state!=='running')await sleep(300);
    if(c&&c.state==='running'){document.removeEventListener('pointerup',onTap,true);greetNow();}
  })();
}

    mic:'Ollie is talking. Press the <b>volume buttons</b> until Ollie sounds right, then tap Sounds good.'};

    <p class="gsub" style="margin:0" data-step="${st}">${TXT[st]}</p>
    <div class="gstat" id="sc-st"></div>
    <div class="gnav"><button class="btn sm ghost" data-sc="skip">Skip</button><button class="btn sm green" data-sc="${BTN[st][0]}">${BTN[st][1]}</button></div></div>`;};
  show('intro');document.body.appendChild(box);
  box.onclick=async e=>{
    const b=e.target.closest('[data-sc]');if(!b)return;const a=b.dataset.sc;
    if(a==='skip')return finish(false);
    if(a==='done')return finish(true);
    if(a==='start'){
      ac();b.disabled=true;let err='';
      try{await holdMic();if(HELD)MICPRE=true;else err='error';}catch(x){err=x.name||'error';}
      show('mic');if(err){const st=$('#sc-st',box);if(st)st.textContent=micHelp(err);}
      syncACSoon(600);talk();
    }
  };
}
function welcome(){
  modal.innerHTML=`<div class="mcard" style="text-align:center;align-items:center">
    <div style="font-size:90px;line-height:1">${ollieImg()}</div>
    <h2>Hi! I'm Ollie!</h2>
    <p>Let's read words together. What's your name?</p>
    <input type="text" id="w-name" placeholder="Type a name" maxlength="20" autocomplete="off" style="text-align:center">
    <p>Grown-ups: the first time the microphone is tapped, your device will ask to use it. Tap <b>Allow</b>. Press and hold ⚙️ on the home screen for settings, including recording the letter sounds in your own voice.</p>
    <button class="btn big green" id="w-go">Let's go!</button>
    <div id="w-wait" style="width:100%;display:flex;flex-direction:column;align-items:center;gap:6px">
      <p>Getting Ollie's voice…</p>
      <div class="vmeter" style="width:100%;height:14px;border-radius:7px"><i data-vgate-bar></i></div>
      <button class="link" id="w-silent">Continue without sound</button></div>
    <p id="w-fail" hidden>Ollie's voice didn't download. The device voice will be used for now; it tries again next time.</p>
  </div>`;
  modal.classList.add('on');
  $('#w-silent').onclick=()=>{SILENT=true;gateUpdate();};
  gateUpdate();
  $('#w-go').onclick=()=>{if($('#w-go').disabled)return;ac();S.name=$('#w-name').value.trim();S.seen=true;persist();modal.classList.remove('on');modal.innerHTML='';screenHome();
    const hi=()=>say(greet());
    if(needsSoundCheck()&&!S.soundChecked&&!SILENT)soundCheck(hi);else hi();};
}

/* =====================================================================
   EVENTS
   ===================================================================== */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  ac();
  const id=b.dataset.id;
  switch(b.dataset.act){
    case 'home':screenHome();break;
    case 'play':startRound();break;
    case 'stories':screenStories();break;
    case 'games':screenGames();break;
    case 'game':startGame(id);break;
    case 'gpractice':startRound(GAMES.find(x=>x.id===id).words.map(w=>BYW[w]));break;
    case 'wear':{toggleWear(id);FX.pop();screenGames();break;}
    case 'quest':screenQuest();break;
    case 'qlevel':startQuestLevel(+id);break;
    case 'qpractice':startRound(QLEVELS[+id].words.map(w=>BYW[w]));break;
    case 'stickers':screenStickers();break;
    case 'known':screenKnown();break;
    case 'sayword':{stopSpeech();const el=b;el.classList.remove('boing');void el.offsetWidth;el.classList.add('boing');say(`${id}!`,{rate:.8,slow:.85});break;}
    case 'story':openStory(id);break;
    case 'practice':startRound(practiceList(STORIES.find(s=>s.id===id)));break;
    case 'settings':openSettings();break;
    case 'scenes':screenScenes();break;
    case 'scene':screenScene(id);break;
    case 'storynext':QS.i++;if(QS.i>=QS.st.sents.length)storyEnd();else storyPage();break;
    case 'owl':GREETED=true;stopSpeech();owlTalk();say(greet()+" Tap Let's Read to start!");break;
    case 'owlsay':{const bb=$('#bubble');if(bb){stopSpeech();owlTalk();say(bb.textContent);}break;}
  }
});
document.addEventListener('contextmenu',e=>e.preventDefault());

if(!S.seen)screenHome(),welcome();else{screenHome();greetOnReturn();}
})();
</script>
