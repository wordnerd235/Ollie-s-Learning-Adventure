<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ollie's Word Adventure (test version)</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#7fd0ff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Andika:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --font:'Fredoka','Baloo 2',ui-rounded,'SF Pro Rounded','Trebuchet MS','Comic Sans MS',system-ui,sans-serif;
  --letters:'Andika','Century Gothic','Trebuchet MS','Comic Sans MS',sans-serif;
  --sky1:#7fd0ff; --sky2:#c9ecff; --sky3:#fff3c4;
  --ink:#2b2350; --ink2:#6b6198;
  --card:rgba(255,255,255,.84); --card2:#ffffff;
  --line:rgba(43,35,80,.12);
  --cloud-o:.75;
  --primary:#7c5cff; --primary-d:#5a3fe0;
  --pink:#ff5fa2; --pink-d:#d23a80;
  --green:#34d399; --green-d:#159f72;
  --yellow:#ffd23f; --yellow-d:#dfa500;
  --blue:#4da3ff; --blue-d:#2a78d6;
  --vowel:#ff6a5b; --vowel-d:#d94a3c;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --sky1:#1a1550; --sky2:#28277a; --sky3:#4a3a8c;
    --ink:#f5f1ff; --ink2:#c4bbf0;
    --card:rgba(42,37,102,.88); --card2:#302b72;
    --line:rgba(255,255,255,.16); --cloud-o:.12;
  }
}
:root[data-theme="dark"]{
  --sky1:#1a1550; --sky2:#28277a; --sky3:#4a3a8c;
  --ink:#f5f1ff; --ink2:#c4bbf0;
  --card:rgba(42,37,102,.88); --card2:#302b72;
  --line:rgba(255,255,255,.16); --cloud-o:.12;
}
*,*::before,*::after{box-sizing:inherit}
html{
  height:100%;
  scroll-padding-top:env(safe-area-inset-top,0px);
  background:linear-gradient(180deg,var(--sky1),var(--sky2) 60%,var(--sky3)) fixed;
  overscroll-behavior:none;
}
body{
  margin:0;height:100%;overflow:hidden;background:transparent;
  font-family:var(--font);color:var(--ink);
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;
}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:4px solid #fff;outline-offset:3px;box-shadow:0 0 0 7px var(--primary)}

/* sky */
.sky{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.cloud{position:absolute;left:0;width:140px;height:44px;background:#fff;border-radius:44px;opacity:var(--cloud-o);animation:cloudmove linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:64px;height:64px;left:20px;top:-32px}
.cloud::after{width:84px;height:84px;right:18px;top:-44px}
@keyframes cloudmove{from{transform:translateX(-220px)}to{transform:translateX(calc(100vw + 220px))}}

#app{position:relative;z-index:1;height:100%}
#view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.col{width:100%;max-width:720px;margin:0 auto;padding:12px 16px 28px;min-height:100%;display:flex;flex-direction:column;gap:12px}

/* buttons */
.btn{border:0;border-radius:28px;padding:14px 24px;font-weight:700;font-size:clamp(18px,4.6vw,26px);color:#fff;
  background:var(--primary);box-shadow:0 8px 0 var(--primary-d),0 14px 22px rgba(43,35,80,.18);
  transition:transform .08s,box-shadow .08s;line-height:1.1;position:relative}
.btn:active{transform:translateY(6px);box-shadow:0 2px 0 var(--primary-d)}
.btn.big{padding:18px 28px;font-size:clamp(22px,6vw,32px);border-radius:32px;width:100%}
.btn.sm{padding:10px 16px;font-size:clamp(16px,4vw,20px);border-radius:22px;box-shadow:0 6px 0 var(--primary-d)}
.btn.green{background:var(--green);box-shadow:0 8px 0 var(--green-d),0 14px 22px rgba(21,159,114,.25)}
.btn.green:active{box-shadow:0 2px 0 var(--green-d)}
.btn.pink{background:var(--pink);box-shadow:0 8px 0 var(--pink-d),0 14px 22px rgba(210,58,128,.25)}
.btn.pink:active{box-shadow:0 2px 0 var(--pink-d)}
.btn.yellow{background:var(--yellow);color:#4a3600;box-shadow:0 8px 0 var(--yellow-d),0 14px 22px rgba(223,165,0,.25)}
.btn.yellow:active{box-shadow:0 2px 0 var(--yellow-d)}
.btn.blue{background:var(--blue);box-shadow:0 8px 0 var(--blue-d)}
.btn.blue.sm,.btn.yellow.sm,.btn.green.sm,.btn.pink.sm{box-shadow-width:0}
.btn.sm.blue{box-shadow:0 6px 0 var(--blue-d)}
.btn.sm.yellow{box-shadow:0 6px 0 var(--yellow-d)}
.btn.sm.green{box-shadow:0 6px 0 var(--green-d)}
.btn.sm.pink{box-shadow:0 6px 0 var(--pink-d)}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:0 6px 0 var(--line)}
.hold{position:relative;overflow:hidden;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:none}
.hold::before{content:'';position:absolute;inset:0;width:0;background:var(--green);opacity:.35;pointer-events:none}
.btn.hold::before{background:#fff}
.hold.holding::before{width:100%;transition:width 5s linear}
.hold>span{position:relative}
.link{background:none;border:0;font-weight:600;font-size:clamp(16px,4vw,20px);color:var(--ink2);padding:10px 14px;border-radius:16px;text-decoration:underline;text-underline-offset:4px}
.rbtn{width:54px;height:54px;border-radius:50%;border:0;font-size:26px;background:var(--card2);box-shadow:0 5px 0 var(--line),0 8px 16px rgba(43,35,80,.12);display:grid;place-items:center}
.rbtn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.badge{position:absolute;top:-8px;right:-4px;background:var(--vowel);color:#fff;border-radius:999px;min-width:32px;height:32px;display:grid;place-items:center;font-size:18px;border:3px solid #fff}

/* top bar */
.top{display:flex;align-items:center;gap:10px;justify-content:space-between}
.ttl{font-weight:700;font-size:clamp(20px,5vw,28px);flex:1;text-align:center}
.starbadge{background:var(--card2);border-radius:999px;padding:8px 16px;font-weight:700;font-size:22px;box-shadow:0 5px 0 var(--line)}
.dots{display:flex;gap:7px;align-items:center;justify-content:center;flex:1}
.dots i{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.65);display:block;border:2px solid rgba(43,35,80,.1)}
.dots i.d{background:var(--green);border-color:var(--green-d)}
.dots i.c{background:var(--yellow);border-color:var(--yellow-d);transform:scale(1.35)}

/* mascot */
.mascot{display:flex;align-items:center;gap:10px}
.owl{background:none;border:0;font-size:56px;line-height:1;padding:0;filter:drop-shadow(0 6px 6px rgba(43,35,80,.2))}
.owl.sm{font-size:50px}
.bubble{position:relative;background:var(--card2);border-radius:22px;padding:12px 16px;font-weight:600;font-size:clamp(16px,4.2vw,21px);line-height:1.25;flex:1;box-shadow:0 5px 0 var(--line)}
.bubble::before{content:"";position:absolute;left:-10px;top:50%;margin-top:-10px;border:10px solid transparent;border-right-color:var(--card2);border-left:0}
.owl.talk{animation:owltalk .9s ease-in-out}
@keyframes owltalk{0%,100%{transform:none}20%{transform:translateY(-10px) rotate(-7deg)}45%{transform:translateY(0) rotate(5deg)}70%{transform:translateY(-4px) rotate(-3deg)}}

/* home */
.home{align-items:center;justify-content:center;text-align:center;gap:16px;position:relative}
.home .hero{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%}
.home .owl{font-size:clamp(96px,26vw,150px)}
.home .bubble{flex:none;max-width:420px}
.home .bubble::before{left:50%;top:-10px;margin:0 0 0 -10px;border:10px solid transparent;border-bottom-color:var(--card2);border-top:0}
.title{margin:0;font-size:clamp(34px,10vw,58px);line-height:1;font-weight:700;letter-spacing:-.5px;color:var(--ink);text-shadow:0 3px 0 rgba(255,255,255,.55)}
.title span{color:var(--primary)}
.menu{display:flex;flex-direction:column;gap:20px;width:100%;max-width:440px;margin-top:6px}
.stats{display:flex;gap:14px;align-items:center;font-weight:600;font-size:19px;background:var(--card);border-radius:999px;padding:8px 18px}
.known{font:inherit;font-weight:700;color:var(--ink);background:var(--card2);border:0;border-radius:999px;padding:6px 14px;box-shadow:0 4px 0 var(--line);cursor:pointer}
.known:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px}
.kw{background:var(--card);border:0;border-radius:22px;padding:10px 6px;box-shadow:0 5px 0 var(--line);display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink);cursor:pointer}
.kw .ke{font-size:44px;line-height:1}
.kw .kt{font-family:var(--letters);font-weight:700;font-size:26px}
.kw.boing{animation:tboing .5s}
.gear{position:absolute;right:6px;top:6px;width:48px;height:48px;border-radius:50%;border:0;background:var(--card);font-size:22px;opacity:.7}
.hint{font-size:13px;color:var(--ink2);margin-top:-6px}
.build{font-size:11px;opacity:.8}

/* activity */
.act{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%}
@keyframes wob{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg) scale(1.08)}}
.tiles{display:flex;justify-content:center;align-items:flex-end;width:100%;padding:8px 0 14px}
.tile{width:calc(var(--tw,90px)*var(--w,1));height:calc(var(--tw,90px)*1.18);font-size:calc(var(--tw,90px)*.68);
  display:grid;place-items:center;border-radius:24%;font-family:var(--letters);font-weight:700;color:#fff;line-height:1;
  box-shadow:0 8px 0 rgba(0,0,0,.2),0 14px 18px rgba(43,35,80,.18);cursor:pointer;
  text-shadow:0 3px 0 rgba(0,0,0,.18);transition:transform .12s;flex:none;padding-bottom:.04em}
.tile.v{background:linear-gradient(#ff8f7a,var(--vowel))}
.tile.d{background:linear-gradient(#b79bff,#8e6bff)}
.tile.c0{background:linear-gradient(#7cc0ff,var(--blue))}
.tile.c1{background:linear-gradient(#4de3c8,#1fb8a0)}
.tile.c2{background:linear-gradient(#ffc45c,#ff9f2e)}
.tile.c3{background:linear-gradient(#7ee7a1,#33c46e)}
.tile.silent{background:var(--card);border:4px dashed var(--ink2);color:var(--ink2);box-shadow:none;text-shadow:none;opacity:.8}
.tile.lit{transform:translateY(-14px) scale(1.14);filter:brightness(1.12);outline:6px solid rgba(255,255,255,.9)}
.tile.boing{animation:tboing .5s}
.tiles.sm .tile{box-shadow:0 5px 0 rgba(0,0,0,.2)}
.tiles.ok .tile{background:linear-gradient(#7ee7a1,var(--green));cursor:default}
@keyframes tboing{0%{transform:scale(1)}30%{transform:translateY(-14px) scale(1.15,.9)}60%{transform:translateY(0) scale(.94,1.08)}100%{transform:scale(1)}}
.helpers{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;padding-bottom:6px}
.micwrap{display:flex;flex-direction:column;align-items:center;gap:14px;min-height:150px;justify-content:center;width:100%}
.miclabel{font-weight:600;font-size:clamp(16px,4vw,20px);color:var(--ink);min-height:1.3em;text-align:center}
.say{font-weight:700;font-size:clamp(20px,5vw,26px);text-align:center}
.mic{width:clamp(96px,30vw,128px);aspect-ratio:1;border-radius:50%;border:0;font-size:clamp(44px,13vw,60px);color:#fff;
  background:radial-gradient(circle at 35% 30%,#ff9ac6,var(--pink) 60%,#e83e8c);
  box-shadow:0 10px 0 var(--pink-d),0 16px 28px rgba(210,58,128,.35);position:relative;animation:micidle 2.2s ease-in-out infinite;transition:transform .08s}
.mic::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:5px solid rgba(255,95,162,.5);opacity:0}
.mic:active{transform:translateY(6px);box-shadow:0 4px 0 var(--pink-d)}
.mic.listening{background:radial-gradient(circle at 35% 30%,#8ff0c2,var(--green) 60%,var(--green-d));box-shadow:0 10px 0 var(--green-d),0 16px 28px rgba(21,159,114,.4);animation:none}
.mic.on{background:radial-gradient(circle at 35% 30%,#8ff0c2,var(--green) 60%,var(--green-d));box-shadow:0 10px 0 var(--green-d);opacity:.75}
.mic.listening::after{border-color:rgba(52,211,153,.7);animation:ring 1.1s ease-out infinite}
.mic.shake{animation:micshake .5s}
@keyframes micidle{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes ring{0%{transform:scale(.9);opacity:.9}100%{transform:scale(1.5);opacity:0}}
@keyframes micshake{0%,100%{transform:rotate(0)}20%{transform:rotate(-8deg)}40%{transform:rotate(8deg)}60%{transform:rotate(-5deg)}80%{transform:rotate(5deg)}}
.bottomrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
.bottomrow [hidden]{display:none}

/* celebration overlay */
.overlay{position:fixed;inset:0;z-index:60;display:none}
.overlay.on{display:flex}
.cele{margin:auto;width:100%;max-width:640px;padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:12px;
  background:linear-gradient(180deg,rgba(255,243,196,.97),rgba(201,236,255,.97));min-height:100%;justify-content:center;animation:fadein .25s}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .cele{background:linear-gradient(180deg,rgba(74,58,140,.97),rgba(26,21,80,.98))}}
:root[data-theme="dark"] .cele{background:linear-gradient(180deg,rgba(74,58,140,.97),rgba(26,21,80,.98))}
.stage{container-type:inline-size;width:100%;height:clamp(180px,38vh,340px);display:grid;place-items:center;overflow:hidden}
.big{font-size:clamp(120px,36vmin,280px);line-height:1;display:inline-block;filter:drop-shadow(0 12px 14px rgba(43,35,80,.25))}
.cword{width:100%;max-width:420px}
.cpraise{font-size:clamp(30px,8vw,48px);font-weight:700;text-align:center;color:var(--primary);line-height:1.05}
@keyframes fadein{from{opacity:0}to{opacity:1}}

/* fx */
.fxlayer{position:fixed;inset:0;pointer-events:none;z-index:100;overflow:hidden}
.fxlayer i{position:absolute;top:-24px;animation:cf var(--d) ease-in forwards}
@keyframes cf{to{transform:translate3d(var(--x),110vh,0) rotate(720deg)}}
.fxlayer .bs{position:absolute;left:50%;top:40%;font-size:clamp(28px,7vmin,56px);animation:bs 1.2s ease-out forwards;opacity:0}
@keyframes bs{0%{transform:translate(-50%,-50%) scale(.3);opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.2) rotate(var(--r));opacity:0}}
.fxlayer .rf{position:absolute;top:-12%;font-size:clamp(26px,6vmin,44px);animation:rf var(--d) linear forwards}
@keyframes rf{to{transform:translateY(125vh) rotate(40deg)}}

/* emoji animations */
.anim-hop{animation:hop .9s ease-in-out infinite}
.anim-spin{animation:spin 1.6s ease-in-out infinite}
.anim-grow{animation:grow 1.1s ease-in-out infinite}
.anim-fly{animation:fly 1.8s ease-in-out infinite alternate}
.anim-float{animation:float 2s ease-in-out infinite alternate}
.anim-wiggle{animation:wiggle .5s ease-in-out infinite alternate}
.anim-shake{animation:shake .6s ease-in-out infinite}
.anim-glow{animation:glow 1.3s ease-in-out infinite}
.anim-zoom{animation:zoom 1.5s ease-in infinite}
.anim-pop{animation:pop 1.1s ease-in-out infinite}
.anim-swim{animation:swim 2s ease-in-out infinite}
.anim-sway{animation:sway 1.6s ease-in-out infinite;transform-origin:50% 90%}
.anim-twinkle{animation:twinkle 1.1s ease-in-out infinite}
.anim-drive{animation:drive 2.2s linear infinite}
.anim-fall{animation:fall 1.4s linear infinite}
.anim-splash{animation:splash .9s ease-in-out infinite}
.anim-drift{animation:drift 9s ease-in-out infinite alternate}
.anim-drift2{animation:drift 13s ease-in-out infinite alternate-reverse}
.anim-wave{animation:wave 1s ease-in-out infinite;transform-origin:70% 80%}
.em{display:inline-block;line-height:1}
@keyframes hop{0%,100%{transform:translateY(0) scale(1.05,.92)}30%{transform:translateY(-26%) scale(.95,1.08)}60%{transform:translateY(0) scale(1.08,.9)}}
@keyframes spin{0%{transform:rotate(0) scale(1)}50%{transform:rotate(180deg) scale(1.2)}100%{transform:rotate(360deg) scale(1)}}
@keyframes grow{0%,100%{transform:scale(1)}50%{transform:scale(1.32)}}
@keyframes fly{0%{transform:translate(-18cqw,4cqw) rotate(-10deg)}100%{transform:translate(18cqw,-6cqw) rotate(10deg)}}
@keyframes float{0%{transform:translateY(6%)}100%{transform:translateY(-14%)}}
@keyframes wiggle{0%{transform:rotate(-9deg)}100%{transform:rotate(9deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8%)}40%{transform:translateX(8%)}60%{transform:translateX(-6%)}80%{transform:translateX(6%)}}
@keyframes glow{0%,100%{transform:scale(1);filter:drop-shadow(0 0 0 rgba(255,210,60,0))}50%{transform:scale(1.13) rotate(8deg);filter:drop-shadow(0 0 .22em rgba(255,210,60,.95))}}
@keyframes zoom{0%{transform:translate(-70%,70%) scale(.6);opacity:0}15%{opacity:1}80%{opacity:1}100%{transform:translate(70%,-70%) scale(1.15);opacity:0}}
@keyframes pop{0%,100%{transform:scale(1)}25%{transform:scale(1.3) rotate(-6deg)}50%{transform:scale(.95)}75%{transform:scale(1.15) rotate(6deg)}}
@keyframes swim{0%,100%{transform:translateX(-16%) rotate(-4deg)}50%{transform:translateX(16%) rotate(4deg)}}
@keyframes sway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@keyframes twinkle{0%,100%{transform:scale(.85) rotate(0);filter:brightness(1)}50%{transform:scale(1.25) rotate(20deg);filter:brightness(1.3)}}
@keyframes drive{0%{transform:translateX(36cqw)}100%{transform:translateX(-36cqw)}}
@keyframes fall{0%{transform:translateY(-14cqw);opacity:0}15%{opacity:1}100%{transform:translateY(70cqw);opacity:0}}
@keyframes splash{0%,100%{transform:scale(1)}30%{transform:scale(1.25,.8)}60%{transform:scale(.85,1.25) translateY(-10%)}}
@keyframes drift{0%{transform:translateX(-7cqw)}100%{transform:translateX(9cqw)}}
@keyframes wave{0%,100%{transform:rotate(0)}30%{transform:rotate(22deg)}60%{transform:rotate(-14deg)}}
@keyframes idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-4%)}}
@keyframes popin{0%{transform:translate(-50%,-50%) scale(0)}70%{transform:translate(-50%,-50%) scale(1.2)}100%{transform:translate(-50%,-50%) scale(1)}}
.em.d2{animation-delay:.45s}.em.d3{animation-delay:.9s}

/* story */
.scene{position:relative;width:100%;aspect-ratio:4/3;border-radius:30px;overflow:hidden;container-type:inline-size;border:5px solid #fff;
  box-shadow:0 10px 0 rgba(43,35,80,.14),0 18px 30px rgba(43,35,80,.18);flex:none}
.bg-day{background:linear-gradient(#78cdff,#c8ecff 62%)}
.bg-day .ground{background:#7fd36e}
.bg-water{background:linear-gradient(#a5e3ff 0 34%,#4db5ff 34%,#1d7fe0)}
.bg-water .ground{display:none}
.bg-rain{background:linear-gradient(#8fa6bd,#c3d0dc 62%)}
.bg-rain .ground{background:#6fb46a}
.bg-home{background:linear-gradient(#ffe6cf,#ffd2dc 68%)}
.bg-home .ground{background:#e8b98b;height:34%;left:0;right:0;bottom:0;border-radius:0}
.ground{position:absolute;left:-10%;right:-10%;bottom:-24%;height:50%;border-radius:50%}
.it{position:absolute;transform:translate(-50%,-50%);line-height:1;pointer-events:none;font-size:calc(var(--s)*1cqw);animation:popin .55s both}
.scene:not(.done) .it:not(.decor) .em{animation:idle 2.6s ease-in-out infinite}
.sent{font-size:clamp(28px,7.4vw,46px);font-weight:600;line-height:1.35;text-align:center;padding:4px 6px}
.sent .w{display:inline-block;padding:0 8px;margin:2px 0;border-radius:14px;transition:background .2s,color .2s}
.sent .w.on{background:#ffe27a;color:#4a3600}
.sent .w.tg{border-bottom:6px dashed var(--pink)}
.sent .w.tg.active{animation:pop 1.1s ease-in-out infinite;background:#ffd6e8;color:#7a1848}
.sent .w.tg.ok{border-bottom-color:transparent;color:var(--green-d);font-weight:700}
.act.compact{gap:8px}
.act.compact .tiles{padding:4px 0 8px}
.act.compact .micwrap{min-height:0;flex-direction:row;gap:18px}
.act.compact .mic{width:92px;font-size:42px}
.story-ctl{display:flex;justify-content:center;min-height:70px}
.scards{display:flex;flex-direction:column;gap:16px}
.scard{display:flex;gap:14px;align-items:center;background:var(--card);border-radius:28px;padding:14px 16px;box-shadow:0 6px 0 var(--line)}
.scard .semoji{font-size:60px;flex:none;width:80px;text-align:center}
.scard.locked .semoji{filter:grayscale(1);opacity:.55}

/* end / stickers */
.center{align-items:center;justify-content:center;text-align:center}
.bigtitle{font-size:clamp(34px,9vw,54px);font-weight:700;line-height:1.05}
.stickerbig{font-size:clamp(110px,30vw,190px);line-height:1;animation:reveal 1.1s cubic-bezier(.2,1.4,.4,1) both;filter:drop-shadow(0 10px 12px rgba(43,35,80,.25))}

/* modal */
.modal{position:fixed;inset:0;z-index:80;display:none;background:rgba(30,20,70,.55);padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));overflow-y:auto;-webkit-overflow-scrolling:touch}
.modal.on{display:block}
.mcard{background:var(--card2);color:var(--ink);border-radius:30px;max-width:560px;margin:0 auto;padding:22px;display:flex;flex-direction:column;gap:14px;box-shadow:0 18px 40px rgba(0,0,0,.35);user-select:text;-webkit-user-select:text}
.mcard h2{margin:0;font-size:28px}
.mcard h3{margin:6px 0 0;font-size:19px}
.mcard p{margin:0;font-size:16px;line-height:1.4;color:var(--ink2)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:600;font-size:18px}
.row small{display:block;font-weight:400;color:var(--ink2);font-size:14px}
input[type=text],select{font:inherit;font-size:18px;padding:12px 14px;border-radius:16px;border:3px solid var(--line);background:var(--card2);color:var(--ink);width:100%;user-select:text;-webkit-user-select:text}
.sw{position:relative;width:60px;height:34px;flex:none}
.sw input{appearance:none;-webkit-appearance:none;width:60px;height:34px;border-radius:999px;background:#b9b3d6;margin:0;cursor:pointer;transition:background .2s;position:absolute;inset:0}
.sw input::after{content:"";position:absolute;left:3px;top:3px;width:28px;height:28px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 2px 4px rgba(0,0,0,.3)}
.sw input:checked{background:var(--green)}
.sw input:checked::after{transform:translateX(26px)}
.small-status{font-size:15px;background:var(--card);border-radius:14px;padding:10px 12px;min-height:1.4em}
.lvls{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:16px;font-weight:500}

/* grown-up notes + voice recorder */
.gnote{font-size:14px;line-height:1.35;color:var(--ink2);background:var(--card);border-radius:14px;padding:8px 12px;max-width:460px;text-align:center;margin:6px auto 0}
.gnote button{font:inherit;font-weight:700;color:var(--primary);background:none;border:0;padding:0;text-decoration:underline;cursor:pointer}
.vhead{background:var(--card);border-radius:18px;padding:12px 14px;font-size:15px;line-height:1.4}
.vhead b{font-weight:700}
.col h3.vh{margin:8px 0 0;font-size:20px}
.col h3.vh small{font-weight:400;color:var(--ink2);font-size:15px}
.col p.vp{margin:0;font-size:15px;color:var(--ink2)}
.vlist{display:flex;flex-direction:column;gap:8px}
.vrow{display:flex;align-items:center;gap:8px;background:var(--card2);border-radius:16px;padding:8px 10px;box-shadow:0 3px 0 var(--line)}
.vrow .vl{flex:1;display:flex;align-items:center;gap:10px;min-width:0;font-size:15px;color:var(--ink2)}
.vrow .vl b{font-family:var(--letters);font-size:26px;color:var(--ink);min-width:56px;white-space:nowrap}
.vrow.has .vl b::after{content:" ✓";color:var(--green-d);font-size:18px;font-family:inherit}
.vb{width:46px;height:46px;border-radius:50%;border:0;font-size:18px;flex:none;cursor:pointer;background:var(--card);color:var(--ink);box-shadow:0 3px 0 var(--line)}
.vb.rec{background:var(--pink);color:#fff}
.vb.rec.on{background:#e11d48;animation:recpulse .8s ease-in-out infinite}
.vrow .vt{color:var(--ink);font-weight:600;font-size:16px;line-height:1.3;white-space:normal}
.vsec{background:var(--card);border-radius:18px;padding:4px 12px 10px}
.vsec>summary{font-weight:700;font-size:18px;padding:10px 2px;cursor:pointer}
.vsec .vgo{margin:4px 0 10px}
.gwrap{position:fixed;inset:0;background:rgba(20,16,50,.6);z-index:300;display:grid;place-items:center;padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(14px + env(safe-area-inset-bottom,0px))}

/* A clip as floats, with snapped-open starts softened. iPhone noise suppression holds the mic at silence

   clicks ("I'm Ollie the owl" at 0.04 s). Wherever that happens the start is faded in over 6 ms, about how
   long a natural voice takes to start. Everything else is untouched. Worked out once per clip. */

    for(let j=0;j<L&&s0+j<f.length;j++)f[s0+j]*=.5-.5*Math.cos(Math.PI*j/L);

  for(let k=0;;k++,out+=Hs){

    prev=best;last=out+N;

   (padded to 4 bytes) · the clips' 16-bit samples back to back.

async function fetchVoice(){

    s.style.cssText=`${at?`left:${at.x}px;top:${at.y}px;`:''}--dx:${Math.cos(ang)*r}px;--dy:${Math.sin(ang)*r}px;--r:${(Math.random()-.5)*90}deg;animation-delay:${Math.random()*.15}s`;
    c.appendChild(s);}
}
function rainfall(e,n=26){
  const c=layer();
  for(let i=0;i<n;i++){const s=document.createElement('span');s.className='rf';s.textContent=e;
    s.style.cssText=`left:${Math.random()*100}%;--d:${2+Math.random()*1.8}s;animation-delay:${Math.random()*1.4}s`;c.appendChild(s);}
}

/* ---- tiles ---- */
function tileClasses(tiles){
  let ci=0;
  return tiles.map(t=>{const v=isVowelTile(t),dg=t.t.length>1&&!v;return t.s==='-'?'silent':v?'v':dg?'d':'c'+(ci++%4);});
}
const tileW=t=>t.t.length>2?1.9:t.t.length>1?1.5:1;
function tilesHtml(tiles,tag='span'){
  const cl=tileClasses(tiles);
  return tiles.map((t,i)=>`<${tag} class="tile ${cl[i]}" data-i="${i}" style="--w:${tileW(t)}">${disp(t.t)}</${tag}>`).join('');
}
function layoutTiles(box){
  if(!box)return;
  const els=[...box.children];if(!els.length)return;
  const W=box.clientWidth||(box.parentElement&&box.parentElement.clientWidth)||320;
  const units=els.reduce((s,e)=>s+(parseFloat(e.style.getPropertyValue('--w'))||1),0);
  const gap=Math.max(6,W*.02),max=+box.dataset.max||140;
  const tw=Math.max(34,Math.min(max,(W-gap*(els.length-1))/units));
  box.style.setProperty('--tw',tw+'px');box.style.gap=gap+'px';
}
window.addEventListener('resize',()=>$$('.tiles').forEach(layoutTiles));

/* =====================================================================
   PROGRESS
   ===================================================================== */
function record(word,kind){
  const st=S.words[word.w]||(S.words[word.w]={n:0,ok:0,sc:0,sk:0});
  st.n++;
  if(kind==='clean'){st.ok++;st.sc+=1;}else if(kind==='helped'){st.ok++;st.sc+=.6;}else st.sk++;
  if(kind!=='skip')S.stars++;
  S.recentWords=(S.recentWords||[]).concat(word.w).slice(-8);
  S.recent=(S.recent||[]).concat({l:word.lvl,ok:kind!=='skip'}).slice(-14);
  let msg=null;
  const win=S.recent.filter(r=>r.l===S.frontier);
  if(win.length>=6){
    const rate=win.filter(r=>r.ok).length/win.length;
    if(rate>=.8&&S.frontier<5){S.frontier++;S.recent=[];msg='up';}
    else if(rate<=.35&&S.frontier>1){S.frontier--;S.recent=[];}
  }
  persist();return msg;
}
function earnSticker(){
  const left=STICKERS.filter(s=>!S.stickers.includes(s));
  if(!left.length)return null;
  const s=left[0];S.stickers.push(s);persist();return s;
}
function goalWords(){
  const cand=STORIES.filter(s=>!storyUnlocked(s)).map(s=>({s,miss:s.targets.filter(w=>!isKnown(w))})).sort((a,b)=>a.miss.length-b.miss.length);
  return new Set(cand.length?cand[0].miss:[]);
}
function pickWeighted(pool,goal,exclude){
  const items=pool.filter(w=>!exclude.includes(w));
  if(!items.length)return null;
  const rw=S.recentWords||[];
  const wts=items.map(w=>{
    const st=S.words[w.w];let x=!st||!st.n?2.2:(!isKnown(w.w)?3:.9);
    if(w.lvl===S.frontier)x*=1.4;
    if(goal.has(w.w)&&!isKnown(w.w))x*=2.2;
    if(rw.includes(w.w))x*=.05;
    return x;});
  let r=Math.random()*wts.reduce((a,b)=>a+b,0);
  for(let i=0;i<items.length;i++){r-=wts[i];if(r<=0)return items[i];}
  return items[items.length-1];
}
function buildRound(){
  const goal=goalWords(),pool=WORDS.filter(w=>w.lvl<=S.frontier),chosen=[];
  const warmPool=pool.filter(w=>isKnown(w.w)||w.lvl===1||(S.words[w.w]&&S.words[w.w].ok>0));
  const warm=pickWeighted(warmPool.length?warmPool:pool,new Set(),[]);
  if(warm)chosen.push(warm);
  const stretchPool=WORDS.filter(w=>w.lvl===S.frontier+1&&!isKnown(w.w));
  const stretch=stretchPool.length?pickWeighted(stretchPool,goal,chosen):null;
  while(chosen.length<(stretch?5:6)){const w=pickWeighted(pool,goal,chosen);if(!w)break;chosen.push(w);}
  if(stretch)chosen.splice(Math.min(3,chosen.length),0,stretch);
  return chosen;
}

/* =====================================================================
   WORD ACTIVITY (shared by rounds and stories)
   ===================================================================== */
const GROWN_HOLD=5000;
function mountActivity(host,word,opts){
  const compact=!!opts.compact;
  const a={word,last:-1,misses:0,helped:false,busy:false,dead:false,done:false,tok:0,tip:false,loop:0,fresh:false};
  A=a;
  const fb=!micOK();
  const why=!S.settings.mic?'':!HAS_SR?'nosr':MICBLOCK?MICWHY:'';
  const note=why?`<div class="gnote">Grown-ups: ${micHelp(why)}${why!=='nosr'?` <button data-a="retrymic">Try again</button>`:''}</div>`:'';
  host.innerHTML=`
    <div class="tiles ${compact?'sm':''}" data-max="${compact?96:140}">${tilesHtml(word.tiles,'button')}</div>
    <div class="helpers">
      <button class="btn sm yellow" data-a="sound">💡 Sound it out</button>
    </div>
    <div class="micwrap">
      ${fb?`<div class="say">🗣️ Say the word out loud!</div><button class="btn green ${compact?'':'big'}" data-a="grown"><span>✓ Grown-up: hold to confirm</span></button>${note}`
          :`<button class="mic" data-a="mic" aria-label="Microphone on or off">🎤</button><div class="miclabel">Tap the mic to start listening</div>`}
    </div>
    <div class="bottomrow">
      <button class="link" data-a="skip">Skip ➜</button>
      ${fb?'':`<button class="link hold" data-a="grown" data-grown hidden><span>👪 Grown-up: hold ✓ 5 s</span></button>`}
    </div>`;
  const tilesEl=$('.tiles',host);layoutTiles(tilesEl);
  const micEl=$('.mic',host),labelEl=$('.miclabel',host);
  const litOff=()=>$$('.tile',host).forEach(e=>e.classList.remove('lit'));
  const setMic=s=>{if(!micEl)return;micEl.classList.toggle('listening',s==='listen');micEl.classList.toggle('on',s==='wait');
    if(labelEl)labelEl.textContent=s==='listen'?'Listening… say the word!':s==='wait'?'Mic on · tap to turn off':'Tap the mic to start listening';};
  const showGrown=()=>{const g=$('[data-grown]',host);if(g)g.hidden=false;};
  if(opts.grown)showGrown();   // a word that was skipped before
  // the grown-up ✓ only counts after being held for 5 s (so a child can't just tap it); the button fills up meanwhile
  $$('[data-a="grown"]',host).forEach(b=>{
    let t=0;b.classList.add('hold');
    const stop=()=>{clearTimeout(t);b.classList.remove('holding');};
    b.addEventListener('pointerdown',e=>{if(a.done||a.dead)return;e.preventDefault();stop();void b.offsetWidth;b.classList.add('holding');
      t=setTimeout(()=>{b.classList.remove('holding');if(!a.done&&!a.dead)success();},GROWN_HOLD);});
    ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,stop));
    b.addEventListener('contextmenu',e=>e.preventDefault());
  });

  async function tapTile(i){
    ac();a.helped=true;a.tok++;stopSpeech();litOff();
    const t=word.tiles[i],el=$$('.tile',host)[i];
    el.classList.remove('boing');void el.offsetWidth;el.classList.add('boing');
    const twice=a.last===i;a.last=twice?-1:i;
    if(t.s==='-'){say(`Silent ${t.t}!`,{rate:.85});return;}
    if(!a.tip&&!compact){a.tip=true;setBubble('Nice! Tap each letter, then squish the sounds together.');}
    const my=a.tok,ph=PHK[t.s];
    await sayLetter(t,false);
    // tapped the same letter twice in a row: add the example ("like apple")
    // only when the tile is spelled like the example (no "like zoo" for the s in "was")
    if(twice&&ph&&ph[1].split(' ').includes(t.t.toLowerCase())&&my===a.tok&&!a.dead)await say(`like ${ph[2]}`,{rate:.7});
  }
  async function soundOut(){
    ac();if(a.busy)return;a.helped=true;a.last=-1;const my=++a.tok;stopSpeech();litOff();
    const els=$$('.tile',host);
    for(let i=0;i<word.tiles.length;i++){
      if(a.dead||my!==a.tok)return;
      els[i].classList.add('lit');
      const t=word.tiles[i];
      await sayLetter(t,false);
      if(a.dead||my!==a.tok)return;
      els[i].classList.remove('lit');await sleep(220);
    }
    if(a.dead||my!==a.tok)return;
    setBubble('Now squish the sounds together and say the word!');
  }
  function success(){
    if(a.done)return;a.done=true;clearTimeout(a.ltm);if(MIC.target===target)MIC.target=null;
    if(MIC_ON)micOff();else stopListening();setMic('idle');
    opts.onCorrect((a.helped||a.misses>0)?'helped':'clean');
  }
  async function miss(r){
    a.misses++;clearTimeout(a.ltm);if(MIC_ON)micOff();setMic('idle');   // push to talk: one try per tap
    if(micEl){micEl.classList.remove('shake');void micEl.offsetWidth;micEl.classList.add('shake');}
    const noHear=(r.err==='no-speech'||r.err==='timeout'||!r.heard);
    if(a.misses>=2)showGrown();
    if(noHear){
      if(labelEl)labelEl.textContent="I didn't hear that. Tap the mic and try again!";
      setBubble("I didn't hear you. Tap the mic and try again!",true);return;
    }
    if(labelEl)labelEl.textContent=`I heard “${r.heard}”. Tap the mic and try again!`;
    if(a.misses===1){setBubble(rand(TRY1),true);}
    else if(a.misses===2){await setBubble("Let's sound it out together!",true);if(!a.dead&&!a.done)soundOut();}
    else{setBubble("You're doing great! Try once more, or tap Skip.",true);}
  }
  function blocked(code){
    MIC_ON=false;MICBLOCK=true;MICWHY=code;a.dead=true;
    mountActivity(host,word,opts);
    setBubble("I can't hear you on this device. A grown-up can tap the green button when you read it!",true);
  }
  // Push to talk: a tap listens for one try at this word (see MIC SESSION; the held mic stays open, so
  // starting and stopping recognition makes no chime). A read, a wrong word, or ~8 s of hearing nothing
  // turns it off again; the child taps it for the next try. What it hears while Ollie talks is ignored.
  const target={word:word.w,
    hit:()=>{if(!a.dead&&!a.done)success();},
    miss:r=>{if(!a.dead&&!a.done)miss(r);},
    blocked:code=>{if(!a.dead&&!a.done)blocked(code);},
    idle:()=>{if(!a.dead&&!a.done)setMic('idle');}};
  function listen(){if(a.dead||a.done)return;if(!MIC.live)adbg('mic on');MIC.target=target;MIC.armAt=Date.now();setMic('listen');micSession();if(!HELD)syncACSoon();
    // nothing heard for 8 s (not counting while Ollie talks): stop and ask for another tap
    let quiet=0;clearTimeout(a.ltm);
    const tick=()=>{if(a.dead||a.done||!MIC_ON||MIC.target!==target)return;if(!deafNow())quiet+=500;
      if(quiet>=8000){miss({ok:false,err:'timeout'});return;}a.ltm=setTimeout(tick,500);};
    a.ltm=setTimeout(tick,500);}
  async function mic(){
    if(a.done)return;
    ac();
    if(MIC_ON){clearTimeout(a.ltm);micOff();setMic('idle');return;}
    stopSpeech();litOff();
    if(!MICPRE&&navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){
      // ask for microphone permission first: this is what makes the browser show its "Allow" prompt
      if(labelEl)labelEl.textContent='Getting the microphone ready…';
      try{await probeMic();MICPRE=true;MIC.fresh=true;}
      catch(e){if(a.dead||a.done)return;setMic('idle');return blocked(e.name||'error');}
      if(a.dead||a.done)return;
      await sleep(250);
    }
    MIC_ON=true;listen();
  }
  host.onclick=ev=>{
    if(a.dead)return;
    const t=ev.target.closest('.tile');
    if(t&&host.contains(t))return tapTile(+t.dataset.i);
    const b=ev.target.closest('[data-a]');if(!b)return;
    const act=b.dataset.a;
    if(act==='sound')soundOut();
    else if(act==='mic')mic();
    else if(act==='retrymic'){MICBLOCK=false;MICWHY='';MICPRE=false;a.dead=true;mountActivity(host,word,opts);setBubble('Tap the microphone and say the word!');}
    else if(act==='skip'){if(a.done)return;a.done=true;clearTimeout(a.ltm);if(MIC.target===target)MIC.target=null;if(MIC_ON)micOff();setMic('idle');stopListening();stopSpeech();opts.onSkip();}
  };
}

function sceneMarkup(sc,list,mini){
  const items=sc.d.map(x=>{const [e,l,t,z,fl='']=x.split(',');return {e,l:+l,t:+t,z,g:fl.includes('g'),f:fl.includes('f')};});
  items.sort((a,b)=>(a.g-b.g)||(a.g?a.t-b.t:0));                  // sky first, then ground items back to front
  const deco=items.map(o=>`<div class="it${o.e==='🦉'?' ollie':''}${o.g?' g':''}" style="left:${o.l}%;top:${o.t}%;--s:${o.z}">${o.e==='🦉'?ollieImg():o.f?`<span style="display:inline-block;transform:scaleX(-1)">${o.e}</span>`:o.e}</div>`).join('');

  const render=(fresh)=>{
    $$('.pst',box).forEach(e=>e.remove());
    list.forEach((p,i)=>{const d=document.createElement('div');d.className='pst'+(i===sel?' sel':'')+(fresh&&i===sel?' new':'');d.dataset.i=i;
      d.style.left=p.x+'%';d.style.top=p.y+'%';d.style.setProperty('--s',p.s);d.innerHTML=`<span style="transform:rotate(${p.r||0}deg) scaleX(${p.f?-1:1})">${p.e}</span>`;box.appendChild(d);});
    tools();
  };
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  box.addEventListener('pointerdown',e=>{
    const t=e.target.closest('.pst');
    if(!t){if(sel>=0){sel=-1;render();}return;}
    e.preventDefault();ac();
    sel=+t.dataset.i;const r=box.getBoundingClientRect(),p=list[sel];
    drag={id:e.pointerId,el:t,dx:e.clientX-(r.left+p.x/100*r.width),dy:e.clientY-(r.top+p.y/100*r.height),moved:false};
    try{t.setPointerCapture(e.pointerId);}catch(_){}
    $$('.pst',box).forEach(x=>x.classList.toggle('sel',x===t));t.style.zIndex=50;tools();
  });
  box.addEventListener('pointermove',e=>{
    if(!drag||e.pointerId!==drag.id)return;
    const r=box.getBoundingClientRect(),p=list[sel];
    p.x=Math.round(clamp((e.clientX-drag.dx-r.left)/r.width*100,2,98)*10)/10;
    p.y=Math.round(clamp((e.clientY-drag.dy-r.top)/r.height*100,2,98)*10)/10;
    drag.el.style.left=p.x+'%';drag.el.style.top=p.y+'%';drag.moved=true;
  });
  const end=e=>{
    if(!drag||e.pointerId!==drag.id)return;drag=null;
    // bring the sticker you touched to the front
    if(sel>=0&&sel<list.length-1){list.push(list.splice(sel,1)[0]);sel=list.length-1;}
    persist();render();
  };
  box.addEventListener('pointerup',end);box.addEventListener('pointercancel',end);
  col.addEventListener('click',e=>{
    const add=e.target.closest('[data-add]');
    if(add){
      if(list.length>=60)return;
      ac();FX.pop();
      list.push({e:add.dataset.add,x:Math.round(38+Math.random()*24),y:Math.round(34+Math.random()*24),s:1,f:0});
      sel=list.length-1;persist();render(true);return;
    }
    const b=e.target.closest('[data-p]');if(!b)return;const act=b.dataset.p;
    if(act==='clear'){
      if(!list.length)return;
      if(!clearArm){clearArm=1;b.textContent='Tap again to clear';setTimeout(()=>{clearArm=0;if(document.body.contains(b))b.textContent='Start over';},3500);return;}
      clearArm=0;b.textContent='Start over';list.length=0;sel=-1;persist();render();ac();FX.whoosh();return;
    }
    if(sel<0)return;const p=list[sel];
    if(act==='smaller')p.s=Math.max(.5,Math.round((p.s-.2)*10)/10);
    else if(act==='bigger')p.s=Math.min(2.8,Math.round((p.s+.2)*10)/10);
    else if(act==='flip')p.f=p.f?0:1;
    else if(act==='left'||act==='right')p.r=(((p.r||0)+(act==='left'?-15:15))%360+360)%360;
    else if(act==='del'){list.splice(sel,1);sel=-1;ac();FX.pop();}
    persist();render();
  });
  tools();
}

/* read tokens [a,b) aloud, slowed, highlighting each word as it is spoken */
function storyClip(toks){
  if(!(S.settings.sound&&S.settings.murf))return null;
  const k='m:@'+mkey(toks.map(t=>t.disp).join(' ')),c=CLIPS[k];
  return c&&c.w&&c.w.length===toks.length?{k,c}:null;
}
function segBuf(k,c,t0,t1,rate){
  const bk=`~seg${rate}:${t0.toFixed(3)}:${t1.toFixed(3)}:${k}`;if(BUFS[bk])return BUFS[bk];
  const i0=Math.max(0,Math.floor(t0*c.sr)),i1=Math.min(c.data.length,Math.ceil(t1*c.sr)),n=Math.max(1,i1-i0),fade=Math.round(c.sr*.012);
  const f=new Float32Array(n);
  const src=clipFloat(c);
  for(let i=0;i<n;i++){let v=src[i0+i];if(i<fade)v*=i/fade;if(n-1-i<fade)v*=(n-1-i)/fade;f[i]=v;}
  const y=rate&&rate!==1?stretchPCM(f,c.sr,rate):f,b=ac().createBuffer(1,y.length,c.sr);b.getChannelData(0).set(y);
  return BUFS[bk]=b;
}
async function readAlong(toks,W,a,b,rate0,my){
  const rate=effRate(rate0);
  const sc=storyClip(toks);
  const mineHere=useMine()&&splitSent(toks.slice(a,b).map(x=>x.disp).join(' ')).every(x=>{const c=clipsFor(x);return c&&c.length&&c.every(i=>i.mine);});
  if(sc&&!mineHere&&ac()){
    logSaid(toks.slice(a,b).map(x=>x.disp).join(' '),'ai');
    const w=sc.c.w,end=sc.c.data.length/sc.c.sr;
    const t0=a===0?0:Math.max(w[a-1][1],w[a][0]-.05);
    const t1=b>=toks.length?end:Math.max(w[b-1][1]+.02,Math.min(w[b-1][1]+.09,w[b][0]));
    const buf=segBuf(sc.k,sc.c,t0,t1,rate),t=performance.now();
    const hl=(async()=>{
      for(let q=a;q<b;q++){
        const on=(w[q][0]-t0)/rate*1000,off=Math.max(on+180,(w[q][1]-t0)/rate*1000);
        await sleep(Math.max(0,on-(performance.now()-t)));if(my!==TOK)return;
        const el=W(q);if(el)el.classList.add('on');
        await sleep(Math.max(0,off-(performance.now()-t)));if(el)el.classList.remove('on');
      }})();
    await Promise.all([playBuf(buf),hl]);
    return;
  }
  const idx=[];for(let q=a;q<b;q++)idx.push(q);
  const text=idx.map(q=>toks[q].disp).join(' ');
  const dur=speechDur(text,rate0);
  const wts=idx.map(q=>toks[q].disp.replace(/[^A-Za-z']/g,'').length+2),wsum=wts.reduce((x,y)=>x+y,0);
  const hl=(async()=>{
    if(dur)await sleep(70/rate);
    for(let n=0;n<idx.length;n++){
      if(my!==TOK)return;const el=W(idx[n]);if(el)el.classList.add('on');
      await sleep(dur?Math.max(170,(dur*1000-140)*wts[n]/wsum):460+toks[idx[n]].disp.length*75);
      if(el)el.classList.remove('on');
    }})();
  await Promise.all([say(text,{rate:.7,slow:rate0}),hl]);
}
async function storyPage(){
  stopAll();
  const my=TOK,st=QS.st,s=st.sents[QS.i];
  setView(`<div class="col">
    ${top('',`<button class="rbtn" data-act="stories" aria-label="Back to stories">←</button>`,`<div class="dots">${st.sents.map((_,k)=>`<i class="${k<QS.i?'d':k===QS.i?'c':''}"></i>`).join('')}</div>`)}

    <div class="sent" id="sent">${s.toks.map((t,k)=>`<span class="w ${t.target?'tg':''}" data-k="${k}">${t.disp}</span>`).join(' ')}</div>
    <div id="act" class="act compact"></div>
    <div class="story-ctl" id="ctl"></div>
  </div>`);
  const W=k=>$(`.w[data-k="${k}"]`);
  await sleep(700);if(my!==TOK)return;
  let k=0;
  while(k<s.toks.length){
    let j=k;while(j<s.toks.length&&!s.toks[j].target)j++;
    if(j>k){
      await readAlong(s.toks,W,k,j,.82,my);
      if(my!==TOK)return;
      await sleep(250);if(my!==TOK)return;
    }
    if(j<s.toks.length){
      const tk=s.toks[j],w=BYW[tk.w],el=W(j);
      el.classList.add('active');
      // a skipped word is said by Ollie, then asked again: the story (and its sticker) needs every word read
      let res,skips=0;
      for(;;){
        res=await new Promise(resolve=>{mountActivity($('#act'),w,{compact:true,grown:skips>0,onCorrect:kind=>resolve(kind),onSkip:()=>resolve('skip')});});
        if(my!==TOK)return;
        record(w,res);
        if(res!=='skip')break;
        skips++;$('#act').style.pointerEvents='none';
        await say(`That word is ${w.w}.`,{rate:.75,slow:.85});if(my!==TOK)return;
        $('#act').style.pointerEvents='';
      }
      const sc=$('#starcount');if(sc)sc.textContent=S.stars;
      $('#act').innerHTML='';A=null;
      el.classList.remove('active');el.classList.add('ok');
      FX.ding();burst(w.emoji,6);await sleep(225);await afterMicSettled();
      if(my!==TOK)return;
    }
    k=j+1;
  }
  $('#scene').classList.add('done');
  FX.sparkle();confetti(28);
  const full=s.toks.map(t=>t.disp).join(' ');
  await sleep(400);if(my!==TOK)return;
  await readAlong(s.toks,W,0,s.toks.length,.8,my);
  if(my!==TOK)return;
  const last=QS.i>=st.sents.length-1;
  $('#ctl').innerHTML=`<button class="btn big ${last?'pink':'green'}" data-act="storynext">${last?'The End 🎉':'Next page ➜'}</button>`;
}

/* ---- shared ---- */
const gDotsHtml=(n,d)=>Array.from({length:n},(_,k)=>`<i class="${k<d?'d':k===d?'c':''}"></i>`).join('');
function gDots(n,d){const el=$('.dots');if(el)el.innerHTML=gDotsHtml(n,d);}
function gameFrame(g,n,body){
  setView(`<div class="col game" id="game" data-game="${g.id}">
    ${top('',`<button class="rbtn" data-act="games" aria-label="Back to games">←</button>`,`<div class="dots">${gDotsHtml(n,0)}</div>`)}
    <div class="gbody">${body}</div>
    <div class="hint gabout">Grown-ups: ${g.about}</div>
  </div>`);
  return $('#game');
}
const gSay=w=>say(`${w.w}!`,{rate:.8,slow:.85});
const centerOf=el=>{const r=el.getBoundingClientRect();return {x:r.left+r.width/2,y:r.top+r.height/2};};
// a hint: the answer glows and a hand bounces under it
function gHand(el){gNoHand();if(!el)return;el.classList.add('glow');const h=document.createElement('span');h.className='ghand';h.textContent='👆';el.appendChild(h);}
function gNoHand(){$$('.ghand').forEach(x=>x.remove());$$('.glow').forEach(x=>x.classList.remove('glow'));}
function gShake(el){if(!el)return;el.classList.remove('nope');void el.offsetWidth;el.classList.add('nope');}
function gBoing(el){if(!el)return;el.classList.remove('boing');void el.offsetWidth;el.classList.add('boing');}
function gAnim(el,kf,ms,easing){
  return new Promise(r=>{try{const a=el.animate(kf,{duration:ms,easing:easing||'ease',fill:'forwards'});a.onfinish=a.oncancel=()=>r();setTimeout(r,ms+250);}catch(e){r();}});
}
/* words for a game: the ones the child knows, topped up from their level while there are only a few */
function gamePool(n,ok=()=>true){
  const p=shuffle(WORDS.filter(w=>isKnown(w.w)&&ok(w)));
  if(p.length<n){
    const met=w=>(S.words[w.w]||{}).ok||0;
    p.push(...shuffle(WORDS.filter(w=>!p.includes(w)&&ok(w)&&w.lvl<=Math.max(2,S.frontier))).sort((a,b)=>met(b)-met(a)).slice(0,n-p.length));
  }
  return p;
}
/* n turns from a pool, going through all of it before repeating, never the same (by key) twice in a row */
function gameTurns(pool,n,key=w=>w.w){
  const out=[];let bag=[];
  while(out.length<n&&pool.length){
    if(!bag.length)bag=shuffle(pool);
    const prev=out[out.length-1];let i=bag.findIndex(w=>!prev||key(w)!==key(prev));
    if(i<0){const alt=shuffle(pool).find(w=>key(w)!==key(prev));if(alt){out.push(alt);continue;}i=0;}
    out.push(bag.splice(i,1)[0]);
  }
  return out;
}
/* picture choices: the answer plus others that look different from it and each other, shuffled */
function picChoices(ans,n,ok=()=>true){
  const out=[ans];
  for(const w of shuffle(WORDS.filter(w=>hasPic(w)&&ok(w)))){if(out.length>=n)break;if(out.every(o=>!clash(o,w)))out.push(w);}
  return shuffle(out);
}
const picHtml=ws=>ws.map(w=>`<button class="pic" data-w="${w.w}" aria-label="${w.w}"><span class="em">${w.emoji}</span></button>`).join('');
/* letter tiles, as in a round: a tap plays the letter's sound; "sound out" plays them all in turn */
let GSO=0;
function gTapTile(el,t){GSO++;stopSpeech();$$('.tile.lit').forEach(x=>x.classList.remove('lit'));gBoing(el);return t.s==='-'?say(`Silent ${t.t}!`,{rate:.85}):sayLetter(t,false);}
async function gSoundOut(box,word,my){
  const t0=++GSO,els=$$('.tile',box);stopSpeech();
  for(let k=0;k<word.tiles.length&&els[k];k++){
    if(my!==TOK||t0!==GSO)return;
    els[k].classList.add('lit');await sayLetter(word.tiles[k],false);els[k].classList.remove('lit');
    if(my!==TOK||t0!==GSO)return;await sleep(200);
  }
}

/* ---- Balloon Pop: Ollie says a word; pop the balloon that shows it. A balloon comes up about every
   3 s in one of four lanes (each lane rises at its own speed). The word asked for is usually on a balloon
   already in the sky, sometimes on the next one to come up, now and then the 2nd or 3rd still to come,
   so watching the bottom of the sky doesn't give it away. ---- */
const BCOL=[['#ff5fa2','#fff'],['#4da3ff','#fff'],['#ffd23f','#4a3600'],['#34d399','#fff'],['#ff9f43','#fff'],['#a77bff','#fff']];
function gameBalloons(g,my){
  const N=8,ask=gamePool(6),words=[...new Set([...ask,...gamePool(12)])],LANES=[13,37.5,62.5,87];
  const root=gameFrame(g,N,`<div class="gask"><button class="owl sm" data-g="say" aria-label="Hear the word again">${ollieImg()}</button><button class="gsay" data-g="say" aria-label="Hear the word again">🔊</button></div>
    <div class="gfield" id="gf"><span class="gc" style="left:5%;top:8%">☁️</span><span class="gc" style="left:68%;top:30%;font-size:10cqw">☁️</span><span class="gc" style="left:28%;top:62%;font-size:9cqw">☁️</span></div>`);
  const f=$('#gf'),bs=[],secs=LANES.map(()=>12+Math.random()*3),asked=new Map();   // seconds to cross the sky, per lane
  let i=0,cur=null,misses=0,busy=true,idle=0,last=0,hinted=false,queue=[],nextAt=-1,lastLane=-1,col=Math.floor(Math.random()*BCOL.length);
  const live=()=>bs.filter(b=>!b.popped);
  // the words for the next balloons to come up (null = any other word)
  function decoy(){
    const used=new Set([...live().map(b=>b.w),...queue.filter(Boolean)]);if(cur)used.add(cur);
    const free=words.filter(w=>!used.has(w));
    return rand(free.length?free:words.filter(w=>w!==cur));
  }
  function spawn(lane,y){
    const w=queue.shift()||decoy(),[bg,fg]=BCOL[col++%BCOL.length],el=document.createElement('button'),L=w.w.length;
    el.className='bl';el.dataset.w=w.w;el.setAttribute('aria-label',w.w);
    el.style.cssText=`left:${LANES[lane]}%;--c:${bg};--fg:${fg};--fs:${L<=2?8:L===3?7.2:L===4?6:5}cqw`;
    el.innerHTML=`<i class="bb"><span>${disp(w.w)}</span></i>`;
    f.appendChild(el);
    const b={el,lane,w,y:y===undefined?f.clientHeight+8:y,ph:Math.random()*6.3,popped:false};
    el._b=b;bs.push(b);move(b,0,f.clientHeight);lastLane=lane;
    if(hinted&&w===cur)gHand(el);   // the hint follows the word onto its balloon
    return b;
  }
  function move(b,dt,h){b.y-=h/secs[b.lane]*dt;b.ph+=dt*1.7;b.el.style.transform=`translate3d(${(Math.sin(b.ph)*6).toFixed(1)}px,${b.y.toFixed(1)}px,0)`;}
  // a lane takes a new balloon once its lowest one has risen clear of the bottom
  const freeLanes=(h,w)=>LANES.map((_,k)=>k).filter(k=>!bs.some(b=>!b.popped&&b.lane===k&&b.y>h-w*.42));
  function frame(t){
    if(my!==TOK)return;
    const dt=last?Math.min(.05,(t-last)/1000):0;last=t;
    const h=f.clientHeight,w=f.clientWidth;
    for(const b of bs.slice()){
      if(b.popped)continue;move(b,dt,h);
      if(b.y<-w*.38){b.el.remove();bs.splice(bs.indexOf(b),1);
        if(b.w===cur&&!busy){queue=[cur];nextAt=Math.min(nextAt,t+500);}}   // the word floated away: it comes up again next
    }
    if(nextAt<0)nextAt=t+1800;
    if(t>=nextAt){const fl=freeLanes(h,w);if(fl.length){const o=fl.filter(k=>k!==lastLane);spawn(rand(o.length?o:fl));nextAt=t+2600+Math.random()*600;}}
    requestAnimationFrame(frame);
  }
  // the next word: each balloon in the sky (not about to float away) is as likely as "the next to come up",
  // which is now and then the 2nd or 3rd still to come; words asked less often are likelier, never twice in a row
  function pickWord(){
    const h=f.clientHeight,w=f.clientWidth,prev=cur,r=Math.random();
    const wt=x=>1/(1+(asked.get(x)||0)),pick=l=>{let s=Math.random()*l.reduce((a,x)=>a+wt(x),0);for(const x of l){s-=wt(x);if(s<=0)return x;}return l[l.length-1];};
    const onSky=new Set(live().map(b=>b.w));
    const sky=live().filter(b=>ask.includes(b.w)&&b.w!==prev&&b.y>h*.2&&b.y<h-w*.2).map(b=>b.w);
    const rest=ask.filter(x=>x!==prev&&!onSky.has(x));
    let word,where='sky';queue=[];
    if(sky.length&&(!rest.length||Math.random()<sky.length/(sky.length+1)))word=pick(sky);
    else if(rest.length){const k=r<.6?0:r<.85?1:2;word=pick(rest);queue=[null,null,null].slice(0,k).concat(word);where='q'+k;}
    else{const any=live().filter(b=>ask.includes(b.w)).map(b=>b.w),o=any.filter(x=>x!==prev);
      if(any.length)word=pick(o.length?o:any);else{word=prev||ask[0];queue=[word];where='q0';}}
    asked.set(word,(asked.get(word)||0)+1);
    return {word,where};
  }
  function next(){
    if(my!==TOK)return;
    const p=pickWord();cur=p.word;misses=0;hinted=false;
    root.dataset.t=cur.w;root.dataset.where=p.where;owlTalk();gSay(cur);armIdle();
  }
  const shown=()=>live().find(b=>b.w===cur&&b.y<f.clientHeight-f.clientWidth*.2);
  // nothing popped for a while: point at the word's balloon (once it is up) and say the word again
  function armIdle(ms=9000){clearTimeout(idle);idle=setTimeout(()=>{if(my!==TOK||busy)return;if(!shown()){armIdle(1500);return;}hint();owlTalk();gSay(cur);armIdle();},ms);}
  function hint(){hinted=true;const b=live().find(x=>x.w===cur);if(b)gHand(b.el);}
  function wrong(b){
    misses++;gShake(b.el);FX.bonk();stopSpeech();
    setTimeout(()=>{if(my===TOK&&!busy)gSay(cur);},350);
    if(misses>=2)hint();
    armIdle();
  }
  async function popIt(b){
    busy=true;b.popped=true;hinted=false;clearTimeout(idle);gNoHand();stopSpeech();delete root.dataset.t;
    b.el.classList.add('popped');FX.bpop();burst(hasPic(cur)?cur.emoji:'⭐',8,centerOf(b.el));
    i++;gDots(N,i);
    setTimeout(()=>{b.el.remove();const k=bs.indexOf(b);if(k>=0)bs.splice(k,1);},300);
    await sleep(800);if(my!==TOK)return;
    if(i>=N)return gameEnd(g);
    busy=false;next();
  }
  f.addEventListener('pointerdown',e=>{
    const el=e.target.closest('.bl');if(!el||my!==TOK)return;
    const b=el._b;if(!b||b.popped||busy)return;
    ac();if(b.w===cur)popIt(b);else wrong(b);
  });
  root.addEventListener('click',e=>{if(!e.target.closest('[data-g="say"]')||busy)return;stopSpeech();owlTalk();gSay(cur);armIdle();});
  const h0=f.clientHeight,ln=shuffle([0,1,2,3]);
  [.1,.28,.46,.64,.82].forEach((fr,k)=>spawn(ln[k%4],h0*fr));   // a sky already full of balloons
  requestAnimationFrame(frame);
  setTimeout(()=>{if(my!==TOK)return;busy=false;next();},600);
}

/* ---- Snap It: read the word on the sign, then tap its picture: a photo is taken ---- */
function gameSnap(g,my){

    cur=turns[i];misses=0;

    clearTimeout(idle);

    await gSay(cur);if(my!==TOK)return;
    await playSfx(cur.sfx,my);if(my!==TOK)return;
    await sleep(500);if(my!==TOK)return;

/* ---- Sound Hunt: hear a letter sound (the grown-up's recording), tap the picture that starts with it ---- */
function gameSounds(g,my){

  function show(){
    cur=turns[i];misses=0;const t=first(cur);
    sl.className='tile '+tileClasses(cur.tiles)[0];sl.style.setProperty('--w',tileW(t));sl.textContent=disp(t.t);
    pics.innerHTML=picHtml(picChoices(cur,3,w=>first(w).s!==t.s&&first(w).t[0]!==t.t[0]));
    root.dataset.t=cur.w;busy=false;sound();armIdle();
  }
  function armIdle(){clearTimeout(idle);idle=setTimeout(()=>{if(my!==TOK||busy)return;sound();gHand(answer());},10000);}
  root.addEventListener('click',async e=>{
    if(my!==TOK||busy)return;
    if(e.target.closest('[data-g="snd"]')){ac();sound();armIdle();return;}
    const p=e.target.closest('.pic');if(!p)return;
    ac();
    if(p.dataset.w!==cur.w){
      // say the picture's word: its first sound is different
      misses++;busy=true;gShake(p);FX.bonk();GSO++;stopSpeech();armIdle();
      await gSay(BYW[p.dataset.w]);if(my!==TOK)return;
      await sleep(250);if(my!==TOK)return;
      busy=false;sound();if(misses>=2)gHand(answer());
      return;
    }
    busy=true;clearTimeout(idle);gNoHand();GSO++;stopSpeech();delete root.dataset.t;
    p.classList.add('yes');$$('.pic',pics).forEach(x=>{if(x!==p)x.classList.add('dim');});
    FX.ding();burst(cur.emoji,8,centerOf(p));i++;gDots(N,i);
    await sleep(350);if(my!==TOK)return;
    await gSay(cur);if(my!==TOK)return;
    await sleep(700);if(my!==TOK)return;
    if(i>=N)return gameEnd(g);
    show();
  });
  setTimeout(()=>{if(my===TOK)show();},400);
}

/* =====================================================================
   OLLIE'S QUEST — a side-scrolling platformer, played in landscape. Ollie runs to the right on
   their own; every obstacle or enemy ahead is cleared by tapping the button with its word before
   Ollie reaches it. 30 of them, slow at first, then faster, then a boss: it thinks of an attack
   (thought cloud), and tapping that word before the attack lands dodges it. After 3 attacks Ollie
   strikes back with any word. All art is drawn in code (canvas), the music is a chiptune made live.
   Only the words themselves are spoken (already recorded).
   ===================================================================== */
const TAU=Math.PI*2,INK='#2b1d14';
const clamp01=x=>Math.max(0,Math.min(1,x));
const lerp=(a,b,p)=>a+(b-a)*p;
const easeOut=p=>1-(1-p)*(1-p);
function ell(c,x,y,rx,ry,rot){c.beginPath();c.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),rot||0,0,TAU);}
function rr(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function fs(c,fill,lw){c.fillStyle=fill;c.fill();if(lw!==0){c.lineWidth=lw||2.5;c.strokeStyle=INK;c.stroke();}}
function poly(c,pts){c.beginPath();pts.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y));c.closePath();}

/* ---- Ollie (faces right; origin between the feet). o: t, walk, flap, blink, hurt, char, squash, mon ---- */
function drawOllie(c,o={}){
  const t=o.t||0,w=o.walk||0,ph=t*12;
  const P=o.char?{b:'#3d3230',d:'#2a2120',bel:'#5b4c46',face:'#4e3f3a'}:{b:'#8b5a36',d:'#64391f',bel:'#f6e4c5',face:'#e3b685'};
  c.save();c.lineJoin='round';c.lineCap='round';
  if(o.squash)c.scale(1+o.squash*.6,1-o.squash*.55);
  const lift=k=>w?Math.max(0,Math.sin(ph+k*Math.PI))*7*w:0;
  const foot=(x,l)=>{poly(c,[[x-9,-l],[x+10,-l],[x+5,-l-8],[x-4,-l-8]]);fs(c,'#f39a2b',2.2);};
  foot(-10,lift(1));foot(9,lift(0));
  c.translate(0,w?-Math.abs(Math.sin(ph))*4*w:Math.sin(t*2.2)*1.2);
  poly(c,[[-24,-20],[-36,-12],[-22,-8]]);fs(c,P.d,2.2);                       // tail
  ell(c,0,-38,27,33);fs(c,P.b);                                                // body
  ell(c,4,-28,17,21);fs(c,P.bel,0);                                            // belly
  c.strokeStyle='rgba(150,100,60,.55)';c.lineWidth=1.6;
  for(let r=0;r<3;r++)for(let k=-1;k<=1;k++){c.beginPath();c.arc(4+k*7+(r%2)*3.5,-36+r*8,3.2,0,Math.PI);c.stroke();}
  poly(c,[[-19,-58],[-14,-73],[-5,-63]]);fs(c,P.b,2.2);                        // ear tufts
  poly(c,[[16,-63],[27,-74],[28,-57]]);fs(c,P.b,2.2);
  ell(c,9,-50,21,16);fs(c,P.face,2);                                           // face
  const eye=(x)=>{ell(c,x,-51,8.6,8.6);fs(c,'#fff',2);
    if(o.hurt){c.lineWidth=2.4;c.strokeStyle=INK;c.beginPath();c.moveTo(x-4,-55);c.lineTo(x+4,-47);c.moveTo(x+4,-55);c.lineTo(x-4,-47);c.stroke();}
    else if(o.blink){c.lineWidth=2.4;c.strokeStyle=INK;c.beginPath();c.arc(x,-52,5,.2,Math.PI-.2);c.stroke();}
    else{ell(c,x+2.6,-50.5,4.6,4.8);fs(c,INK,0);ell(c,x+4,-52.5,1.7,1.7);fs(c,'#fff',0);}};
  eye(1);eye(17);
  poly(c,[[7,-45],[15,-45],[11,-36]]);fs(c,'#f5a623',2);                       // beak
  if(o.mon){c.lineWidth=3;c.strokeStyle='#e8b52c';ell(c,17,-51,11,11);c.fillStyle='rgba(210,235,255,.28)';c.fill();c.stroke();
    c.lineWidth=1.6;c.setLineDash([2.5,2]);c.beginPath();c.moveTo(26,-45);c.quadraticCurveTo(30,-30,20,-20);c.stroke();c.setLineDash([]);
    ell(c,13,-55,3,1.6,-.6);c.fillStyle='rgba(255,255,255,.8)';c.fill();}
  if(o.phones){c.lineWidth=5.5;c.strokeStyle='#ff5fa2';c.beginPath();c.arc(6,-55,25,Math.PI*1.06,Math.PI*1.94);c.stroke();          // DJ Spinster's headphones
    rr(c,-26,-62,12,20,6);fs(c,'#ff5fa2',2.2);rr(c,-23,-58,6,12,3);fs(c,'#2b2350',0);rr(c,28,-64,9,17,4);fs(c,'#ff5fa2',2);}
  if(o.wand){c.save();c.translate(24,-24);c.rotate(.7+Math.sin(t*3)*.1);rr(c,-2.2,-30,4.4,30,2);fs(c,'#1e1e28',1.4);rr(c,-2.2,-30,4.4,6,2);fs(c,'#fff',1.2);   // Foxini's wand
    c.translate(0,-36);c.rotate(t*2);starPath(c,7);fs(c,'#ffd23f',1.4);c.restore();}
  // wing (in front), flapping
  const ang=o.flap?Math.sin(t*28)*.9-.4:Math.sin(t*3)*.1+(w?Math.sin(ph)*.18:0);
  c.save();c.translate(-6,-46);c.rotate(-.15+ang);ell(c,-2,17,10,19,.15);fs(c,P.d,2.2);
  c.strokeStyle='rgba(255,255,255,.18)';c.lineWidth=1.5;c.beginPath();c.moveTo(-4,8);c.lineTo(-2,28);c.moveTo(2,10);c.lineTo(3,28);c.stroke();c.restore();
  c.restore();
}
/* Ollie as a picture for the rest of the app (with whatever Ollie is wearing) */
const OLLIE_URLS={};
function ollieURL(){
  const w=worn().slice().sort(),k=w.join(',')||'-';
  if(OLLIE_URLS[k])return OLLIE_URLS[k];
  try{const cv=document.createElement('canvas');cv.width=cv.height=220;const c=cv.getContext('2d');
    c.translate(108,212);c.scale(2.45,2.45);drawOllie(c,wearOpts(w));return OLLIE_URLS[k]=cv.toDataURL('image/png');}catch(e){return '';}
}
const ollieImg=()=>{const u=ollieURL();return u?`<img class="ollie-i" src="${u}" alt="" draggable="false">`:'🦉';};

/* ---- farm level characters (face left, towards Ollie; origin on the ground under them) ---- */
function drawCow(c,t,o={}){
  c.save();c.lineJoin='round';c.lineCap='round';
  const s=o.puff||0;                                   // 0..1: blown up like a balloon
  if(s){c.translate(0,-40);c.scale(1+s*.55,1+s*.75);c.translate(0,40);}
  const leg=(x,ph)=>{const a=s?Math.sin(t*9+ph)*.5:0;c.save();c.translate(x,-24);c.rotate(a);rr(c,-5,0,10,24,4);fs(c,'#fff',2.2);rr(c,-5,17,10,7,3);fs(c,'#3a2a22',0);c.restore();};
  leg(-32,0);leg(-16,1);leg(18,2);leg(34,3);
  const sw=Math.sin(t*3)*8;                            // tail
  c.lineWidth=3;c.strokeStyle=INK;c.beginPath();c.moveTo(46,-54);c.quadraticCurveTo(62,-50,58+sw*.4,-28);c.stroke();
  ell(c,58+sw*.4,-25,4,6);fs(c,'#3a2a22',0);
  rr(c,-48,-66,98,46,23);fs(c,'#fff',0);              // body with spots
  c.save();rr(c,-48,-66,98,46,23);c.clip();
  [[-22,-50,12,9],[14,-56,15,10],[34,-36,9,7],[-4,-30,8,5]].forEach(([x,y,a,b])=>{ell(c,x,y,a,b,.3);fs(c,'#2f2622',0);});c.restore();
  rr(c,-48,-66,98,46,23);c.lineWidth=2.5;c.strokeStyle=INK;c.stroke();
  ell(c,8,-20,9,5);fs(c,'#f7b8c4',2);                 // udder
  const ch=Math.sin(t*7)*1.4;                          // head, chewing
  c.save();c.translate(-50,-58);
  ell(c,6,-14,8,4,-.5);fs(c,'#fff',2);                 // ear
  c.beginPath();c.moveTo(-4,-17);c.quadraticCurveTo(-8,-28,-2,-30);c.lineWidth=4;c.strokeStyle='#efe3c4';c.stroke();
  ell(c,-6,0,20,17);fs(c,'#fff');
  ell(c,-16,10+ch,14,10);fs(c,'#f7b8c4',2);
  ell(c,-21,9+ch,2,3);fs(c,INK,0);ell(c,-12,9+ch,2,3);fs(c,INK,0);
  ell(c,-9,-5,3.6,4);fs(c,INK,0);ell(c,-8,-6.5,1.3,1.3);fs(c,'#fff',0);
  if(o.surprised){c.lineWidth=2;c.strokeStyle=INK;c.beginPath();c.moveTo(-14,-13);c.lineTo(-4,-15);c.stroke();}
  c.restore();
  if(s>0){c.lineWidth=1.5;c.strokeStyle='#888';c.beginPath();c.moveTo(0,-20);c.quadraticCurveTo(6,10,-4,30);c.stroke();}
  c.restore();
}
function drawSun(c,t,o={}){
  c.save();c.lineJoin='round';
  c.save();c.rotate(t*.6);
  for(let k=0;k<12;k++){c.rotate(TAU/12);poly(c,[[-6,-34],[6,-34],[0,-50-(k%2)*6]]);fs(c,'#ffb21f',2);}
  c.restore();
  ell(c,0,0,32,32);const g=c.createRadialGradient(-8,-10,4,0,0,34);g.addColorStop(0,'#fff27a');g.addColorStop(1,'#ffc21f');fs(c,g,2.6);
  ell(c,-18,8,6,4);fs(c,'rgba(255,120,80,.45)',0);ell(c,18,8,6,4);fs(c,'rgba(255,120,80,.45)',0);
  if(o.cool){rr(c,-24,-12,20,13,6);fs(c,'#1d1d2b',2);rr(c,4,-12,20,13,6);fs(c,'#1d1d2b',2);
    c.lineWidth=2.5;c.strokeStyle=INK;c.beginPath();c.moveTo(-4,-7);c.lineTo(4,-7);c.stroke();
    ell(c,-17,-8,4,2,-.4);fs(c,'rgba(255,255,255,.5)',0);
    c.beginPath();c.arc(0,6,11,.25,Math.PI-.25);c.lineWidth=2.5;c.stroke();}
  else{ell(c,-11,-6,4,5);fs(c,INK,0);ell(c,11,-6,4,5);fs(c,INK,0);   // smug grin
    c.lineWidth=2.4;c.strokeStyle=INK;c.beginPath();c.moveTo(-18,-15);c.lineTo(-6,-12);c.moveTo(18,-15);c.lineTo(6,-12);c.stroke();
    c.beginPath();c.moveTo(-13,7);c.quadraticCurveTo(0,20,14,5);c.stroke();}
  c.restore();
}
function drawBeam(c,x,top,bottom,t,a){
  if(a<=0)return;c.save();c.globalAlpha=a;
  const g=c.createLinearGradient(0,top,0,bottom);g.addColorStop(0,'rgba(255,240,120,.15)');g.addColorStop(1,'rgba(255,140,40,.7)');
  poly(c,[[x-14,top],[x+14,top],[x+40,bottom],[x-40,bottom]]);c.fillStyle=g;c.fill();
  c.strokeStyle='rgba(255,255,220,.55)';c.lineWidth=2;
  for(let k=0;k<3;k++){const yy=top+((t*160+k*60)%(bottom-top));const hw=14+26*(yy-top)/(bottom-top);c.beginPath();c.moveTo(x-hw,yy);c.lineTo(x+hw,yy);c.stroke();}
  ell(c,x,bottom,46,9);c.fillStyle='rgba(255,110,30,.45)';c.fill();
  c.restore();
}
function drawRat(c,t,o={}){
  c.save();c.lineJoin='round';c.lineCap='round';
  if(o.flip)c.scale(-1,1);
  const lunge=o.lunge||0,run=o.run||0;c.translate(-lunge*26,0);
  c.lineWidth=3;c.strokeStyle='#e79aa6';c.beginPath();c.moveTo(24,-12);
  c.bezierCurveTo(44,-6+Math.sin(t*6)*6,52,-34,66,-26+Math.sin(t*6+1)*5);c.stroke();     // tail
  const lg=(x,k)=>{const sw=run?Math.sin(t*38+k*Math.PI)*7:0;c.lineWidth=3.2;c.strokeStyle='#8f8fa0';c.beginPath();c.moveTo(x,-8);c.lineTo(x+sw,-1);c.stroke();ell(c,x+sw,-1,5,2.6);fs(c,'#e79aa6',1.6);};
  lg(-16,0);lg(-8,1);lg(10,1);lg(18,0);
  ell(c,0,-15,28,15);fs(c,'#8f8fa0');                  // body
  if(o.spiky){c.lineWidth=2;c.strokeStyle=INK;c.beginPath();for(let k=0;k<9;k++){const x=-20+k*5;c.moveTo(x,-27+Math.abs(Math.sin(k))*2);c.lineTo(x+2.5,-38);c.lineTo(x+5,-27);}c.stroke();}
  ell(c,6,-11,15,7);fs(c,'#b5b5c4',0);
  ell(c,-22,-28,8,9);fs(c,'#8f8fa0',2.2);ell(c,-22,-28,4.5,5.5);fs(c,'#f3a6b4',0);   // ear
  const mo=lunge>.3;                                    // head
  poly(c,[[-14,-27],[-50,-16],[-14,-5]]);fs(c,'#8f8fa0',2.4);
  ell(c,-50,-16,4,4);fs(c,'#ff7a93',1.6);
  if(mo){poly(c,[[-38,-11],[-34,-3],[-30,-11]]);fs(c,'#fff',1.4);}
  else{rr(c,-40,-11,4,6,1);fs(c,'#fff',1.4);rr(c,-35,-11,4,6,1);fs(c,'#fff',1.4);}
  ell(c,-28,-20,3.6,3.6);fs(c,'#e0245e',0);ell(c,-29,-21,1.2,1.2);fs(c,'#fff',0);
  c.lineWidth=2;c.strokeStyle=INK;c.beginPath();c.moveTo(-31,-25);c.lineTo(-22,-23);c.stroke();     // angry brow
  c.lineWidth=1;c.strokeStyle='#555';c.beginPath();c.moveTo(-46,-17);c.lineTo(-60,-22);c.moveTo(-46,-14);c.lineTo(-60,-12);c.stroke();
  c.restore();
}
function drawParachute(c,t){

/* ---- the boss: Baron Von Moo, a cow with a monocle in a rickety tractor mech (faces left) ---- */
function drawBoss(c,t,o={}){

  const hipY=-112+step*4;
  const leg=(x,k)=>{const kn=Math.sin(t*(3+an*1.6)+k*Math.PI)*8;
    c.lineWidth=13;c.strokeStyle='#5d6475';c.beginPath();c.moveTo(x,hipY);c.lineTo(x-10+kn,-58);c.lineTo(x,-16);c.stroke();
    c.lineWidth=8;c.strokeStyle='#a9b1c4';c.beginPath();c.moveTo(x,hipY);c.lineTo(x-10+kn,-58);c.lineTo(x,-16);c.stroke();
    ell(c,x-10+kn,-58,8,8);fs(c,'#e1b23a',2.2);rr(c,x-26,-18,48,18,6);fs(c,'#3d4252',2.4);};

  // smokestack

  if(an>=2){for(let k=0;k<3;k++){const fl=Math.sin(t*20+k)*6;poly(c,[[-46+k*6,-244],[-42+k*6,-268-fl-k*4],[-38+k*6,-244]]);fs(c,k%2?'#ffd23f':'#ff6a2b',0);}}
  // tractor body
  rr(c,-92,-196,176,86,20);const bg=c.createLinearGradient(0,-196,0,-110);bg.addColorStop(0,an?'#ff4b3a':'#e8453a');bg.addColorStop(1,'#a8231b');fs(c,bg,3);
  rr(c,-80,-188,90,10,5);fs(c,'rgba(255,255,255,.28)',0);
  rr(c,-104,-186,26,66,8);fs(c,'#3d4252',2.6);for(let k=0;k<5;k++){rr(c,-100,-180+k*12,18,5,2);fs(c,'#9aa3b5',0);}   // grill
  ell(c,-92,-128,10,10);fs(c,'#fff6b0',2.4);
  [-60,-30,0,30,60].forEach(x=>{ell(c,x,-118,3,3);fs(c,'#7a1a14',0);});
  // small front wheel
  c.save();c.translate(-58,-104);ell(c,0,0,22,22);fs(c,'#2a2a33',2.4);c.rotate(t*2);ell(c,0,0,9,9);fs(c,'#ffd23f',2);c.restore();
  leg(-30,0);
  // cockpit and the Baron
  rr(c,-18,-272,92,80,14);fs(c,'rgba(190,230,255,.55)',3);
  c.save();c.translate(30,-226+Math.sin(t*4)*1.5);
  ell(c,20,-18,9,5,.5);fs(c,'#fff',2);
  ell(c,0,0,30,26);fs(c,'#fff',2.6);
  c.save();ell(c,0,0,30,26);c.clip();ell(c,16,-12,13,10,.4);fs(c,'#2f2622',0);c.restore();ell(c,0,0,30,26);c.lineWidth=2.6;c.strokeStyle=INK;c.stroke();
  // top hat
  rr(c,-14,-48,30,26,3);fs(c,'#1e1e28',2.4);rr(c,-22,-26,46,7,3);fs(c,'#1e1e28',2.4);rr(c,-14,-32,30,6,1);fs(c,'#b0233a',0);
  ell(c,-18,14,17,12);fs(c,an?'#ff9fb0':'#f7b8c4',2.4);ell(c,-24,13,2.4,3.4);fs(c,INK,0);ell(c,-13,13,2.4,3.4);fs(c,INK,0);
  // mustache
  c.lineWidth=4;c.strokeStyle='#2a1a10';c.beginPath();c.moveTo(-18,22);c.quadraticCurveTo(-34,30,-38,20);c.moveTo(-18,22);c.quadraticCurveTo(-4,30,2,20);c.stroke();

    if(ey){c.lineWidth=2.2;c.strokeStyle=INK;c.beginPath();c.moveTo(x-3,y-3);c.lineTo(x+3,y+3);c.moveTo(x+3,y-3);c.lineTo(x-3,y+3);c.stroke();}
    else{ell(c,x-1.5,y+.5,2.8,3);fs(c,an>=2?'#d0021b':INK,0);}});
  if(!o.noMonocle){c.lineWidth=3;c.strokeStyle='#e8b52c';ell(c,-12,-6,10,10);c.fillStyle='rgba(210,235,255,.25)';c.fill();c.stroke();
    c.lineWidth=1.5;c.setLineDash([2.5,2]);c.beginPath();c.moveTo(-3,-1);c.quadraticCurveTo(4,20,-6,30);c.stroke();c.setLineDash([]);}
  // brows get angrier
  c.lineWidth=3.2;c.strokeStyle=INK;const bs=an*4;c.beginPath();c.moveTo(-20,-16-bs*.2);c.lineTo(-5,-13+bs);c.moveTo(16,-16-bs*.2);c.lineTo(2,-13+bs);c.stroke();
  c.restore();

function drawBunny(c,t){c.save();c.rotate(Math.sin(t*10)*.2);ell(c,-6,-22,5,14,-.2);fs(c,'#fff',2);ell(c,6,-22,5,14,.2);fs(c,'#fff',2);ell(c,0,0,13,12);fs(c,'#fff',2.2);

/* ---- cave and forest backgrounds ---- */
function drawCave(c,W,H,sc,t,mood){
  const GY=300,g=c.createLinearGradient(0,0,0,GY);g.addColorStop(0,'#1d1638');g.addColorStop(1,'#3d2f6a');c.fillStyle=g;c.fillRect(0,0,W,H);
  // far rock walls with glowing crystals
  const wall=(k,base,amp,col)=>{c.beginPath();c.moveTo(0,H);for(let x=0;x<=W+20;x+=18){const X=x+sc*k;c.lineTo(x,base+Math.sin(X*.006)*amp+Math.sin(X*.017)*amp*.5);}c.lineTo(W,H);c.closePath();c.fillStyle=col;c.fill();};
  wall(.1,170,30,'#2c2350');
  const glow=c.createLinearGradient(0,200,0,250);glow.addColorStop(0,'rgba(255,110,40,0)');glow.addColorStop(1,'rgba(255,110,40,.35)');c.fillStyle=glow;c.fillRect(0,200,W,50);   // lava river far away
  wall(.25,215,22,'#3a2d63');
  const T=230,off=(sc*.45)%T,i0=Math.floor(sc*.45/T);
  for(let k=-1;k<W/T+2;k++){const i=i0+k,x=k*T-off,h=hash(i);
    const cx=x+60+h*100,col=h<.5?'#6ef0ff':'#ff7ad9';
    c.save();c.globalAlpha=.85;poly(c,[[cx-10,262],[cx-4,226-h*20],[cx+3,262]]);fs(c,col,2);poly(c,[[cx+2,262],[cx+10,236-h*14],[cx+16,262]]);fs(c,col,2);c.restore();
    const gl=c.createRadialGradient(cx,246,2,cx,246,40);gl.addColorStop(0,h<.5?'rgba(110,240,255,.35)':'rgba(255,122,217,.35)');gl.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=gl;c.fillRect(cx-40,206,80,80);
    if(hash(i+5)<.5){const mx=x+170;rr(c,mx-3,250,6,14,3);fs(c,'#e6dcc8',1.6);ell(c,mx,250,11,7);fs(c,'#7ad3ff',1.8);}
  }
  // stalactites hanging from the ceiling
  const so=(sc*.7)%120;for(let x=-so;x<W+120;x+=120){const i=Math.floor((x+sc*.7)/120),h=30+hash(i)*60;poly(c,[[x,0],[x+18,h],[x+36,0]]);fs(c,'#4a3c78',2.2);
    poly(c,[[x+50,0],[x+60,h*.5],[x+70,0]]);fs(c,'#3e3268',2);}
  // floor
  c.fillStyle='#4a3d68';c.fillRect(0,262,W,24);c.fillStyle='#5c4b7a';c.fillRect(0,282,W,H-282);c.fillStyle='#4a3c66';c.fillRect(0,282,W,4);
  c.fillStyle='#4a3c66';const go=sc%80;for(let x=-go;x<W+80;x+=80){ell(c,x+20,GY+22,10,3);c.fill();ell(c,x+58,GY+44,7,2);c.fill();}
  if(mood){c.save();c.globalAlpha=mood*.35;['#ff5fa2','#4da3ff','#34d399','#ffd23f'].forEach((col,k)=>{const a=Math.sin(t*1.4+k*1.6)*.5;c.save();c.translate(W*.72,0);c.rotate(a);
    poly(c,[[-8,0],[8,0],[60,GY],[-60,GY]]);c.fillStyle=col;c.fill();c.restore();});c.restore();}
}
function drawForest(c,W,H,sc,t,mood){
  const GY=300,g=c.createLinearGradient(0,0,0,GY);
  g.addColorStop(0,mood?`rgb(${lerp(120,60,mood)|0},${lerp(200,50,mood)|0},${lerp(170,110,mood)|0})`:'#8fd6c0');g.addColorStop(1,mood?'#e8a6c8':'#e6f6d6');c.fillStyle=g;c.fillRect(0,0,W,H);
  // misty far pines
  const pine=(x,y,h,col)=>{poly(c,[[x-h*.32,y],[x,y-h],[x+h*.32,y]]);c.fillStyle=col;c.fill();};
  for(const [k,base,col,step,hh] of [[.1,232,mood?'#5a6a8a':'#9cc9a8',70,110],[.22,248,mood?'#4a5a78':'#6fae80',90,140]]){
    const off=(sc*k)%step,i0=Math.floor(sc*k/step);for(let j=-1;j<W/step+2;j++){const i=i0+j;pine(j*step-off+hash(i)*30,base,hh*(.7+hash(i+2)*.5),col);}}
  // sunbeams
  c.save();c.globalAlpha=mood?.08:.18;c.fillStyle='#fffbd0';for(let k=0;k<4;k++){const x=((k*260-sc*.3)%(W+300)+W+300)%(W+300)-150;poly(c,[[x,0],[x+50,0],[x+170,GY],[x+90,GY]]);c.fill();}c.restore();
  // big trunks with canopies
  const T=240,off=(sc*.5)%T,i0=Math.floor(sc*.5/T);
  for(let k=-1;k<W/T+2;k++){const i=i0+k,x=k*T-off+hash(i)*80;rr(c,x+40,90,30,180,6);fs(c,'#6d4528',2.4);
    c.strokeStyle='rgba(40,20,10,.35)';c.lineWidth=2;c.beginPath();c.moveTo(x+50,120);c.lineTo(x+48,240);c.moveTo(x+60,140);c.lineTo(x+62,250);c.stroke();
    [[x+55,80,60],[x+15,110,40],[x+95,104,44]].forEach(([cx,cy,r])=>{ell(c,cx,cy,r,r*.8);fs(c,mood?'#2f5a3c':'#3f9a4d',2.4);});
    ell(c,x+40,70,16,10);fs(c,'rgba(255,255,255,.15)',0);
    if(hash(i+4)<.6){const mx=x+150;rr(c,mx-3,258,6,12,3);fs(c,'#f4ead8',1.6);ell(c,mx,258,12,8);fs(c,'#e8453a',1.8);ell(c,mx-4,255,2.5,2);fs(c,'#fff',0);}}
  // ferns and the trail
  c.fillStyle=mood?'#3a6a44':'#4caf50';c.fillRect(0,262,W,24);
  const fo=(sc*.8)%60;for(let x=-fo;x<W+60;x+=60){c.save();c.translate(x,280);for(let k=-2;k<=2;k++){c.save();c.rotate(k*.35);ell(c,0,-14,4,14);c.fillStyle=mood?'#2f5a3c':'#2e8b3e';c.fill();c.restore();}c.restore();}
  c.fillStyle='#c4925a';c.fillRect(0,282,W,H-282);c.fillStyle='#a8774a';c.fillRect(0,282,W,4);
  const go=sc%90;for(let x=-go;x<W+90;x+=90){ell(c,x+20,GY+22,10,3);c.fill();ell(c,x+64,GY+44,7,2);c.fill();}
  if(mood){for(let k=0;k<12;k++){const x=(hash(k)*W+Math.sin(t+k)*30),y=60+hash(k+9)*200+Math.cos(t*1.3+k)*10;c.globalAlpha=.5+Math.sin(t*4+k)*.5;ell(c,x,y,2.5,2.5);c.fillStyle='#fff27a';c.fill();}c.globalAlpha=1;}
}

];
const qBeaten=i=>{const L=QLEVELS[i];return !!((S.qbeat||{})[L.id]||(L.id==='farm'&&((S.cos||{}).owned||[]).includes('monocle')));};
